name: CI — Lint & Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint, Gitleaks & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    services:
      postgres:
        image: postgres:18.0-alpine3.22
        env:
          POSTGRES_DB: greenkube_test
          POSTGRES_USER: greenkube
          POSTGRES_PASSWORD: greenkube_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U greenkube -d greenkube_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GREENKUBE_TEST_POSTGRES_DSN: postgresql://greenkube:greenkube_password@localhost:5432/greenkube_test

    steps:
      - name: Check out code (full history for Gitleaks)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies from the lockfile
        run: uv sync --locked --group test

      - name: Lint for hardcoded secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: Lint with Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type-check with Pyrefly
        run: uv run pyrefly check

      - name: Run tests with pytest (coverage gate from pyproject.toml)
        run: uv run pytest --cov=greenkube --cov-report=term-missing --tb=short --no-header --color=no

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.17.3'

      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version=0.7.2

      - name: Lint Helm Chart
        run: helm lint ./helm-chart

      - name: Run Helm unit tests
        run: helm unittest helm-chart

      - name: Check that helm template renders are stable (Argo CD)
        run: |
          set -euo pipefail
          check() {
            helm template greenkube ./helm-chart --namespace greenkube "$@" > /tmp/render-1.yaml
            helm template greenkube ./helm-chart --namespace greenkube "$@" > /tmp/render-2.yaml
            diff -u /tmp/render-1.yaml /tmp/render-2.yaml
          }
          check
          check --set automation.enabled=true
          check --set profile=production
          check -f helm-chart/values-production.yaml
          check --set secrets.apiKey=ci-api-key --set postgres.auth.password=ci-password
