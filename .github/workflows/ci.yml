name: CI — Lint & Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint, Gitleaks & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    services:
      postgres:
        image: postgres:18.0-alpine3.22
        env:
          POSTGRES_DB: greenkube_test
          POSTGRES_USER: greenkube
          POSTGRES_PASSWORD: greenkube_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U greenkube -d greenkube_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GREENKUBE_TEST_POSTGRES_DSN: postgresql://greenkube:greenkube_password@localhost:5432/greenkube_test
      # pg_dump/pg_restore matching the server, for the backup restore test.
      GREENKUBE_TEST_PG_CLIENT: docker run --rm -i --network host postgres:18.0-alpine3.22

    steps:
      - name: Check out code (full history for Gitleaks)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Install dependencies from the lockfile
        run: uv sync --locked --group test

      - name: Lint for hardcoded secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: Lint with Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type-check with Pyrefly
        run: uv run pyrefly check

      - name: Run tests with pytest (coverage gate from pyproject.toml)
        # shell: bash runs with -o pipefail, so a failing pytest (or coverage
        # gate) fails this step even though its output is piped through tee.
        shell: bash
        run: |
          set -o pipefail
          uv run pytest --cov=greenkube --cov-report=term-missing --tb=short --no-header --color=no -rs | tee pytest.log

      # The PostgreSQL service above must reach every live-PostgreSQL test (O8).
      - name: Check that the PostgreSQL tests ran
        run: .github/scripts/check-postgres-ran.sh pytest.log

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: '3.17.3'

      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version=0.7.2

      - name: Lint Helm Chart
        run: helm lint ./helm-chart

      - name: Run Helm unit tests
        run: helm unittest helm-chart

      - name: Unit-test the PrometheusRule alerts with promtool
        run: .github/scripts/promtool-check.sh

      - name: Check that helm template renders are stable (Argo CD)
        run: |
          set -euo pipefail
          check() {
            helm template greenkube ./helm-chart --namespace greenkube "$@" > /tmp/render-1.yaml
            helm template greenkube ./helm-chart --namespace greenkube "$@" > /tmp/render-2.yaml
            diff -u /tmp/render-1.yaml /tmp/render-2.yaml
          }
          check
          check --set api.replicas=2 --set controller.replicas=2
          check --set worker.replicas=1
          check --set automation.enabled=true --set profile=production
          check --set secrets.apiKey=ci-api-key --set postgres.auth.password=ci-password

  # Pod Security Admission "restricted" (roadmap N5): server-side dry run of
  # several renders in a namespace that enforces the profile on kind.
  psa-restricted:
    name: Pod Security (restricted)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: '3.17.3'

      - name: Create a kind cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: psa

      - name: Dry-run the chart under Pod Security "restricted"
        run: .github/scripts/psa-restricted-check.sh

  # Workflow syntax and shell checks of .github/workflows.
  actionlint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run actionlint
        # rhysd/actionlint:1.7.7
        run: docker run --rm -v "${PWD}:/repo" -w /repo rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
