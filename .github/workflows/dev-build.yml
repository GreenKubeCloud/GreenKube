name: Dev — Build & Push

# Builds a development Docker image on every push to the dev branch.
# Images are tagged: dev-<short-sha> and dev-latest.
# This lets you test the latest development image in staging environments
# without polluting the release tag namespace.

on:
  push:
    branches: [dev]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-dev-image:
    name: Build Dev Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Install locked test dependencies
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Validate development dependencies
        run: uv sync --locked --group test

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract short SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push dev image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            greenkube/greenkube:dev-${{ steps.vars.outputs.short_sha }}
            greenkube/greenkube:dev-latest
          platforms: linux/amd64,linux/arm64
          pull: true
          build-args: |
            APT_CACHE_BUST=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and smoke-test the dev image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: greenkube/greenkube:dev-smoke
          pull: true
          build-args: |
            APT_CACHE_BUST=${{ github.run_id }}-${{ github.run_attempt }}

      - name: Run image smoke test
        run: docker run --rm greenkube/greenkube:dev-smoke --help
