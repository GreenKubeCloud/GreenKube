name: Dev — Build & Push

# Builds a development Docker image on every push to the dev branch.
# Images are tagged: dev-<short-sha> and dev-latest.
# This lets you test the latest development image in staging environments
# without polluting the release tag namespace.

on:
  push:
    branches: [dev]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-dev-image:
    name: Build Dev Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install locked test dependencies
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Validate development dependencies
        run: uv sync --locked --group test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract short SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push dev image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            greenkube/greenkube:dev-${{ steps.vars.outputs.short_sha }}
            greenkube/greenkube:dev-latest
          platforms: linux/amd64,linux/arm64
          pull: true
          build-args: |
            APT_CACHE_BUST=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and smoke-test the dev image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: greenkube/greenkube:dev-smoke
          pull: true
          build-args: |
            APT_CACHE_BUST=${{ github.run_id }}-${{ github.run_attempt }}

      - name: Run image smoke test
        run: docker run --rm greenkube/greenkube:dev-smoke --help
