name: Release — Build, Publish & GitHub Release

# Triggered when a semver tag is pushed (e.g. v0.3.0).
# 1. Runs the full test suite, the frontend tests, the end-to-end loop
#    (e2e-nightly.yml) and the 0.3.1 upgrade test (upgrade-test.yml): nothing
#    is built or published unless all four pass.
# 2. Builds and pushes Docker image tagged with the version + "latest", then
#    signs it with cosign (keyless, GitHub OIDC), attaches a syft SPDX SBOM as
#    a signed attestation and publishes SLSA build provenance (O6).
# 3. Packages and publishes the Helm chart to GitHub Pages, with provenance.
# 4. Creates a GitHub Release with the changelog for this version, the SBOM
#    and the signed chart package.
#
# Every action is pinned by commit SHA (Dependabot keeps the pins current).
# Verify a release: see SECURITY.md "Verifying releases".

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE: greenkube/greenkube

permissions:
  contents: read

jobs:
  # ── Gate: run the full test suite before building anything ──
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    # The whole suite in one process (ci.yml runs it in shards) takes over
    # 20 minutes on a hosted runner.
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:18.0-alpine3.22
        env:
          POSTGRES_DB: greenkube_test
          POSTGRES_USER: greenkube
          POSTGRES_PASSWORD: greenkube_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U greenkube -d greenkube_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GREENKUBE_TEST_POSTGRES_DSN: postgresql://greenkube:greenkube_password@localhost:5432/greenkube_test
      # pg_dump/pg_restore matching the server, for the backup restore test.
      GREENKUBE_TEST_PG_CLIENT: docker run --rm -i --network host postgres:18.0-alpine3.22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Install dependencies from the lockfile
        run: uv sync --locked --group test

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type-check with Pyrefly
        run: uv run pyrefly check

      - name: Test with coverage
        # shell: bash runs with -o pipefail, so a failing pytest (or coverage
        # gate) fails this step even though its output is piped through tee.
        shell: bash
        run: |
          set -o pipefail
          uv run pytest --cov=greenkube --cov-report=term-missing --cov-report=xml -rs | tee pytest.log

      - name: Check that the PostgreSQL tests ran
        run: .github/scripts/check-postgres-ran.sh pytest.log

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: '3.17.3'

      - name: Install Helm unit-test plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version=0.7.2

      - name: Validate Helm chart
        run: |
          helm lint ./helm-chart
          helm unittest helm-chart

  # ── Gate: frontend tests and production build ──
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build the frontend
        run: npm run build

  # ── Gate: the end-to-end loop on Minikube (Argo CD + Flux), on this tag ──
  e2e:
    name: End-to-end loop
    uses: ./.github/workflows/e2e-nightly.yml
    with:
      flux: true

  # ── Gate: upgrade a seeded 0.3.1 release to this tag on kind ──
  upgrade:
    name: Upgrade test
    uses: ./.github/workflows/upgrade-test.yml

  # ── Build multi-arch Docker image and push to Docker Hub ──
  build-and-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [test, frontend-test, e2e, upgrade]
    timeout-minutes: 30
    permissions:
      contents: read
      # Keyless signing (cosign) and GitHub artifact attestations.
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          # Move "latest" only for the highest release, never back to an older patch line.
          # Pre-release tags (v0.5.0-rc1) sort above their release and never count.
          newest="$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          if [ "$newest" = "$GITHUB_REF_NAME" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and smoke-test release image
        run: |
          docker buildx build \
            --load \
            --tag greenkube/greenkube:release-smoke \
            --build-arg APT_CACHE_BUST="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            .
          docker run --rm greenkube/greenkube:release-smoke --help

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            greenkube/greenkube:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.latest == 'true' && 'greenkube/greenkube:latest' || '' }}
          platforms: linux/amd64,linux/arm64
          pull: true
          build-args: |
            APT_CACHE_BUST=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # BuildKit provenance and SBOM attestations in the image index.
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Generate the SBOM with syft
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: greenkube-${{ steps.version.outputs.version }}.spdx.json
          artifact-name: greenkube-${{ steps.version.outputs.version }}.spdx.json
          upload-release-assets: false

      - name: Attach the SBOM as a signed attestation
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SBOM: greenkube-${{ steps.version.outputs.version }}.spdx.json
        run: cosign attest --yes --type spdxjson --predicate "${SBOM}" "${IMAGE}@${DIGEST}"

      - name: Publish SLSA build provenance for the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: index.docker.io/${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Verify the signature
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null

  # ── Package and publish Helm chart to GitHub Pages ──
  publish-helm-chart:
    name: Helm Chart Publish
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: '3.17.3'

      - name: Lint Helm Chart
        run: helm lint ./helm-chart

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Generate the Artifact Hub changes list from the CHANGELOG
        run: |
          python -m pip install "ruamel.yaml==0.19.1"  # version locked in uv.lock
          python scripts/artifacthub_changes.py "${GITHUB_REF_NAME#v}"

      - name: Package Helm Chart
        run: |
          # Ship the repo README inside the chart package so Artifact Hub
          # displays it (single source of truth: README.md, no duplication in Chart.yaml).
          cp README.md helm-chart/README.md
          mkdir -p ./charts-packaged
          helm package ./helm-chart --destination ./charts-packaged

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign the chart package (keyless)
        run: |
          for chart in charts-packaged/*.tgz; do
            cosign sign-blob --yes --bundle "${chart}.sigstore.json" "${chart}"
          done

      - name: Publish SLSA build provenance for the chart package
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: charts-packaged/*.tgz

      - name: Keep the signed chart package for the GitHub Release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: helm-chart
          path: charts-packaged/
          if-no-files-found: error

      - name: Publish to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            git fetch origin gh-pages
            git branch gh-pages origin/gh-pages
            git worktree add /tmp/gh-pages gh-pages
          else
            git worktree add --orphan -b gh-pages /tmp/gh-pages
          fi

          mkdir -p /tmp/gh-pages/
          cp -r charts-packaged/*.tgz /tmp/gh-pages/
          cp -r charts-packaged/*.tgz.sigstore.json /tmp/gh-pages/
          # Copy Artifact Hub repo metadata (must sit next to index.yaml)
          cp artifacthub-repo.yml /tmp/gh-pages/artifacthub-repo.yml
          # Keep the GitHub Pages site in sync with the latest version:
          # the site renders the README from the gh-pages branch root.
          cp README.md CHANGELOG.md /tmp/gh-pages/
          rsync -a --delete docs/ /tmp/gh-pages/docs/
          rsync -a --delete assets/ /tmp/gh-pages/assets/

          cd /tmp/gh-pages
          if [ -f "index.yaml" ]; then
            helm repo index . --merge index.yaml --url "https://GreenKubeCloud.github.io/GreenKube"
          else
            helm repo index . --url "https://GreenKubeCloud.github.io/GreenKube"
          fi

          git add -f ./*.tgz ./*.tgz.sigstore.json
          git add index.yaml
          git add artifacthub-repo.yml
          git add README.md CHANGELOG.md docs assets

          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "chore: publish helm chart ${GITHUB_REF_NAME}"
            git push origin gh-pages
          fi

  # ── Create a GitHub Release with changelog extract ──
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build-and-push, publish-helm-chart]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download the SBOM and the signed chart package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          merge-multiple: true

      - name: Extract changelog for this version
        id: changelog
        run: |
          # Extract the section between this version header and the next version header
          VERSION="${{ steps.version.outputs.version }}"
          CHANGELOG=$(sed -n "/^## \[${VERSION}\]/,/^## \[/{ /^## \[${VERSION}\]/d; /^## \[/d; p; }" CHANGELOG.md)
          # Use EOF delimiter for multiline output
          {
            echo "body<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: "GreenKube v${{ steps.version.outputs.version }}"
          body: |
            ## What's Changed

            ${{ steps.changelog.outputs.body }}

            ---

            **Docker:** `docker pull greenkube/greenkube:${{ steps.version.outputs.version }}` (digest `${{ needs.build-and-push.outputs.digest }}`)

            **Helm:**
            ```bash
            helm repo add greenkube https://GreenKubeCloud.github.io/GreenKube
            helm repo update
            helm install greenkube greenkube/greenkube -n greenkube --create-namespace
            ```

            **Supply chain:** the image is signed with cosign (keyless) and carries an SPDX SBOM attestation and SLSA build provenance; the chart package ships with its Sigstore bundle. See [Verifying releases](https://github.com/${{ github.repository }}/blob/main/SECURITY.md#verifying-releases).
          files: |
            release-assets/*.spdx.json
            release-assets/*.tgz
            release-assets/*.tgz.sigstore.json
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
