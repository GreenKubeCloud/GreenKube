name: Upgrade — 0.3.1 to this commit on kind

# Real upgrade test (roadmap F17, production readiness): hack/upgrade/upgrade-test.sh
# installs the 0.3.1 chart with its image on a fresh kind cluster, seeds it,
# runs `helm upgrade --reset-then-reuse-values --wait` to this commit's chart and
# image, then asserts api and controller Ready, the schema at the latest
# migration, every seeded row kept and the API key unchanged.
#
# Runs on pull requests that touch migrations, the chart or the script, on
# demand, and from the release workflow (a release tag cannot publish without
# it). Mark "Upgrade from 0.3.1" as a required status check of main and dev.

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'src/greenkube/core/migrations/**'
      - 'src/greenkube/core/db.py'
      - 'helm-chart/**'
      - 'hack/upgrade/**'
      - 'Dockerfile'
      - '.github/workflows/upgrade-test.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: upgrade-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  upgrade:
    name: Upgrade from 0.3.1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Full history: the 0.3.1 chart comes from the v0.3.1 tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: '3.17.3'

      - name: Install kind
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          install_only: true

      - name: Upgrade 0.3.1 to this commit
        env:
          UPGRADE_STATE_DIR: ${{ runner.temp }}/greenkube-upgrade
        run: hack/upgrade/upgrade-test.sh

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upgrade-evidence
          path: ${{ runner.temp }}/greenkube-upgrade/evidence/
          retention-days: 14
          if-no-files-found: warn

      - name: Summarize the steps
        if: always()
        run: |
          steps="${RUNNER_TEMP}/greenkube-upgrade/evidence/steps.jsonl"
          {
            echo "## Upgrade from 0.3.1"
            echo
            if [[ -s "${steps}" ]]; then
              echo "| Step | Status | Detail |"
              echo "| --- | --- | --- |"
              jq -r '"| \(.step) | \(.status) | \(.detail | gsub("\\|"; "/") | .[0:160]) |"' "${steps}"
            else
              echo "No step was recorded."
            fi
          } >>"${GITHUB_STEP_SUMMARY}"
