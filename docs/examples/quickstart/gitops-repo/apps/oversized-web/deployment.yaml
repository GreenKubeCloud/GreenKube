# Deliberately oversized: an idle NGINX that requests far more CPU and memory
# than it uses. GreenKube should propose a rightsizing pull request for it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oversized-web
  namespace: greenkube-e2e-apps
  labels:
    app.kubernetes.io/name: oversized-web
    app.kubernetes.io/part-of: greenkube-quickstart
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oversized-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oversized-web
        app.kubernetes.io/part-of: greenkube-quickstart
    spec:
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 400m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
