# Deliberately oversized: a sleeping worker that requests far more CPU and
# memory than it uses. Reconciled by Flux to exercise the Flux delivery path;
# its namespace comes from the Flux Kustomization's targetNamespace.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oversized-worker
  labels:
    app.kubernetes.io/name: oversized-worker
    app.kubernetes.io/part-of: greenkube-quickstart
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oversized-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oversized-worker
        app.kubernetes.io/part-of: greenkube-quickstart
    spec:
      containers:
        - name: worker
          image: busybox:1.36.1
          command: ["sh", "-c", "while true; do sleep 30; done"]
          resources:
            requests:
              cpu: 300m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]
