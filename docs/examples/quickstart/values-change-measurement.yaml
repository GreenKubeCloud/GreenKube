# Quickstart overlay: change measurement on accelerated demo windows.
#
#   helm upgrade --install greenkube ./helm-chart -n greenkube --create-namespace \
#     -f docs/examples/quickstart/values.yaml \
#     -f docs/examples/quickstart/values-change-measurement.yaml
#
# Every merged change is recorded (/changes, /ledger?change=...) with its
# baseline snapshot and measured against a counterfactual (roadmap C1-C5)
# instead of the quickstart's 6-minute verifier. Production needs a 7-day
# baseline and a 7-day post-window. Here the baseline is 6 hours and the
# post-window 72 minutes after a 3-minute warm-up, so a change is decided about
# 80 minutes after the merge (the decision waits one more hour for late
# samples). A fresh cluster has no baseline for the same hours of the week:
# expect an honest "inconclusive" outcome, not a measured saving. The
# recommendation then ends "applied"/"inconclusive", so `make e2e` needs
# E2E_ALLOW_REGRESSION=1 (and E2E_TIMEOUT_VERDICT above 2 hours) with this file.
#
# DO NOT use these values in production: accelerated windows are rejected unless
# `accelerated: true` is set, and the controller logs a warning when it is.

config:
  recommendations:
    changeMeasurement:
      enabled: true
      accelerated: true
      # 6 hours of baseline (default 7 days, the minimum without acceleration).
      preWindowDays: 0.25
      # 72 minutes after a 3-minute warm-up (default 7 days after 1 hour).
      postWindowDays: 0.05
      warmupHours: 0.05
