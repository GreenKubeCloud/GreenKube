# Fixtures for the "no unsafe deletions" checks on the kind + Cilium cluster.
#
#   in-use      Gateway (Cilium creates its LoadBalancer Service
#               cilium-gateway-web) with an HTTPRoute to the echo backend.
#   in-use      LoadBalancer Service echo-lb, with ready endpoints.
#   orphan      LoadBalancer Service orphan-lb: its selector matches no pod and
#               no route references it. The only one that may be proposed.
#   released    a local-path PV (StorageClass with reclaimPolicy Retain) and a
#               static CSI PV, each Released once its claim is deleted:
#                 kubectl -n gk-waste delete pod retained-local-writer
#                 kubectl -n gk-waste delete pvc retained-local csi-claim
#               GreenKube proposes the CSI one; local and hostPath volumes are
#               skipped on purpose (no billable storage is released).
apiVersion: v1
kind: Namespace
metadata:
  name: gk-waste
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: gk-waste
spec:
  replicas: 1
  selector:
    matchLabels: {app: echo}
  template:
    metadata:
      labels: {app: echo}
    spec:
      containers:
        - name: echo
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          args: ["netexec", "--http-port=8080"]
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: gk-waste
spec:
  selector: {app: echo}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: v1
kind: Service
metadata:
  name: echo-lb
  namespace: gk-waste
spec:
  type: LoadBalancer
  selector: {app: echo}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: v1
kind: Service
metadata:
  name: orphan-lb
  namespace: gk-waste
spec:
  type: LoadBalancer
  selector: {app: nothing-here}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: web
  namespace: gk-waste
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo
  namespace: gk-waste
spec:
  parentRefs: [{name: web}]
  rules:
    - backendRefs: [{name: echo, port: 80}]
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-path-retain
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: retained-local
  namespace: gk-waste
spec:
  storageClassName: local-path-retain
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi}
---
apiVersion: v1
kind: Pod
metadata:
  name: retained-local-writer
  namespace: gk-waste
spec:
  restartPolicy: Never
  containers:
    - name: w
      image: busybox:1.36
      command: ["sh", "-c", "echo data > /data/f"]
      volumeMounts: [{name: d, mountPath: /data}]
  volumes:
    - name: d
      persistentVolumeClaim: {claimName: retained-local}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: gk-waste-csi-released
spec:
  capacity: {storage: 5Gi}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: fake-csi
  csi:
    driver: ebs.csi.example.com
    volumeHandle: vol-0123456789abcdef0
  claimRef:
    namespace: gk-waste
    name: csi-claim
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: csi-claim
  namespace: gk-waste
spec:
  storageClassName: fake-csi
  volumeName: gk-waste-csi-released
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 5Gi}
