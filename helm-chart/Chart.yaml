apiVersion: v2
name: greenkube
description: >-
  GreenKube is an open-source Kubernetes optimization loop. It sizes container
  requests from measured usage (corroborated by VPA and KRR when present),
  ranks the changes by impact and risk, delivers them as reviewable GitOps pull
  requests for Argo CD and Flux, verifies the sync, and measures the cost and
  CO₂e savings each change realizes.
type: application
icon: https://raw.githubusercontent.com/GreenKubeCloud/GreenKube/refs/heads/main/assets/greenkube-logo.png
version: 0.4.0
appVersion: 0.4.0
