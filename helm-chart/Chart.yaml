apiVersion: v2
name: greenkube
description: >-
  GreenKube is an open-source Kubernetes optimization loop. It aggregates
  recommendations (GreenKube analyzers, VPA, Goldilocks, Karpenter), ranks them
  by impact and risk, delivers them as reviewable GitOps pull requests for
  Argo CD and Flux, verifies the sync, and measures the cost and CO₂e savings
  each change realizes.
type: application
icon: 
  https://raw.githubusercontent.com/GreenKubeCloud/GreenKube/refs/heads/main/assets/greenkube-logo.png
version: 0.3.1
appVersion: 0.3.1
keywords:
- greenkube
- kubernetes
- optimization
- rightsizing
- gitops
- argocd
- flux
- vpa
- karpenter
- finops
- cloud-cost
- carbon
- co2
- sustainability
- opencost
- prometheus
