{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "greenkube.fullname" . }}
  labels:
    {{- include "greenkube.labels" . | nindent 4 }}
rules:
  # GreenKube needs to list nodes, pods, and services for discovery and data collection.
  # Secrets access is intentionally excluded (CRITICAL: KSV-0041).
- apiGroups: [""]
  resources:
  - nodes
  - namespaces
  - pods
  - services
  - endpoints
  - configmaps
  - persistentvolumes
  - persistentvolumeclaims
  verbs:
  - get
  - list
  - watch
  # GreenKube needs to list HPAs to detect existing autoscalers before recommending new ones
- apiGroups: ["autoscaling"]
  resources:
  - horizontalpodautoscalers
  verbs:
  - get
  - list
  # PDB interaction evidence is evaluated before a plan is created or approved.
- apiGroups: ["policy"]
  resources:
  - poddisruptionbudgets
  verbs:
  - get
  - list
  # GreenKube reads recommendation-mode VPAs (updateMode: Off) when the VPA
  # connector is enabled. Read-only and harmless when the CRD is absent.
- apiGroups: ["autoscaling.k8s.io"]
  resources:
  - verticalpodautoscalers
  verbs:
  - get
  - list
   # Karpenter connector (node pool consolidation).
- apiGroups: ["karpenter.sh"]
  resources:
  - nodepools
  - nodeclaims
  verbs:
  - get
  - list
  # Apply detection reads live workload requests to detect landed changes
  # (manual edits, PR merges, ArgoCD syncs). Read-only.
- apiGroups: ["apps"]
  resources:
  - deployments
  - statefulsets
  - daemonsets
  - replicasets
  verbs:
  - get
  - list
  # GitOps discovery reads Argo CD Applications and projects. Always rendered,
  # read-only: discovery activates itself when the CRDs exist (F12).
- apiGroups: ["argoproj.io"]
  resources:
  - applications
  - appprojects
  verbs:
  - get
  - list
  - watch
  # Flux discovery reads source, HelmChart, Kustomization, and HelmRelease resources.
- apiGroups: ["source.toolkit.fluxcd.io"]
  resources:
  - gitrepositories
  - ocirepositories
  - helmrepositories
  - buckets
  - helmcharts
  verbs:
  - get
  - list
  - watch
- apiGroups: ["kustomize.toolkit.fluxcd.io"]
  resources:
  - kustomizations
  verbs:
  - get
  - list
  - watch
- apiGroups: ["helm.toolkit.fluxcd.io"]
  resources:
  - helmreleases
  verbs:
  - get
  - list
  - watch
- apiGroups: ["metrics.k8s.io"]
  resources:
  - pods
  verbs:
  - get
  - list
  # Deletion evidence (docs/recommendation.md, "Why GreenKube thinks a resource
  # is unused"): a LoadBalancer Service or PersistentVolume is only reported as
  # unused when GreenKube can read everything that could still use it. A missing
  # permission makes the evidence unprovable, so nothing is recommended. Read-only.
- apiGroups: ["discovery.k8s.io"]
  resources:
  - endpointslices
  verbs:
  - get
  - list
  - watch
- apiGroups: ["networking.k8s.io"]
  resources:
  - ingresses
  verbs:
  - get
  - list
- apiGroups: ["gateway.networking.k8s.io"]
  resources:
  - gateways
  - httproutes
  - grpcroutes
  - tlsroutes
  - tcproutes
  - udproutes
  verbs:
  - get
  - list
- apiGroups: ["batch"]
  resources:
  - cronjobs
  verbs:
  - get
  - list
- apiGroups: ["snapshot.storage.k8s.io"]
  resources:
  - volumesnapshots
  - volumesnapshotcontents
  verbs:
  - get
  - list
  {{- end }}