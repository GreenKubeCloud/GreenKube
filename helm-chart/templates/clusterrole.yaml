{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "greenkube.fullname" . }}
  labels:
    {{- include "greenkube.labels" . | nindent 4 }}
rules:
  # GreenKube needs to list nodes, pods, and services for discovery and data collection.
  # Secrets access is intentionally excluded (CRITICAL: KSV-0041).
- apiGroups: [""]
  resources:
  - nodes
  - namespaces
  - pods
  - services
  - endpoints
  - configmaps
  - persistentvolumes
  - persistentvolumeclaims
  verbs:
  - get
  - list
  - watch
{{- if and (eq .Values.profile "production") .Values.production.leaderElection.enabled }}
  # The controller uses one namespaced Lease for active/standby coordination.
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["create"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  resourceNames: ["{{ include "greenkube.leaseName" . }}"]
  verbs: ["get", "update", "patch"]
{{- end }}
  # GreenKube needs to list HPAs to detect existing autoscalers before recommending new ones
- apiGroups: ["autoscaling"]
  resources:
  - horizontalpodautoscalers
  verbs:
  - get
  - list
  # PDB interaction evidence is evaluated before a plan is created or approved.
- apiGroups: ["policy"]
  resources:
  - poddisruptionbudgets
  verbs:
  - get
  - list
  # GreenKube reads recommendation-mode VPAs (updateMode: Off) when the VPA
  # connector is enabled. Read-only and harmless when the CRD is absent.
- apiGroups: ["autoscaling.k8s.io"]
  resources:
  - verticalpodautoscalers
  verbs:
  - get
  - list
   # Karpenter connector (node pool consolidation).
- apiGroups: ["karpenter.sh"]
  resources:
  - nodepools
  - nodeclaims
  verbs:
  - get
  - list
  # Apply detection reads live workload requests to detect landed changes
  # (manual edits, PR merges, ArgoCD syncs). Read-only.
- apiGroups: ["apps"]
  resources:
  - deployments
  - statefulsets
  - daemonsets
  - replicasets
  verbs:
  - get
  - list
  # GitOps discovery reads Argo CD Applications and projects.
- apiGroups: ["argoproj.io"]
  resources:
  - applications
  - appprojects
  verbs:
  - get
  - list
  - watch
  # Flux discovery reads source, HelmChart, Kustomization, and HelmRelease resources.
- apiGroups: ["source.toolkit.fluxcd.io"]
  resources:
  - gitrepositories
  - ocirepositories
  - helmrepositories
  - buckets
  - helmcharts
  verbs:
  - get
  - list
  - watch
- apiGroups: ["kustomize.toolkit.fluxcd.io"]
  resources:
  - kustomizations
  verbs:
  - get
  - list
  - watch
- apiGroups: ["helm.toolkit.fluxcd.io"]
  resources:
  - helmreleases
  verbs:
  - get
  - list
  - watch
- apiGroups: ["metrics.k8s.io"]
  resources:
  - pods
  verbs:
  - get
  - list
  {{- end }}