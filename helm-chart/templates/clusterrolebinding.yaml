{{- if .Values.rbac.create -}}
{{- $v := include "greenkube.values" . | fromYaml -}}
{{- $components := list "controller" "api" -}}
{{- if gt (int ($v.worker.replicas | default 0)) 0 -}}
{{- $components = append $components "worker" -}}
{{- end -}}
{{- $subjects := list -}}
{{- range $component := $components -}}
{{- $subjects = append $subjects (include "greenkube.componentServiceAccountName" (dict "context" $ "component" $component)) -}}
{{- end -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "greenkube.fullname" . }}
  labels:
    {{- include "greenkube.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "greenkube.fullname" . }}
subjects:
{{- range $name := $subjects | uniq }}
- kind: ServiceAccount
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
