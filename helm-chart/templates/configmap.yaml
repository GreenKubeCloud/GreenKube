{{- $automationMode := include "greenkube.automationMode" . }}
{{- $gitProviderConfig := include "greenkube.gitProviderConfigJson" . }}
{{- if not (kindIs "map" .Values.automation.policy) }}
{{- fail "automation.policy must be a map" }}
{{- end }}
{{- if not (kindIs "map" .Values.automation.pullRequests) }}
{{- fail "automation.pullRequests must be a map" }}
{{- end }}
{{- $prPollInterval := .Values.automation.prPollIntervalSeconds | toString }}
{{- if not (regexMatch "^[0-9]+$" $prPollInterval) }}
{{- fail "automation.prPollIntervalSeconds must be an integer between 10 and 86400" }}
{{- end }}
{{- $prPollIntervalSeconds := int $prPollInterval }}
{{- if or (lt $prPollIntervalSeconds 10) (gt $prPollIntervalSeconds 86400) }}
{{- fail "automation.prPollIntervalSeconds must be an integer between 10 and 86400" }}
{{- end }}
{{- $syncPollInterval := .Values.automation.syncPollIntervalSeconds | toString }}
{{- if not (regexMatch "^[0-9]+$" $syncPollInterval) }}
{{- fail "automation.syncPollIntervalSeconds must be an integer between 10 and 86400" }}
{{- end }}
{{- $syncPollIntervalSeconds := int $syncPollInterval }}
{{- if or (lt $syncPollIntervalSeconds 10) (gt $syncPollIntervalSeconds 86400) }}
{{- fail "automation.syncPollIntervalSeconds must be an integer between 10 and 86400" }}
{{- end }}
{{- $syncTimeout := .Values.automation.syncTimeoutSeconds | toString }}
{{- if not (regexMatch "^[0-9]+$" $syncTimeout) }}
{{- fail "automation.syncTimeoutSeconds must be an integer between 60 and 86400" }}
{{- end }}
{{- $syncTimeoutSeconds := int $syncTimeout }}
{{- if or (lt $syncTimeoutSeconds 60) (gt $syncTimeoutSeconds 86400) }}
{{- fail "automation.syncTimeoutSeconds must be an integer between 60 and 86400" }}
{{- end }}
{{- include "greenkube.validateAutomationWebhooks" . -}}
{{- if not (has $automationMode (list "inline" "worker" "disabled")) }}
{{- fail "automation.mode must be inline, worker, or disabled" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "greenkube.fullname" . }}
  labels:
    {{- include "greenkube.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-30"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  # --- General Config ---
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  LOG_FORMAT: {{ .Values.config.logFormat | quote }}
  ENVIRONMENT: {{ .Values.config.environment | quote }}
  API_AUTH_MODE: {{ .Values.config.apiAuthMode | quote }}
  SERVICE_URL_ALLOWLIST: {{ join "," (.Values.config.serviceUrlAllowlist | default (list)) | quote }}
  AUTOMATION_ENABLED: {{ and .Values.automation.enabled (eq $automationMode "inline") | quote }}
  AUTOMATION_MODE: {{ ternary "inline" "disabled" (and .Values.automation.enabled (eq $automationMode "inline")) | quote }}
  GITOPS_PR_POLL_INTERVAL: {{ $prPollInterval | quote }}
  GITOPS_DISCOVERY_INTERVAL: {{ .Values.automation.discoveryInterval | default "5m" | quote }}
  GITOPS_BINDING_TTL: {{ .Values.automation.bindingTtl | default "30m" | quote }}
  GITOPS_SYNC_POLL_INTERVAL: {{ $syncPollInterval | quote }}
  GITOPS_SYNC_TIMEOUT: {{ $syncTimeout | quote }}
  GITOPS_POLICY_JSON: {{ .Values.automation.policy | toJson | quote }}
  GITOPS_PULL_REQUESTS_JSON: {{ .Values.automation.pullRequests | toJson | quote }}
  {{- if and .Values.automation.enabled .Values.rendererSandbox.enabled (ne $automationMode "disabled") }}
  GITOPS_RENDERER_URL: {{ printf "http://%s-renderer:%v" (include "greenkube.fullname" .) .Values.rendererSandbox.servicePort | quote }}
  GITOPS_RENDERER_EGRESS_FIREWALL: {{ .Values.rendererSandbox.egressFirewall.enabled | quote }}
  {{- else }}
  GITOPS_RENDERER_URL: ""
  GITOPS_RENDERER_EGRESS_FIREWALL: "false"
  {{- end }}
  GITOPS_SECRET_MOUNT: "/etc/greenkube/git-providers"
  {{- if .Values.automation.webhooks.enabled }}
  GITOPS_WEBHOOK_SECRET_FILE: {{ include "greenkube.webhookSecretFilePath" . | quote }}
  {{- end }}
  GITOPS_PROVIDERS_JSON: {{ $gitProviderConfig | quote }}
  # Name of the Helm-managed Secret — used by the API to persist runtime
  # configuration overrides (UI-set tokens/URLs) back into the Secret.
  GREENKUBE_SECRET_NAME: {{ include "greenkube.secretName" . | quote }}
  CLOUD_PROVIDER: {{ .Values.config.cloudProvider | quote }}
  CLUSTER_NAME: {{ .Values.config.clusterName | quote }}
  DEFAULT_INTENSITY: {{ .Values.config.defaultIntensity | quote }}
  DEFAULT_PUE: {{ .Values.config.defaults.pue | quote }}
  {{- if .Values.config.defaultZone }}
  DEFAULT_ZONE: {{ .Values.config.defaultZone | quote }}
  {{- end }}
  NORMALIZATION_GRANULARITY: {{ .Values.config.normalizationGranularity | quote }}
  ELECTRICITY_PROVIDER: {{ .Values.config.electricityProvider | quote }}
  NODE_ANALYSIS_INTERVAL: {{ .Values.config.nodeAnalysisInterval | quote }}
  NODE_DATA_MAX_AGE_DAYS: {{ .Values.config.nodeDataMaxAgeDays | quote }}
  METRICS_COMPRESSION_AGE_HOURS: {{ .Values.config.metricsCompressionAgeHours | quote }}
  METRICS_RAW_RETENTION_DAYS: {{ .Values.config.metricsRawRetentionDays | quote }}
  METRICS_AGGREGATED_RETENTION_DAYS: {{ .Values.config.metricsAggregatedRetentionDays | quote }}
  K8S_REQUEST_TIMEOUT: {{ .Values.config.k8sRequestTimeout | quote }}
  KUBERNETES_METRICS_API_ENABLED: {{ .Values.config.kubernetesMetricsApiEnabled | quote }}
  GITOPS_HELM_KUBE_VERSION: {{ .Capabilities.KubeVersion.Version | quote }}
  GITOPS_HELM_API_VERSIONS_JSON: {{ .Capabilities.APIVersions | toJson | quote }}

  # --- Database Config ---
  DB_TYPE: {{ .Values.config.db.type | quote }}
  DB_PATH: {{ .Values.config.db.path | quote }}
  DB_SSL_MODE: {{ .Values.config.db.sslMode | quote }}
  DB_POOL_MIN_SIZE: {{ .Values.config.db.poolMinSize | quote }}
  DB_POOL_MAX_SIZE: {{ .Values.config.db.poolMaxSize | quote }}
  DB_STATEMENT_TIMEOUT_MS: {{ .Values.config.db.statementTimeoutMs | quote }}
  
  # --- Boavizta Config ---
  BOAVIZTA_API_URL: {{ .Values.config.boavizta.url | quote }}
  DEFAULT_EMBODIED_EMISSIONS_KG: {{ .Values.config.boavizta.defaultEmbodiedEmissionsKg | quote }}

  # --- Prometheus Collector Config ---
  # Note: PROMETHEUS_URL is managed in the Secret (supports UI-set overrides via lookup).
  PROMETHEUS_VERIFY_CERTS: {{ .Values.config.prometheus.verifyCerts | quote }}
  PROMETHEUS_QUERY_RANGE_STEP: {{ .Values.config.prometheus.queryRangeStep | quote }}
  PROMETHEUS_QUERY_RANGE_MAX_SAMPLES: {{ .Values.config.prometheus.queryRangeMaxSamples | quote }}
  PROMETHEUS_NODE_INSTANCE_LABEL: {{ .Values.config.prometheus.nodeInstanceLabel | quote }}

  # --- OpenCost Collector Config ---
  # Note: OPENCOST_API_URL is managed in the Secret (supports UI-set overrides via lookup).
  OPENCOST_VERIFY_CERTS: {{ .Values.config.opencost.verifyCerts | quote }}
  
  LOW_NODE_CPU_THRESHOLD: {{ .Values.config.lowNodeCpuThreshold | quote }}
  
  # --- API Config ---
  {{- if .Values.config.api.enabled }}
  API_HOST: {{ .Values.config.api.host | quote }}
  API_PORT: {{ .Values.config.api.port | quote }}
  CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
  API_RATE_LIMIT: {{ .Values.config.apiRateLimit | quote }}
  ROOT_PATH: {{ .Values.config.rootPath | default "" | quote }}
  METRICS_LIST_MAX_RANGE_DAYS: {{ .Values.config.metricsListMaxRangeDays | default 30 | int | quote }}
  {{- end }}

  # --- Estimator Defaults ---
  {{- with .Values.config.defaults.instance }}
  DEFAULT_INSTANCE_VCORES: {{ .vcores | quote }}
  DEFAULT_INSTANCE_MIN_WATTS: {{ .minWatts | quote }}
  DEFAULT_INSTANCE_MAX_WATTS: {{ .maxWatts | quote }}
  {{- end }}

  # --- Recommendation Engine Config ---
  {{- with .Values.config.recommendations }}
  RECOMMENDATION_LOOKBACK_DAYS: {{ .lookbackDays | quote }}
  RECOMMENDATION_MAX_METRIC_ROWS: {{ .maxMetricRows | default 750000 | int | quote }}
  RIGHTSIZING_CPU_THRESHOLD: {{ .rightsizingCpuThreshold | quote }}
  RIGHTSIZING_MEMORY_THRESHOLD: {{ .rightsizingMemoryThreshold | quote }}
  RIGHTSIZING_HEADROOM: {{ .rightsizingHeadroom | quote }}
  ZOMBIE_COST_THRESHOLD: {{ .zombieCostThreshold | quote }}
  ZOMBIE_ENERGY_THRESHOLD: {{ .zombieEnergyThreshold | quote }}
  AUTOSCALING_CV_THRESHOLD: {{ .autoscalingCvThreshold | quote }}
  AUTOSCALING_SPIKE_RATIO: {{ .autoscalingSpikeRatio | quote }}
  OFF_PEAK_IDLE_THRESHOLD: {{ .offPeakIdleThreshold | quote }}
  OFF_PEAK_MIN_IDLE_HOURS: {{ .offPeakMinIdleHours | quote }}
  IDLE_NAMESPACE_ENERGY_THRESHOLD: {{ .idleNamespaceEnergyThreshold | quote }}
  CARBON_AWARE_THRESHOLD: {{ .carbonAwareThreshold | quote }}
  NODE_UTILIZATION_THRESHOLD: {{ .nodeUtilizationThreshold | quote }}
  STORAGE_COST_PER_GIB_MONTH: {{ .storageCostPerGibMonth | default 0.1 | quote }}
  LOAD_BALANCER_COST_PER_MONTH: {{ .loadBalancerCostPerMonth | default 18.0 | quote }}
  RECOMMEND_SYSTEM_NAMESPACES: {{ .recommendSystemNamespaces | quote }}
  RECOMMENDATION_MIN_CPU_MILLICORES: {{ .minCpuMillicores | default 10 | int | quote }}
  RECOMMENDATION_MIN_MEMORY_BYTES: {{ .minMemoryBytes | default 16777216 | int | quote }}
  RECOMMENDATION_APPLY_TOLERANCE: {{ .applyTolerance | default 0.25 | quote }}
  RECOMMENDATION_VPA_ENABLED: {{ .vpaEnabled | default true | quote }}
  RECOMMENDATION_KARPENTER_ENABLED: {{ .karpenterEnabled | default true | quote }}
  RECOMMENDATION_SOURCE_PRIORITY: {{ .sourcePriority | default "vpa,karpenter,greenkube" | quote }}
  RECOMMENDATION_TTL_DAYS: {{ .ttlDays | default 14 | int | quote }}
  RECOMMENDATION_RANKING_PROFILE: {{ .rankingProfile | default "balanced" | quote }}
  RECOMMENDATION_RANKING_WEIGHTS: {{ .rankingWeights | default "" | quote }}
  RECOMMENDATION_MIN_SAMPLES: {{ .minSamples | default 36 | int | quote }}
  {{- with .verification }}
  VERIFICATION_WINDOW_HOURS: {{ .windowHours | default 72 | quote }}
  VERIFICATION_MIN_SAMPLES: {{ .minSamples | default 36 | int | quote }}
  VERIFICATION_MIN_SAVINGS_RATIO: {{ .minSavingsRatio | default 0.5 | quote }}
  VERIFICATION_USAGE_HEADROOM: {{ .usageHeadroom | default 1.1 | quote }}
  VERIFICATION_MAX_RESTART_DELTA: {{ .maxRestartDelta | default 0 | int | quote }}
  VERIFICATION_MIN_READINESS: {{ .minReadiness | default 0.99 | quote }}
  VERIFICATION_MAX_THROTTLE_RATIO: {{ .maxThrottleRatio | default 0.05 | quote }}
  RECOMMENDATION_LIFECYCLE_INTERVAL: {{ .lifecycleInterval | default "5m" | quote }}
  {{- end }}
  {{- end }}
