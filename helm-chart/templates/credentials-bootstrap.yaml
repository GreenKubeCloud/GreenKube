{{- if include "greenkube.credentialsBootstrapEnabled" . }}
{{- $name := include "greenkube.credentialsBootstrapName" . }}
{{- $bundledPostgres := include "greenkube.bundledPostgres" . }}
{{- $existingSecret := .Values.secrets.existingSecret }}
{{- $initialAdmin := include "greenkube.initialAdminSecretName" . }}
{{- $generatePostgresPassword := and (not $existingSecret) (eq $bundledPostgres "true") (not .Values.postgres.auth.password) }}
{{- $postgresPvc := "" }}
{{- $scrapeCopy := eq (include "greenkube.scrapeTokenCopy" .) "hook" }}
{{- $scrapeNamespace := include "greenkube.serviceMonitorNamespace" . }}
{{- $scrapeCopyName := include "greenkube.scrapeTokenCopyName" . }}
{{- $scrapeSource := include "greenkube.secretNameFor" (dict "context" . "key" "GREENKUBE_METRICS_TOKEN") }}
{{- if and $generatePostgresPassword .Values.postgres.persistence.enabled }}
{{- $postgresPvc = printf "data-%s-postgres-0" (include "greenkube.fullname" .) }}
{{- end }}
# Generated credentials are created at run time, once, instead of at render
# time: `helm template` (Argo CD) cannot see existing Secrets, so rendering
# random values would rotate the API key and the PostgreSQL password on every
# sync (BUG-58). This hook (an Argo CD PreSync hook) creates the Secret
# {{ include "greenkube.secretName" . }} only when it is absent and afterwards only adds missing keys.
# The Secret is not part of the release: like the PostgreSQL volume, it
# survives `helm uninstall`.
{{- if $initialAdmin }}
# It also creates {{ $initialAdmin }} once, with a random first-admin password
# (F14); the API erases the plaintext after the first password change and the
# hook never re-creates an existing Secret.
{{- end }}
{{- if $scrapeCopy }}
# The ServiceMonitors live in {{ $scrapeNamespace }}, where Prometheus Operator reads
# their bearer token Secret: the hook also mirrors the scrape token into Secret
# {{ $scrapeCopyName }} there (key "token"), with a Role scoped to that Secret.
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "greenkube.labels" . | nindent 4 }}
    app.kubernetes.io/component: credentials-bootstrap
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-50"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "greenkube.labels" . | nindent 4 }}
    app.kubernetes.io/component: credentials-bootstrap
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-50"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  # Kubernetes cannot restrict "create" by resource name.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  {{- if not $existingSecret }}
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ include "greenkube.secretName" . | quote }}]
    verbs: ["get", "patch"]
  {{- end }}
  {{- if $initialAdmin }}
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $initialAdmin | quote }}]
    verbs: ["get"]
  {{- end }}
  {{- if and $scrapeCopy $existingSecret }}
  # Read the scrape token to copy into the ServiceMonitor namespace.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $existingSecret | quote }}]
    verbs: ["get"]
  {{- end }}
  {{- if $postgresPvc }}
  # Refuse to generate a new password for a retained PostgreSQL volume.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    resourceNames: [{{ $postgresPvc | quote }}]
    verbs: ["get"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "greenkube.labels" . | nindent 4 }}
    app.kubernetes.io/component: credentials-bootstrap
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-50"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- if $scrapeCopy }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $scrapeNamespace }}
  labels:
    {{- include "greenkube.labels" . | nindent 4 }}
    app.kubernetes.io/component: credentials-bootstrap
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-50"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $scrapeCopyName | quote }}]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $scrapeNamespace }}
  labels:
    {{- include "greenkube.labels" . | nindent 4 }}
    app.kubernetes.io/component: credentials-bootstrap
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-50"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "greenkube.labels" . | nindent 4 }}
    app.kubernetes.io/component: credentials-bootstrap
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-40"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        {{- include "greenkube.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: credentials-bootstrap
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: true
      securityContext:
        {{- toYaml .Values.hooks.podSecurityContext | nindent 8 }}
      containers:
        - name: credentials-bootstrap
          image: "{{ include "greenkube.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.hooks.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.hooks.resources | nindent 12 }}
          env:
            - name: GREENKUBE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: GREENKUBE_SECRET_NAME
              value: {{ ternary "" (include "greenkube.secretName" .) (empty $existingSecret | not) | quote }}
            - name: GREENKUBE_RELEASE
              value: {{ .Release.Name | quote }}
            # The full-admin bootstrap key is generated for config.apiAuthMode=api_key only;
            # an existing key is kept. Prometheus scrapes with the metrics:read scrape token.
            - name: GREENKUBE_GENERATE_API_KEY
              value: {{ eq (include "greenkube.generateApiKey" .) "true" | quote }}
            - name: GREENKUBE_GENERATE_METRICS_TOKEN
              value: {{ eq (include "greenkube.generateMetricsToken" .) "true" | quote }}
            - name: GREENKUBE_INITIAL_ADMIN_SECRET
              value: {{ $initialAdmin | quote }}
            - name: GREENKUBE_INITIAL_ADMIN_USERNAME
              value: {{ ((.Values.auth | default dict).admin | default dict).username | default "admin" | quote }}
            - name: GREENKUBE_GENERATE_POSTGRES_PASSWORD
              value: {{ $generatePostgresPassword | quote }}
            {{- if $scrapeCopy }}
            - name: GREENKUBE_SCRAPE_TOKEN_NAMESPACE
              value: {{ $scrapeNamespace | quote }}
            - name: GREENKUBE_SCRAPE_TOKEN_SECRET
              value: {{ $scrapeCopyName | quote }}
            - name: GREENKUBE_SCRAPE_TOKEN_SOURCE
              value: {{ $scrapeSource | quote }}
            {{- end }}
            {{- if $generatePostgresPassword }}
            - name: GREENKUBE_POSTGRES_USER
              value: {{ .Values.postgres.auth.username | quote }}
            - name: GREENKUBE_POSTGRES_DATABASE
              value: {{ .Values.postgres.auth.database | quote }}
            - name: GREENKUBE_POSTGRES_HOST
              value: {{ printf "%s-postgres" (include "greenkube.fullname" .) | quote }}
            - name: GREENKUBE_POSTGRES_PORT
              value: "5432"
            - name: GREENKUBE_POSTGRES_PVC
              value: {{ $postgresPvc | quote }}
            {{- end }}
          command: ["python", "-I", "-B", "-c"]
          args:
            - |
              {{- .Files.Get "files/credentials_bootstrap.py" | nindent 14 }}
{{- end }}
