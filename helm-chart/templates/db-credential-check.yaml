{{- if and .Values.postgres.enabled (eq .Values.config.db.type "postgres") }}
{{- $name := printf "%s-db-credential-check" (include "greenkube.fullname" .) }}
{{- $dsnSecret := include "greenkube.secretNameFor" (dict "context" . "key" "DB_CONNECTION_STRING") }}
# Fail an upgrade before rolling Pods when the new credentials do not match
# the password of the existing bundled PostgreSQL volume. Argo CD runs this
# hook (PreSync) on every sync, including the first one: when the credentials
# or the database do not exist yet, the check is skipped instead of failing.
{{- if eq $dsnSecret (include "greenkube.valuesSecretName" .) }}
{{- $dsn := get (include "greenkube.secretValues" . | fromYaml) "DB_CONNECTION_STRING" }}
{{- $dsnSecret = $name }}
# The password comes from values. The values Secret is a regular release
# resource that Helm and Argo CD apply only after the pre-upgrade (PreSync)
# hooks, so during the check it still holds the previous revision's password.
# This hook Secret carries the newly rendered connection string instead. It is
# rendered from values only, so `helm template` output stays stable.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "greenkube.labels" . | nindent 4 }}
    app.kubernetes.io/component: db-credential-check
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-6"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
type: Opaque
data:
  DB_CONNECTION_STRING: {{ $dsn | b64enc | quote }}
---
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "greenkube.labels" . | nindent 4 }}
    app.kubernetes.io/component: db-credential-check
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "greenkube.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: db-credential-check
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.hooks.podSecurityContext | nindent 8 }}
      containers:
        - name: db-credential-check
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.hooks.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.hooks.resources | nindent 12 }}
          env:
            - name: DB_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: {{ $dsnSecret }}
                  key: DB_CONNECTION_STRING
                  optional: true
            - name: HOME
              value: /tmp
          command:
            - /bin/sh
            - -c
            - |
              if [ -z "${DB_CONNECTION_STRING:-}" ]; then
                echo "GreenKube: database credentials are not available yet (first install or first GitOps sync); skipping the credential check."
                exit 0
              fi
              echo "GreenKube: verifying PostgreSQL credentials..."
              reachable=false
              for i in $(seq 1 10); do
                if pg_isready -d "$DB_CONNECTION_STRING" -t 2 >/dev/null 2>&1; then
                  reachable=true
                  break
                fi
                sleep 2
              done
              if [ "$reachable" != true ]; then
                echo "GreenKube: PostgreSQL is not reachable (first install, first GitOps sync, or database restarting); skipping the credential check."
                exit 0
              fi
              for i in $(seq 1 10); do
                if errors=$(psql "$DB_CONNECTION_STRING" -v ON_ERROR_STOP=1 -c 'SELECT 1' 2>&1 >/dev/null); then
                  echo "PostgreSQL credentials are valid."
                  exit 0
                fi
                case "$errors" in
                  *"authentication failed"*) break ;;
                esac
                echo "  Attempt $i/10 - PostgreSQL is not ready yet, retrying in 2s..."
                sleep 2
              done
              echo "ERROR: PostgreSQL rejected the credentials in DB_CONNECTION_STRING."
              echo ""
              echo "   This usually means a PVC from an earlier installation is being reused,"
              echo "   but the password no longer matches the database."
              echo ""
              echo "   Either delete the volume for a clean install:"
              echo "     kubectl -n {{ .Release.Namespace }} delete pvc data-{{ include "greenkube.fullname" . }}-postgres-0"
              echo ""
              echo "   Or provide the password used by the existing database through"
              echo "   postgres.auth.password, by setting POSTGRES_PASSWORD and DB_CONNECTION_STRING"
              echo "   in Secret {{ include "greenkube.secretName" . }}, or with secrets.existingSecret."
              exit 1
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
{{- end }}
