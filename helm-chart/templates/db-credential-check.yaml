{{- if and .Values.postgres.enabled (eq .Values.config.db.type "postgres") }}
# Fail an upgrade before rolling Pods when the chart Secret no longer matches
# the password of the existing bundled PostgreSQL volume. This is the common
# result of reinstalling a release whose PVC survived uninstallation.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "greenkube.fullname" . }}-db-credential-check
  labels:
    {{- include "greenkube.labels" . | nindent 4 }}
    app.kubernetes.io/component: db-credential-check
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "greenkube.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: db-credential-check
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.hooks.podSecurityContext | nindent 8 }}
      containers:
        - name: db-credential-check
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.hooks.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.hooks.resources | nindent 12 }}
          env:
            - name: DB_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: {{ include "greenkube.secretName" . }}
                  key: DB_CONNECTION_STRING
            - name: HOME
              value: /tmp
          command:
            - /bin/sh
            - -c
            - |
              echo "GreenKube: verifying PostgreSQL credentials..."
              for i in $(seq 1 30); do
                if psql "$DB_CONNECTION_STRING" -v ON_ERROR_STOP=1 -c 'SELECT 1' >/dev/null 2>&1; then
                  echo "PostgreSQL credentials are valid."
                  exit 0
                fi
                echo "  Attempt $i/30 - PostgreSQL is not ready or rejected the credentials, retrying in 2s..."
                sleep 2
              done
              echo "ERROR: PostgreSQL rejected the credentials in DB_CONNECTION_STRING."
              echo ""
              echo "   This usually means a PVC from an earlier installation is being reused,"
              echo "   but the chart-generated password no longer matches the database."
              echo ""
              echo "   Either delete the volume for a clean install:"
              echo "     kubectl -n {{ .Release.Namespace }} delete pvc data-{{ include "greenkube.fullname" . }}-postgres-0"
              echo ""
              echo "   Or provide the password used by the existing database through"
              echo "   postgres.auth.password / secrets.dbConnectionString, or reference"
              echo "   an existing Secret with secrets.existingSecret."
              exit 1
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
{{- end }}
