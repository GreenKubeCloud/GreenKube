{{- if .Values.rbac.create }}
{{- /*
Read access to the one default Git credentials Secret (F12 follow-up): "get" and
"watch" on its resourceName only, never "list". The API, the controller and the
optional workers read it through the Kubernetes API, so creating the Secret
activates delivery on the next readiness tick (within 60 s) instead of after the
kubelet's refresh of the optional projected volume. A watch is authorized for a
resourceName when it selects that object with fieldSelector=metadata.name.
*/}}
{{- $v := include "greenkube.values" . | fromYaml }}
{{- $secret := include "greenkube.gitCredentialsSecretName" . }}
{{- $components := list "api" "controller" }}
{{- if gt (int ($v.worker.replicas | default 0)) 0 }}
{{- $components = append $components "worker" }}
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "greenkube.fullname" . }}-git-credentials
  labels:
    {{- include "greenkube.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $secret | quote }}]
    verbs: ["get", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "greenkube.fullname" . }}-git-credentials
  labels:
    {{- include "greenkube.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "greenkube.fullname" . }}-git-credentials
subjects:
{{- range $component := $components }}
  - kind: ServiceAccount
    name: {{ include "greenkube.componentServiceAccountName" (dict "context" $ "component" $component) }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
