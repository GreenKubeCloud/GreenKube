{{- /* Optional Ingress for the UI and API (roadmap N6); see _exposure_helpers.tpl. */ -}}
{{- $ingress := .Values.ingress | default dict }}
{{- if $ingress.enabled }}
{{- if not $ingress.hosts }}
{{- fail "ingress.hosts must list at least one host name when ingress.enabled=true (the first one also sets GREENKUBE_EXTERNAL_URL unless config.externalUrl is set)" }}
{{- end }}
{{- $v := include "greenkube.values" . | fromYaml }}
{{- $service := printf "%s-api" (include "greenkube.fullname" .) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "greenkube.fullname" . }}
  labels:
    {{- include "greenkube.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
    {{- with $ingress.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with $ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $host := $ingress.hosts }}
    - host: {{ $host | quote }}
      http:
        paths:
          - path: {{ include "greenkube.exposurePath" $ | quote }}
            pathType: Prefix
            backend:
              service:
                name: {{ $service }}
                port:
                  number: {{ $v.api.port }}
    {{- end }}
{{- end }}
