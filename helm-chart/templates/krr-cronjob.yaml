{{- /*
Optional KRR job mode (roadmap G2): run Robusta KRR on a schedule and push its
JSON report to POST /api/v1/sources/krr/reports. Disabled by default.

* An init container runs `krr <strategy> -f json --fileoutput /report/krr.json`
  with a read-only ClusterRole of its own (see docs/sources/krr.md).
* The upload container (the GreenKube image, no extra tool) posts the report
  with an API key of scope signals:report (signals:write: deprecated) read from sources.krr.job.apiKeySecret.
*/ -}}
{{- include "greenkube.requireChartDefaults" . -}}
{{- $job := .Values.sources.krr.job -}}
{{- if $job.enabled }}
{{- $v := include "greenkube.values" . | fromYaml }}
{{- $secretName := required "sources.krr.job.apiKeySecret.name is required: a Secret holding a GreenKube API key with scope signals:report" $job.apiKeySecret.name }}
{{- $digest := $job.image.digest | default "" | toString }}
{{- if not (regexMatch "^sha256:[0-9a-fA-F]{64}$" $digest) }}
{{- fail "sources.krr.job.image.digest must pin the KRR image (sha256:<64 hexadecimal characters>)" }}
{{- end }}
{{- $name := printf "%s-krr" (include "greenkube.fullname" . | trunc 59 | trimSuffix "-") }}
{{- if $job.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "greenkube.labels" . | nindent 4 }}
    app.kubernetes.io/component: krr
---
# KRR reads workloads, their pods and HPAs across the cluster, plus Services to
# discover Prometheus. Read-only; no Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    {{- include "greenkube.labels" . | nindent 4 }}
    app.kubernetes.io/component: krr
rules:
- apiGroups: [""]
  resources: ["pods", "nodes", "namespaces", "services"]
  verbs: ["get", "list"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
  verbs: ["get", "list"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list"]
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["get", "list"]
- apiGroups: ["argoproj.io"]
  resources: ["rollouts"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "greenkube.labels" . | nindent 4 }}
    app.kubernetes.io/component: krr
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
- kind: ServiceAccount
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
---
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}
  labels:
    {{- include "greenkube.labels" . | nindent 4 }}
    app.kubernetes.io/component: krr
spec:
  schedule: {{ $job.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: {{ $job.activeDeadlineSeconds }}
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            {{- include "greenkube.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: krr
        spec:
          restartPolicy: Never
          serviceAccountName: {{ if $job.rbac.create }}{{ $name }}{{ else }}{{ required "sources.krr.job.serviceAccountName is required when sources.krr.job.rbac.create is false" $job.serviceAccountName }}{{ end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: krr
              image: "{{ $job.image.repository }}@{{ $digest }}"
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              env:
                - name: HOME
                  value: /tmp
              command:
                - python
                - krr.py
                - {{ $job.strategy | quote }}
                - -f
                - json
                - --fileoutput
                - /report/krr.json
                - --logtostderr
                {{- with $job.prometheusUrl }}
                - -p
                - {{ . | quote }}
                {{- end }}
                {{- range $job.extraArgs }}
                - {{ . | quote }}
                {{- end }}
              resources:
                {{- toYaml $job.resources | nindent 16 }}
              volumeMounts:
                - name: report
                  mountPath: /report
                - name: tmp
                  mountPath: /tmp
          containers:
            - name: upload
              image: "{{ include "greenkube.image" . }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              env:
                - name: GREENKUBE_KRR_REPORT_URL
                  value: "http://{{ include "greenkube.fullname" . }}-api.{{ .Release.Namespace }}.svc:{{ $v.api.port }}/api/v1/sources/krr/reports"
                - name: GREENKUBE_SIGNALS_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ $secretName }}
                      key: {{ $job.apiKeySecret.key | default "api-key" }}
              command:
                - python
                - -c
                - |
                  import os, sys, urllib.request
                  with open("/report/krr.json", "rb") as report:
                      body = report.read()
                  request = urllib.request.Request(
                      os.environ["GREENKUBE_KRR_REPORT_URL"],
                      data=body,
                      method="POST",
                      headers={
                          "Content-Type": "application/json",
                          "Authorization": "Bearer " + os.environ["GREENKUBE_SIGNALS_API_KEY"],
                      },
                  )
                  with urllib.request.urlopen(request, timeout=120) as response:
                      print(response.status, response.read(2000).decode("utf-8", "replace"))
                  sys.exit(0)
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: report
                  mountPath: /report
                  readOnly: true
          volumes:
            - name: report
              emptyDir: {}
            - name: tmp
              emptyDir: {}
{{- end }}
