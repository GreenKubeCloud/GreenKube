{{- /* The controller Lease is always rendered (F11): leader election is always on. */ -}}
{{- $v := include "greenkube.values" . | fromYaml }}
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: {{ include "greenkube.leaseName" . }}
  labels:
    {{- include "greenkube.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  leaseDurationSeconds: {{ ($v.controller.leaderElection | default dict).leaseDurationSeconds | default 30 | int }}
