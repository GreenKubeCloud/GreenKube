{{- if and (eq .Values.profile "production") .Values.production.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "greenkube.fullname" . }}-migration
  labels:
    {{- include "greenkube.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.production.migration.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "greenkube.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      # The migration hook runs before production component resources are
      # considered ready; it does not call the Kubernetes API.
      serviceAccountName: default
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- if and .Values.postgres.enabled (eq .Values.config.db.type "postgres") }}
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.initContainer.image.repository }}:{{ .Values.initContainer.image.tag }}
          imagePullPolicy: {{ .Values.initContainer.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -c
            - >-
              for attempt in $(seq 1 60); do
                if nc -z {{ include "greenkube.fullname" . }}-postgres 5432; then exit 0; fi;
                sleep 2;
              done;
              echo "PostgreSQL did not become ready for schema migrations" >&2;
              exit 1
      {{- end }}
      containers:
        - name: migration
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: [ALL]
          command: ["python"]
          args:
            - -c
            - >-
              import asyncio;
              from greenkube.core.db import get_db_manager;
              asyncio.run(get_db_manager().connect())
          envFrom:
            - configMapRef:
                name: {{ include "greenkube.fullname" . }}
            - secretRef:
                name: {{ include "greenkube.secretName" . }}
                optional: true
          env:
            - name: DB_SCHEMA
              value: {{ .Values.config.db.schema | quote }}
            - name: DB_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: {{ include "greenkube.secretName" . }}
                  key: DB_CONNECTION_STRING
{{- end }}
