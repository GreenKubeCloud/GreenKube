{{- if and (eq .Values.profile "production") .Values.production.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "greenkube.fullname" . }}-migration
  labels:
    {{- include "greenkube.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.production.migration.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "greenkube.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      # The migration hook runs before production component resources are
      # created, so it must use the namespace's default service account.
      # It does not call the Kubernetes API.
      serviceAccountName: default
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migration
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: [ALL]
          command: ["python"]
          args:
            - -c
            - >-
              import asyncio;
              from greenkube.core.db import get_db_manager;
              asyncio.run(get_db_manager().connect())
          envFrom:
            - configMapRef:
                name: {{ include "greenkube.fullname" . }}
            - secretRef:
                name: {{ include "greenkube.secretName" . }}
                optional: true
          env:
            - name: DB_SCHEMA
              value: {{ .Values.config.db.schema | quote }}
            - name: DB_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: {{ include "greenkube.secretName" . }}
                  key: DB_CONNECTION_STRING
{{- end }}
