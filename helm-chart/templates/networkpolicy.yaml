{{- $root := . -}}
{{- if $root.Values.monitoring.networkPolicy.enabled -}}
{{- $v := include "greenkube.values" $root | fromYaml -}}
{{- $components := list "api" "controller" -}}
{{- if gt (int ($v.worker.replicas | default 0)) 0 -}}
  {{- $components = append $components "worker" -}}
{{- end -}}
{{- $additionalEgress := $root.Values.monitoring.networkPolicy.additionalEgress | default (list) -}}
{{- if not (kindIs "slice" $additionalEgress) -}}
  {{- fail "monitoring.networkPolicy.additionalEgress must be a list of NetworkPolicy egress rules" -}}
{{- end -}}
{{- range $component := $components -}}
{{- $apiComponent := eq $component "api" -}}
{{- $apiIngress := $apiComponent -}}
{{- $workerIngress := eq $component "worker" -}}
{{- $customIngress := and $apiComponent $root.Values.monitoring.networkPolicy.additionalIngress -}}
{{- $controllerMetricsPort := int (include "greenkube.controllerMetricsPort" $root) -}}
{{- $controllerIngress := and (eq $component "controller") (gt $controllerMetricsPort 0) -}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-%s-netpol" (include "greenkube.fullname" $root | trunc 38 | trimSuffix "-") $component | trunc 63 | trimSuffix "-" }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "greenkube.labels" $root | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "greenkube.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: {{ $component }}
  policyTypes:
    - Ingress
    - Egress
  {{- if or $apiIngress $workerIngress $customIngress $controllerIngress }}
  ingress:
    {{- if $apiIngress }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $root.Values.monitoring.networkPolicy.prometheusNamespace | default "monitoring" }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: {{ $v.api.port }}
    {{- end }}
    {{- if $workerIngress }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $root.Values.monitoring.networkPolicy.prometheusNamespace | default "monitoring" }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: {{ include "greenkube.workerMetricsPort" $root }}
    {{- end }}
    {{- if and $apiComponent $root.Values.monitoring.networkPolicy.additionalIngress }}
    {{- toYaml $root.Values.monitoring.networkPolicy.additionalIngress | nindent 4 }}
    {{- end }}
    {{- if $controllerIngress }}
    # Prometheus scrapes the controller's own control-loop metrics listener.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $root.Values.monitoring.networkPolicy.prometheusNamespace | default "monitoring" }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: {{ $controllerMetricsPort }}
    {{- end }}
  {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if include "greenkube.bundledPostgres" $root }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "greenkube.selectorLabels" $root | nindent 14 }}
              app.kubernetes.io/component: postgres
      ports:
        - protocol: TCP
          port: 5432
    {{- end }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "greenkube.selectorLabels" $root | nindent 14 }}
              app.kubernetes.io/component: renderer-sandbox
      ports:
        - protocol: TCP
          port: {{ $v.renderer.servicePort | int }}
    {{- with $additionalEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- printf "\n" }}
{{- end -}}
{{- end -}}
