{{- /* Validates the values first: a 0.3.x SQLite release fails with the migration commands (F17). */ -}}
{{- $_ := include "greenkube.values" . }}
{{- if include "greenkube.bundledPostgres" . }}
{{- /*
A retained PostgreSQL volume is protected at run time by the credentials
bootstrap hook, which refuses to generate a new password for it. A
render-time lookup cannot work under Argo CD (`helm template`), BUG-58.
*/}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "greenkube.fullname" . }}-postgres
  labels:
    {{- include "greenkube.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "greenkube.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "greenkube.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "greenkube.podLabels" (dict "context" . "cfg" .Values.postgres "component" "postgres") | nindent 8 }}
      {{- with .Values.postgres.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with include "greenkube.imagePullSecrets" . }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- with include "greenkube.podScheduling" (dict "context" . "cfg" .Values.postgres "component" "postgres" "replicas" 1) }}
      {{- . | nindent 6 }}
      {{- end }}
      # Room for a clean shutdown checkpoint before SIGKILL.
      terminationGracePeriodSeconds: {{ .Values.postgres.terminationGracePeriodSeconds | default 60 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      # No root init container (N5, Pod Security "restricted"): fsGroup makes
      # the /var/run/postgresql emptyDir group-writable for UID 70, and the
      # official entrypoint ignores its own failed "chmod" on that directory.
      containers:
        - name: postgres
          image: {{ include "greenkube.helperImage" .Values.postgres.image | quote }}
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.auth.username }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "greenkube.secretNameFor" (dict "context" . "key" "POSTGRES_PASSWORD") }}
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: {{ .Values.postgres.auth.database }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_INITDB_ARGS
              value: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
          {{- if .Values.postgres.resources }}
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          {{- end }}
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.postgres.auth.username }}
                - -d
                - {{ .Values.postgres.auth.database }}
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.postgres.auth.username }}
                - -d
                - {{ .Values.postgres.auth.database }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: pg-run
              mountPath: /var/run/postgresql
            - name: pg-tmp
              mountPath: /tmp
            {{- if .Values.postgres.shmSizeLimit }}
            # Parallel query workers use POSIX shared memory; the runtime default
            # /dev/shm (64Mi) makes large aggregations fail with "No space left on device".
            - name: dshm
              mountPath: /dev/shm
            {{- end }}
      {{- if not .Values.postgres.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
        - name: pg-run
          emptyDir:
            sizeLimit: 16Mi
        - name: pg-tmp
          emptyDir:
            sizeLimit: 64Mi
        {{- if .Values.postgres.shmSizeLimit }}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.postgres.shmSizeLimit }}
        {{- end }}
      {{- else }}
      volumes:
        - name: pg-run
          emptyDir:
            sizeLimit: 16Mi
        - name: pg-tmp
          emptyDir:
            sizeLimit: 64Mi
        {{- if .Values.postgres.shmSizeLimit }}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.postgres.shmSizeLimit }}
        {{- end }}
      {{- end }}
  {{- if .Values.postgres.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        {{- if .Values.postgres.persistence.storageClassName }}
        storageClassName: {{ .Values.postgres.persistence.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
  {{- end }}
{{- end }}
