{{- if .Values.monitoring.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "greenkube.fullname" . }}-automation
  namespace: {{ .Values.monitoring.prometheusRule.namespace | default .Release.Namespace }}
  labels:
    {{- include "greenkube.labels" . | nindent 4 }}
    {{- with .Values.monitoring.prometheusRule.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: greenkube.automation
      rules:
        - alert: GreenKubeAutomationOperationsStuck
          expr: greenkube_automation_backlog{queue="operations",state="stuck"} > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: GreenKube plan operations are stuck
            description: One or more automation operations have exceeded their stale threshold.
        - alert: GreenKubeAutomationOperationFailed
          expr: greenkube_automation_backlog{queue="operations",state="failed"} > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: GreenKube plan operations failed
            description: One or more automation operations exhausted their retry policy.
        - alert: GreenKubeAutomationPlansStuck
          expr: greenkube_automation_backlog{queue="plans",state="stuck"} > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: GreenKube plans are waiting too long
            description: One or more applying or merged plans have not advanced within the stale threshold.
        - alert: GreenKubeAutomationSyncFailed
          expr: greenkube_automation_backlog{queue="plans",state="sync_failed"} > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: GreenKube GitOps synchronization failed
            description: One or more plans require operator review after a controller sync failure.
        - alert: GreenKubeWebhookDeliveriesStuck
          expr: greenkube_automation_backlog{queue="webhooks",state="stuck"} > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: GreenKube webhook deliveries are not reconciling
            description: One or more verified provider deliveries remain non-terminal beyond the stale threshold.
        - alert: GreenKubeAutomationWorkerStale
          expr: |
            greenkube_automation_backlog{queue="workers",state="stale"} > 0
            and on (job, instance)
            sum by (job, instance) (
              greenkube_automation_backlog{queue="operations",state=~"queued|retrying"}
            ) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: GreenKube automation worker heartbeat is stale
            description: At least one persisted automation worker heartbeat is older than the stale threshold.
    {{- if and .Values.monitoring.prometheusRule.controllerAlerts .Values.monitoring.serviceMonitor.enabled (gt (int (include "greenkube.controllerMetricsPort" .)) 0) }}
    # Controller loops (M8). Rendered only with the controller ServiceMonitor
    # (same condition), otherwise GreenKubeNoActiveController would always fire.
    - name: greenkube.controller
      rules:
        - alert: GreenKubeControllerLoopFailing
          expr: max by (loop) (greenkube_loop_consecutive_failures) >= 3
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: A GreenKube controller loop keeps failing
            description: {{ `Controller loop {{ $labels.loop }} failed {{ $value }} times in a row; see GET /api/v1/automation/status (controller.instances[].loops) and the controller logs.` | quote }}
        - alert: GreenKubeAutomationLoopStale
          expr: time() - max(greenkube_loop_last_success_timestamp_seconds{loop="automation-controller"}) > 600
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: The GreenKube automation controller loop has not succeeded for 10 minutes
            description: Webhook outbox, PR polling, plan expiry and retention are not advancing on the leader controller.
        - alert: GreenKubeNoActiveController
          expr: (max(greenkube_controller_leader) or vector(0)) < 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: No GreenKube controller holds the leader Lease
            description: Collection, scans, apply detection, measurement and automation run only on the leader controller; none is running or scraped.
    {{- $thresholds := .Values.monitoring.prometheusRule.thresholds | default dict }}
    {{- $collectionLag := int ($thresholds.collectionLagSeconds | default 1800) }}
    {{- $scanStale := int ($thresholds.recommendationScanStaleSeconds | default 10800) }}
    {{- $measurementStale := int ($thresholds.measurementStaleSeconds | default 1800) }}
    # Loop health (N7): collection watermark, recommendation scans, measurement
    # and ledger integrity. Every series comes from the controller metrics
    # endpoint, hence the same rendering condition as greenkube.controller.
    - name: greenkube.loop
      rules:
        - alert: GreenKubeCollectionLagging
          # Only the leader collects: a standby keeps the last value it set.
          expr: |
            max by (source) (
              greenkube_collection_watermark_lag_seconds
              * on (job, instance) group_left ()
              greenkube_controller_leader
            ) > {{ $collectionLag }}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: GreenKube metric collection is falling behind
            description: {{ printf "The %s collection watermark is {{ $value | humanizeDuration }} behind (threshold %ds): recommendations and measurements read stale data. See the collection loop in GET /api/v1/automation/status and the controller logs." "{{ $labels.source }}" $collectionLag | quote }}
        - alert: GreenKubeRecommendationScanFailing
          expr: |
            sum(increase(greenkube_optimization_runs_total{status="failed"}[1h])) > 0
            unless
            sum(increase(greenkube_optimization_runs_total{status="succeeded"}[1h])) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: GreenKube recommendation scans are failing
            description: Every recommendation scan of the last hour failed and none succeeded; the inbox is not refreshed. See GET /api/v1/optimization/runs and the controller logs.
        - alert: GreenKubeRecommendationSourceFailing
          expr: sum by (source) (increase(greenkube_optimization_analyzer_failures_total[2h])) > 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: A GreenKube recommendation source keeps failing
            description: {{ `Recommendation source {{ $labels.source }} failed during scans for more than an hour; its signals are missing from consensus. See the Sources page (/sources).` | quote }}
        - alert: GreenKubeRecommendationScanStale
          expr: |
            (time() - max(greenkube_last_successful_optimization_run_timestamp_seconds) > {{ $scanStale }})
            and
            max(greenkube_last_successful_optimization_run_timestamp_seconds) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: No GreenKube recommendation scan has succeeded recently
            description: {{ printf "The last successful recommendation scan is older than %ds." $scanStale | quote }}
        - alert: GreenKubeMeasurementStalled
          expr: time() - max(greenkube_loop_last_success_timestamp_seconds{loop="recommendation-lifecycle"}) > {{ $measurementStale }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: GreenKube measurements are not advancing
            description: {{ printf "The recommendation-lifecycle loop (apply detection, verification, change measurement) has not succeeded for more than %ds: applied changes wait unmeasured and the measurement backlog grows." $measurementStale | quote }}
        - alert: GreenKubeLedgerChainVerificationFailed
          expr: sum(increase(greenkube_ledger_chain_verification_failures_total[1h])) > 0
          labels:
            severity: critical
          annotations:
            summary: The GreenKube savings ledger failed its hash-chain verification
            description: A ledger entry no longer matches the hash chain (edited, deleted or reordered rows). Treat the ledger as untrusted until it is investigated; see docs/observability-slos.md.
    {{- end }}
{{- end }}
