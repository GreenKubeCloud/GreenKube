{{- if .Values.monitoring.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "greenkube.fullname" . }}-automation
  namespace: {{ .Values.monitoring.prometheusRule.namespace | default .Release.Namespace }}
  labels:
    {{- include "greenkube.labels" . | nindent 4 }}
    {{- with .Values.monitoring.prometheusRule.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: greenkube.automation
      rules:
        - alert: GreenKubeAutomationOperationsStuck
          expr: greenkube_automation_backlog{queue="operations",state="stuck"} > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: GreenKube plan operations are stuck
            description: One or more automation operations have exceeded their stale threshold.
        - alert: GreenKubeAutomationOperationFailed
          expr: greenkube_automation_backlog{queue="operations",state="failed"} > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: GreenKube plan operations failed
            description: One or more automation operations exhausted their retry policy.
        - alert: GreenKubeAutomationPlansStuck
          expr: greenkube_automation_backlog{queue="plans",state="stuck"} > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: GreenKube plans are waiting too long
            description: One or more applying or merged plans have not advanced within the stale threshold.
        - alert: GreenKubeAutomationSyncFailed
          expr: greenkube_automation_backlog{queue="plans",state="sync_failed"} > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: GreenKube GitOps synchronization failed
            description: One or more plans require operator review after a controller sync failure.
        - alert: GreenKubeWebhookDeliveriesStuck
          expr: greenkube_automation_backlog{queue="webhooks",state="stuck"} > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: GreenKube webhook deliveries are not reconciling
            description: One or more verified provider deliveries remain non-terminal beyond the stale threshold.
        - alert: GreenKubeAutomationWorkerStale
          expr: |
            greenkube_automation_backlog{queue="workers",state="stale"} > 0
            and on (job, instance)
            sum by (job, instance) (
              greenkube_automation_backlog{queue="operations",state=~"queued|retrying"}
            ) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: GreenKube automation worker heartbeat is stale
            description: At least one persisted automation worker heartbeat is older than the stale threshold.
    {{- if and .Values.monitoring.prometheusRule.controllerAlerts .Values.monitoring.serviceMonitor.enabled (gt (int (include "greenkube.controllerMetricsPort" .)) 0) }}
    # Controller loops (M8). Rendered only with the controller ServiceMonitor
    # (same condition), otherwise GreenKubeNoActiveController would always fire.
    - name: greenkube.controller
      rules:
        - alert: GreenKubeControllerLoopFailing
          expr: max by (loop) (greenkube_loop_consecutive_failures) >= 3
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: A GreenKube controller loop keeps failing
            description: {{ `Controller loop {{ $labels.loop }} failed {{ $value }} times in a row; see GET /api/v1/automation/status (controller.instances[].loops) and the controller logs.` | quote }}
        - alert: GreenKubeAutomationLoopStale
          expr: time() - max(greenkube_loop_last_success_timestamp_seconds{loop="automation-controller"}) > 600
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: The GreenKube automation controller loop has not succeeded for 10 minutes
            description: Webhook outbox, PR polling, plan expiry and retention are not advancing on the leader controller.
        - alert: GreenKubeNoActiveController
          expr: (max(greenkube_controller_leader) or vector(0)) < 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: No GreenKube controller holds the leader Lease
            description: Collection, scans, apply detection, measurement and automation run only on the leader controller; none is running or scraped.
        - alert: GreenKubeLedgerChainVerificationFailed
          expr: min by (cluster_uid) (greenkube_ledger_chain_ok) == 0
          labels:
            severity: critical
          annotations:
            summary: The GreenKube savings ledger hash chain failed verification
            description: {{ `An entry of the append-only savings ledger of cluster {{ $labels.cluster_uid }} was modified, removed or reordered; greenkube_ledger_chain_verification_failures_total gives the reason, GET /api/v2/ledger/summary (chain) and the controller logs the position.` | quote }}
        - alert: GreenKubeLedgerProjectionBacklog
          expr: max by (source_table) (greenkube_ledger_unprojected_rows) > 0
          for: 3h
          labels:
            severity: warning
          annotations:
            summary: Savings accruals are missing from the GreenKube savings ledger v2
            description: {{ `{{ $value }} row(s) of {{ $labels.source_table }} have no savings ledger v2 entry after full sweeps for 3 hours; the v2 totals do not reconcile with GET /api/v1/recommendations/savings. See greenkube_ledger_write_errors_total and the controller logs.` | quote }}
    {{- end }}
{{- end }}
