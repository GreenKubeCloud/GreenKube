{{- $initialAdmin := include "greenkube.initialAdminSecretName" . }}
{{- if $initialAdmin }}
# Namespaced Role for the API's first-admin bootstrap (F14). It can read the one
# Secret holding the generated initial admin password and patch it to erase the
# plaintext once the password was changed. Nothing else: the API never writes
# runtime configuration into Secrets (A13, BUG-60), and the Secret is created by
# the credentials bootstrap hook because Kubernetes RBAC cannot restrict
# "create" to a resource name.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "greenkube.fullname" . }}-initial-admin
  labels:
    {{- include "greenkube.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $initialAdmin | quote }}]
    verbs: ["get", "patch"]
{{- end }}
