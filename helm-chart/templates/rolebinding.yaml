{{- if include "greenkube.initialAdminSecretName" . }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "greenkube.fullname" . }}-initial-admin
  labels:
    {{- include "greenkube.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "greenkube.fullname" . }}-initial-admin
subjects:
  - kind: ServiceAccount
    name: {{ include "greenkube.componentServiceAccountName" (dict "context" . "component" "api") }}
    namespace: {{ .Release.Namespace }}
{{- end }}
