{{- /*
Credentials supplied through values (secrets.*, postgres.auth.password and the
service URLs). This is a regular release resource rendered from values only, so
`helm template` output is stable under Argo CD and Flux (BUG-58).

Generated credentials (an API key and the bundled PostgreSQL password when they
are not supplied) are never rendered: the credentials bootstrap hook creates
them once in the Secret named by greenkube.secretName, outside the release.
With secrets.existingSecret, the chart renders no Secret at all.
*/ -}}
{{- $data := include "greenkube.secretValues" . | fromYaml }}
{{- if $data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "greenkube.valuesSecretName" . }}
  labels:
    {{- include "greenkube.labels" . | nindent 4 }}
    app.kubernetes.io/component: credentials
type: Opaque
data:
  {{- range $key := keys $data | sortAlpha }}
  {{ $key }}: {{ get $data $key | b64enc | quote }}
  {{- end }}
{{- end }}
