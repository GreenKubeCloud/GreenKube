{{- if .Values.serviceAccount.create }}
{{- $v := include "greenkube.values" . | fromYaml }}
{{- $components := list "api" "controller" }}
{{- if gt (int ($v.worker.replicas | default 0)) 0 }}
{{- $components = append $components "worker" }}
{{- end }}
{{- range $component := $components }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "greenkube.componentServiceAccountName" (dict "context" $ "component" $component) }}
  labels:
    {{- include "greenkube.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
{{- end }}
{{- end }}
