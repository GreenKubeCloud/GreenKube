{{- $v := include "greenkube.values" . | fromYaml }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "greenkube.fullname" . }}-test-connection"
  labels:
    {{- include "greenkube.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  {{- with include "greenkube.imagePullSecrets" . }}
  {{- . | nindent 2 }}
  {{- end }}
  securityContext:
    {{- toYaml .Values.tests.podSecurityContext | nindent 4 }}
  containers:
    - name: wget
      image: {{ include "greenkube.helperImage" .Values.initContainer.image | quote }}
      imagePullPolicy: IfNotPresent
      securityContext:
        {{- toYaml .Values.tests.containerSecurityContext | nindent 8 }}
      resources:
        {{- toYaml .Values.tests.resources | nindent 8 }}
      command: ['wget']
      args: ['--spider', '--timeout=5', 'http://{{ include "greenkube.fullname" . }}-api:{{ $v.api.port }}/api/v1/health']
  restartPolicy: Never
