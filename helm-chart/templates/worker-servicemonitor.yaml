{{- $v := include "greenkube.values" . | fromYaml }}
{{- if and .Values.monitoring.serviceMonitor.enabled (gt (int ($v.worker.replicas | default 0)) 0) }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "greenkube.fullname" . }}-worker
  namespace: {{ include "greenkube.serviceMonitorNamespace" . }}
  labels:
    {{- include "greenkube.labels" . | nindent 4 }}
    app.kubernetes.io/part-of: kube-prometheus
    {{- with .Values.monitoring.serviceMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      {{- include "greenkube.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker-metrics
  endpoints:
    - port: worker-metrics
      path: /prometheus/metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval | default "30s" }}
      scrapeTimeout: {{ .Values.monitoring.serviceMonitor.scrapeTimeout | default "10s" }}
      # The worker accepts the scrape token (or, without one, the deprecated bootstrap key).
      authorization:
        type: Bearer
        credentials:
          {{- include "greenkube.scrapeCredentials" . | nindent 10 }}
{{- end }}
