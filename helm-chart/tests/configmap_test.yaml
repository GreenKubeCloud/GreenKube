suite: configmap
templates:
  - templates/configmap.yaml

tests:
  # --------------------------------------------------------------------------
  # Kind / structure
  # --------------------------------------------------------------------------
  - it: should render a ConfigMap
    asserts:
      - isKind:
          of: ConfigMap

  - it: should include the chart labels
    asserts:
      - isNotEmpty:
          path: metadata.labels["helm.sh/chart"]
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: greenkube

  # --------------------------------------------------------------------------
  # Core environment variables
  # --------------------------------------------------------------------------
  - it: should set LOG_LEVEL from values
    asserts:
      - equal:
          path: data.LOG_LEVEL
          value: "INFO"

  - it: should reflect a custom log level
    set:
      config.logLevel: DEBUG
    asserts:
      - equal:
          path: data.LOG_LEVEL
          value: "DEBUG"

  - it: passes the Helm render capabilities of the installed cluster
    asserts:
      - isNotEmpty:
          path: data.GITOPS_HELM_KUBE_VERSION
      - isNotEmpty:
          path: data.GITOPS_HELM_API_VERSIONS_JSON

  - it: should set DB_TYPE
    asserts:
      - equal:
          path: data.DB_TYPE
          value: "postgres"

  - it: should reflect sqlite db type
    set:
      config.db.type: sqlite
    asserts:
      - equal:
          path: data.DB_TYPE
          value: "sqlite"

  - it: should set CLOUD_PROVIDER
    asserts:
      - equal:
          path: data.CLOUD_PROVIDER
          value: "unknown"

  - it: should set DEFAULT_INTENSITY
    asserts:
      - equal:
          path: data.DEFAULT_INTENSITY
          value: "500"

  - it: should set NORMALIZATION_GRANULARITY
    asserts:
      - equal:
          path: data.NORMALIZATION_GRANULARITY
          value: "hour"

  - it: should set ELECTRICITY_PROVIDER to electricity_maps by default
    asserts:
      - equal:
          path: data.ELECTRICITY_PROVIDER
          value: "electricity_maps"

  - it: should set ELECTRICITY_PROVIDER to wattnet when configured
    set:
      config.electricityProvider: wattnet
    asserts:
      - equal:
          path: data.ELECTRICITY_PROVIDER
          value: "wattnet"

  # --------------------------------------------------------------------------
  # Prometheus config
  # --------------------------------------------------------------------------
  # NOTE: PROMETHEUS_URL is now stored in the Secret (supports UI-set overrides).
  # Tests for PROMETHEUS_URL live in secret_test.yaml.
  - it: should set PROMETHEUS_QUERY_RANGE_STEP
    asserts:
      - equal:
          path: data.PROMETHEUS_QUERY_RANGE_STEP
          value: "5m"

  - it: should set the collection catch-up settings
    asserts:
      - equal:
          path: data.PROMETHEUS_SCRAPE_INTERVAL
          value: "30s"
      - equal:
          path: data.COLLECTION_SAFETY_LAG
          value: "1m"
      - equal:
          path: data.COLLECTION_MAX_BACKFILL
          value: "24h"

  - it: should allow overriding the collection catch-up settings
    set:
      config.prometheus.scrapeInterval: 15s
      config.collection.safetyLag: 2m
      config.collection.maxBackfill: 6h
    asserts:
      - equal:
          path: data.PROMETHEUS_SCRAPE_INTERVAL
          value: "15s"
      - equal:
          path: data.COLLECTION_SAFETY_LAG
          value: "2m"
      - equal:
          path: data.COLLECTION_MAX_BACKFILL
          value: "6h"

  - it: should set PROMETHEUS_NODE_INSTANCE_LABEL
    asserts:
      - equal:
          path: data.PROMETHEUS_NODE_INSTANCE_LABEL
          value: "label_node_kubernetes_io_instance_type"

  # --------------------------------------------------------------------------
  # OpenCost config
  # --------------------------------------------------------------------------
  # NOTE: OPENCOST_API_URL is now stored in the Secret (supports UI-set overrides).
  # Tests for OPENCOST_API_URL live in secret_test.yaml.

  # --------------------------------------------------------------------------
  # API config
  # --------------------------------------------------------------------------
  - it: should set API_PORT
    asserts:
      - equal:
          path: data.API_PORT
          value: "8000"

  - it: should keep CORS same-origin by default (BUG-59)
    asserts:
      - equal:
          path: data.CORS_ORIGINS
          value: ""

  - it: should render explicit CORS origins
    set:
      config.corsOrigins: "https://greenkube.example.com"
    asserts:
      - equal:
          path: data.CORS_ORIGINS
          value: "https://greenkube.example.com"

  # Service URLs come from a Secret: the values Secret when set in values,
  # otherwise a Settings-page override in the release Secret.
  - it: should not carry service URLs that live in a Secret
    set:
      config.prometheus.url: "http://prometheus:9090"
      config.opencost.url: "http://opencost:9003"
      config.boavizta.url: "https://custom-boavizta.example.com"
    asserts:
      - notExists:
          path: data.PROMETHEUS_URL
      - notExists:
          path: data.OPENCOST_API_URL
      - notExists:
          path: data.BOAVIZTA_API_URL

  # secrets.existingSecret replaces the values Secret, so the ConfigMap carries
  # the Boavizta URL (as in 0.3.x); a key in that Secret still wins.
  - it: should carry BOAVIZTA_API_URL set in values when secrets.existingSecret is used
    set:
      secrets.existingSecret: gitops-credentials
      config.boavizta.url: "https://custom-boavizta.example.com"
    asserts:
      - equal:
          path: data.BOAVIZTA_API_URL
          value: "https://custom-boavizta.example.com"

  - it: should leave BOAVIZTA_API_URL to the app default with secrets.existingSecret
    set:
      secrets.existingSecret: gitops-credentials
    asserts:
      - notExists:
          path: data.BOAVIZTA_API_URL

  - it: should set API_RATE_LIMIT
    asserts:
      - equal:
          path: data.API_RATE_LIMIT
          value: "60/minute"

  - it: should set ROOT_PATH to empty by default
    asserts:
      - equal:
          path: data.ROOT_PATH
          value: ""

  - it: should omit API keys when api.enabled is false
    set:
      config.api.enabled: false
    asserts:
      - isNull:
          path: data.API_HOST
      - isNull:
          path: data.API_PORT

  # --------------------------------------------------------------------------
  # Recommendation engine config
  # --------------------------------------------------------------------------
  - it: should set RECOMMENDATION_LOOKBACK_DAYS
    asserts:
      - equal:
          path: data.RECOMMENDATION_LOOKBACK_DAYS
          value: "14"

  - it: should set the two-way rightsizing and limits policy defaults
    asserts:
      - equal:
          path: data.RIGHTSIZING_INCREASE_THRESHOLD
          value: "0.9"
      - equal:
          path: data.RECOMMENDATION_MIN_DECREASE_COVERAGE_DAYS
          value: "7"
      - equal:
          path: data.RECOMMENDATION_LIMITS_POLICY
          value: "keep"
      - equal:
          path: data.RIGHTSIZING_MAX_INCREASE_FACTOR
          value: "2"
      - equal:
          path: data.RIGHTSIZING_WARMUP_MINUTES
          value: "10"

  - it: should let the increase cap and the warm-up be configured, including a disabled warm-up
    set:
      config.recommendations.rightsizingMaxIncreaseFactor: 3
      config.recommendations.rightsizingWarmupMinutes: 0
    asserts:
      - equal:
          path: data.RIGHTSIZING_MAX_INCREASE_FACTOR
          value: "3"
      - equal:
          path: data.RIGHTSIZING_WARMUP_MINUTES
          value: "0"

  - it: should set the deletion evidence period
    asserts:
      - equal:
          path: data.DELETION_MIN_UNUSED_DAYS
          value: "7"

  - it: should override the deletion evidence period
    set:
      config.recommendations.deletionMinUnusedDays: 14
    asserts:
      - equal:
          path: data.DELETION_MIN_UNUSED_DAYS
          value: "14"

  - it: should set RIGHTSIZING_CPU_THRESHOLD
    asserts:
      - equal:
          path: data.RIGHTSIZING_CPU_THRESHOLD
          value: "0.3"

  - it: should set STORAGE_COST_PER_GIB_MONTH
    asserts:
      - equal:
          path: data.STORAGE_COST_PER_GIB_MONTH
          value: "0.1"

  - it: should reflect a custom storage cost per GiB-month
    set:
      config.recommendations.storageCostPerGibMonth: 0.25
    asserts:
      - equal:
          path: data.STORAGE_COST_PER_GIB_MONTH
          value: "0.25"

  - it: should set LOAD_BALANCER_COST_PER_MONTH
    asserts:
      - equal:
          path: data.LOAD_BALANCER_COST_PER_MONTH
          value: "18"

  - it: should reflect a custom LoadBalancer cost per month
    set:
      config.recommendations.loadBalancerCostPerMonth: 25.0
    asserts:
      - equal:
          path: data.LOAD_BALANCER_COST_PER_MONTH
          value: "25"

  # --------------------------------------------------------------------------
  # Verification & automation (Phases 3–4)
  # --------------------------------------------------------------------------
  - it: should enable VPA and Karpenter connectors by default
    asserts:
      - equal:
          path: data.RECOMMENDATION_VPA_ENABLED
          value: "true"
      - equal:
          path: data.RECOMMENDATION_KARPENTER_ENABLED
          value: "true"
      - equal:
          path: data.KUBERNETES_METRICS_API_ENABLED
          value: "true"

  - it: should disable the VPA and Karpenter connectors when set to false
    set:
      config.recommendations.vpaEnabled: false
      config.recommendations.karpenterEnabled: false
    asserts:
      - equal:
          path: data.RECOMMENDATION_VPA_ENABLED
          value: "false"
      - equal:
          path: data.RECOMMENDATION_KARPENTER_ENABLED
          value: "false"

  - it: should load source plugins with no per-source settings by default
    asserts:
      - equal:
          path: data.SOURCES_PLUGINS_ENABLED
          value: "true"
      - equal:
          path: data.SOURCES_CONFIG
          value: "{}"

  - it: should render per-source settings as JSON
    set:
      sources.pluginsEnabled: false
      sources.settings:
        greenkube.carbon_aware:
          enabled: false
        vpa:
          enabled: auto
    asserts:
      - equal:
          path: data.SOURCES_PLUGINS_ENABLED
          value: "false"
      - equal:
          path: data.SOURCES_CONFIG
          value: '{"greenkube.carbon_aware":{"enabled":false},"vpa":{"enabled":"auto"}}'

  - it: should schedule recommendation scans hourly by default
    asserts:
      - equal:
          path: data.RECOMMENDATION_SCAN_INTERVAL
          value: "1h"

  - it: should reflect a custom recommendation scan interval
    set:
      config.recommendations.scanInterval: 30m
    asserts:
      - equal:
          path: data.RECOMMENDATION_SCAN_INTERVAL
          value: "30m"

  - it: should set verification window defaults
    asserts:
      - equal:
          path: data.VERIFICATION_WINDOW_HOURS
          value: "72"
      - equal:
          path: data.VERIFICATION_MIN_SAVINGS_RATIO
          value: "0.5"
      - equal:
          path: data.RECOMMENDATION_LIFECYCLE_INTERVAL
          value: "5m"

  - it: should reflect custom verification settings
    set:
      config.recommendations.verification.windowHours: 24
      config.recommendations.verification.minSavingsRatio: 0.75
    asserts:
      - equal:
          path: data.VERIFICATION_WINDOW_HOURS
          value: "24"
      - equal:
          path: data.VERIFICATION_MIN_SAVINGS_RATIO
          value: "0.75"

  - it: should set change measurement defaults
    asserts:
      - equal:
          path: data.CHANGE_MEASUREMENT_ENABLED
          value: "true"
      - equal:
          path: data.CHANGE_MEASUREMENT_PRE_WINDOW_DAYS
          value: "7"
      - equal:
          path: data.CHANGE_MEASUREMENT_POST_WINDOW_DAYS
          value: "7"
      - equal:
          path: data.CHANGE_MEASUREMENT_WARMUP_HOURS
          value: "1"
      - equal:
          path: data.CHANGE_MEASUREMENT_MIN_COVERAGE
          value: "0.8"
      - equal:
          path: data.CHANGE_MEASUREMENT_BOOTSTRAP_SAMPLES
          value: "1000"
      - equal:
          path: data.CHANGE_MEASUREMENT_EPSILON_RATIO
          value: "0.02"

  - it: should reflect custom change measurement settings
    set:
      config.recommendations.changeMeasurement.enabled: false
      config.recommendations.changeMeasurement.postWindowDays: 14
      config.recommendations.changeMeasurement.warmupHours: 0
      config.recommendations.changeMeasurement.epsilonRatio: 0
    asserts:
      - equal:
          path: data.CHANGE_MEASUREMENT_ENABLED
          value: "false"
      - equal:
          path: data.CHANGE_MEASUREMENT_POST_WINDOW_DAYS
          value: "14"
      - equal:
          path: data.CHANGE_MEASUREMENT_WARMUP_HOURS
          value: "0"
      - equal:
          path: data.CHANGE_MEASUREMENT_EPSILON_RATIO
          value: "0"

  - it: should not render legacy single-provider git settings
    asserts:
      - isNull:
          path: data.GIT_PROVIDER
      - isNull:
          path: data.GIT_TOKEN

  - it: should default to repository-agnostic pull-request options
    asserts:
      - equal:
          path: data.GITOPS_PULL_REQUESTS_JSON
          value: '{"draft":false,"labels":[],"reviewers":[],"teamReviewers":[]}'

  - it: should pass configured pull-request options to the runtime
    set:
      automation.pullRequests.draft: true
      automation.pullRequests.labels:
        - review-required
      automation.pullRequests.reviewers:
        - octocat
      automation.pullRequests.teamReviewers:
        - platform
    asserts:
      - equal:
          path: data.GITOPS_PULL_REQUESTS_JSON
          value: '{"draft":true,"labels":["review-required"],"reviewers":["octocat"],"teamReviewers":["platform"]}'

  # --------------------------------------------------------------------------
  # Default zone (conditional key)
  # --------------------------------------------------------------------------
  - it: should NOT include DEFAULT_ZONE when empty
    asserts:
      - isNull:
          path: data.DEFAULT_ZONE

  - it: should set DEFAULT_ZONE when provided
    set:
      config.defaultZone: "FR"
    asserts:
      - equal:
          path: data.DEFAULT_ZONE
          value: "FR"

  - it: exposes GitOps discovery cadence and binding TTL defaults
    asserts:
      - equal:
          path: data.GITOPS_DISCOVERY_INTERVAL
          value: "5m"
      - equal:
          path: data.GITOPS_BINDING_TTL
          value: "30m"

  - it: falls back to documented GitOps durations when reused values are empty
    set:
      automation.discoveryInterval: ""
      automation.bindingTtl: ""
    asserts:
      - equal:
          path: data.GITOPS_DISCOVERY_INTERVAL
          value: "5m"
      - equal:
          path: data.GITOPS_BINDING_TTL
          value: "30m"

  - it: reflects configured GitOps durations and scan row bound
    set:
      automation.discoveryInterval: 45s
      automation.bindingTtl: 2h
      config.recommendations.maxMetricRows: 1234
    asserts:
      - equal:
          path: data.GITOPS_DISCOVERY_INTERVAL
          value: "45s"
      - equal:
          path: data.GITOPS_BINDING_TTL
          value: "2h"
      - equal:
          path: data.RECOMMENDATION_MAX_METRIC_ROWS
          value: "1234"

  # --------------------------------------------------------------------------
  # Impact Model
  # --------------------------------------------------------------------------
  - it: should use OpenCost default rates unless impact pricing is set
    asserts:
      - notExists:
          path: data.IMPACT_PRICING_CPU_CORE_HOUR
      - notExists:
          path: data.IMPACT_PRICING_RAM_GIB_HOUR
      - equal:
          path: data.IMPACT_PRICING_CURRENCY
          value: USD
      - notExists:
          path: data.IMPACT_REALIZATION_FACTOR
      - equal:
          path: data.CARBON_PRICE_PER_TONNE
          value: "100"
      - equal:
          path: data.POWER_MEMORY_W_PER_GIB
          value: "0.392"

  - it: should render custom impact rates and carbon price
    set:
      impact.pricing.cpuCoreHour: 0.05
      impact.pricing.ramGiBHour: 0.006
      impact.pricing.currency: EUR
      impact.realizationFactor: 0.6
      impact.carbonPricePerTonne: 85
      impact.memoryWattsPerGiB: 0.5
    asserts:
      - equal:
          path: data.POWER_MEMORY_W_PER_GIB
          value: "0.5"
      - equal:
          path: data.IMPACT_PRICING_CPU_CORE_HOUR
          value: "0.05"
      - equal:
          path: data.IMPACT_PRICING_RAM_GIB_HOUR
          value: "0.006"
      - equal:
          path: data.IMPACT_PRICING_CURRENCY
          value: EUR
      - equal:
          path: data.IMPACT_REALIZATION_FACTOR
          value: "0.6"
      - equal:
          path: data.CARBON_PRICE_PER_TONNE
          value: "85"

  - it: should omit unset impact settings so the application defaults apply
    set:
      impact.realizationFactor: null
      impact.carbonPricePerTonne: null
    asserts:
      - notExists:
          path: data.IMPACT_REALIZATION_FACTOR
      - notExists:
          path: data.CARBON_PRICE_PER_TONNE

  - it: should keep a zero realization factor and carbon price
    set:
      impact.realizationFactor: 0
      impact.carbonPricePerTonne: 0
    asserts:
      - equal:
          path: data.IMPACT_REALIZATION_FACTOR
          value: "0"
      - equal:
          path: data.CARBON_PRICE_PER_TONNE
          value: "0"

  - it: should render the expected-value ranking costs
    asserts:
      - equal:
          path: data.RECOMMENDATION_INCIDENT_COST
          value: "100"
      - equal:
          path: data.RECOMMENDATION_ENGINEER_HOUR_COST
          value: "0"

  - it: should render custom expected-value ranking costs, zero included
    set:
      config.recommendations.incidentCost: 0
      config.recommendations.engineerHourCost: 85.5
    asserts:
      - equal:
          path: data.RECOMMENDATION_INCIDENT_COST
          value: "0"
      - equal:
          path: data.RECOMMENDATION_ENGINEER_HOUR_COST
          value: "85.5"

  # --------------------------------------------------------------------------
  # Pull-request experience (roadmap J1-J5)
  # --------------------------------------------------------------------------
  - it: enables the pull-request experience by default without deep links
    asserts:
      - equal:
          path: data.GITOPS_PR_TITLE_PREFIX
          value: "greenkube"
      - equal:
          path: data.GITOPS_PR_TEMPLATE
          value: ""
      - equal:
          path: data.GITOPS_PR_DEFAULT_LABELS
          value: "true"
      - equal:
          path: data.GITOPS_PR_DRAFT_HIGH_RISK
          value: "true"
      - equal:
          path: data.GITOPS_PR_CODEOWNERS
          value: "true"
      - equal:
          path: data.GITOPS_PR_COMMIT_STATUS
          value: "true"
      - equal:
          path: data.GITOPS_PR_LIFECYCLE_COMMENTS
          value: "true"
      - equal:
          path: data.GITOPS_PR_LIFECYCLE_LOOKBACK_DAYS
          value: "30"
      - equal:
          path: data.GREENKUBE_EXTERNAL_URL
          value: ""

  - it: passes the PR template, switches and external URL from values
    set:
      config.externalUrl: https://greenkube.example.com/
      automation.pr:
        titlePrefix: ""
        template: "{{ summary }}\n\n{{ diffs }}\n"
        defaultLabels: false
        draftHighRisk: false
        codeowners: false
        commitStatus: false
        lifecycleComments: false
        lifecycleLookbackDays: 7
    asserts:
      - equal:
          path: data.GREENKUBE_EXTERNAL_URL
          value: "https://greenkube.example.com"
      - equal:
          path: data.GITOPS_PR_TITLE_PREFIX
          value: ""
      - equal:
          path: data.GITOPS_PR_TEMPLATE
          value: "{{ summary }}\n\n{{ diffs }}\n"
      - equal:
          path: data.GITOPS_PR_DEFAULT_LABELS
          value: "false"
      - equal:
          path: data.GITOPS_PR_DRAFT_HIGH_RISK
          value: "false"
      - equal:
          path: data.GITOPS_PR_CODEOWNERS
          value: "false"
      - equal:
          path: data.GITOPS_PR_COMMIT_STATUS
          value: "false"
      - equal:
          path: data.GITOPS_PR_LIFECYCLE_COMMENTS
          value: "false"
      - equal:
          path: data.GITOPS_PR_LIFECYCLE_LOOKBACK_DAYS
          value: "7"
