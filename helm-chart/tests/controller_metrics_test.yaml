suite: controller metrics endpoint
templates:
  - templates/configmap.yaml
  - templates/deployment.yaml
  - templates/production-deployments.yaml
  - templates/controller-metrics-service.yaml
  - templates/controller-servicemonitor.yaml
  - templates/networkpolicy.yaml

tests:
  - it: configures the controller metrics port and intensity staleness limit
    templates:
      - templates/configmap.yaml
    asserts:
      - equal:
          path: data.CONTROLLER_METRICS_PORT
          value: "9102"
      - equal:
          path: data.INTENSITY_MAX_AGE
          value: 6h

  - it: exposes the controller metrics port on the standalone collector container
    templates:
      - templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: controller-metrics
            containerPort: 9102
            protocol: TCP

  - it: keeps the API key out of the controller (least privilege)
    templates:
      - templates/deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.volumes[0].projected.sources[0].secret.items
          content:
            key: GREENKUBE_API_KEY
            path: GREENKUBE_API_KEY

  - it: exposes the controller metrics port in the production controller deployment
    set:
      profile: production
    templates:
      - templates/production-deployments.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-greenkube-controller
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: controller-metrics
            containerPort: 9102
            protocol: TCP

  - it: renders a controller metrics service selecting the standalone pod
    templates:
      - templates/controller-metrics-service.yaml
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.ports[0].port
          value: 9102
      - equal:
          path: spec.ports[0].targetPort
          value: controller-metrics
      - equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: app
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: controller-metrics

  - it: selects the production controller pod
    set:
      profile: production
    templates:
      - templates/controller-metrics-service.yaml
    asserts:
      - equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: controller

  - it: renders a controller ServiceMonitor when monitoring is enabled
    set:
      monitoring.serviceMonitor.enabled: true
      monitoring.serviceMonitor.namespace: observability
    templates:
      - templates/controller-servicemonitor.yaml
    asserts:
      - isKind:
          of: ServiceMonitor
      - equal:
          path: metadata.namespace
          value: observability
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: controller-metrics
      - equal:
          path: spec.endpoints[0].port
          value: controller-metrics
      - equal:
          path: spec.endpoints[0].path
          value: /prometheus/metrics
      - notExists:
          path: spec.endpoints[0].authorization

  - it: does not render a controller ServiceMonitor by default
    templates:
      - templates/controller-servicemonitor.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: disables the listener, service and ServiceMonitor with port 0
    set:
      collector.metricsPort: 0
      monitoring.serviceMonitor.enabled: true
    templates:
      - templates/configmap.yaml
      - templates/deployment.yaml
      - templates/controller-metrics-service.yaml
      - templates/controller-servicemonitor.yaml
    asserts:
      - template: templates/configmap.yaml
        equal:
          path: data.CONTROLLER_METRICS_PORT
          value: "0"
      - template: templates/deployment.yaml
        notExists:
          path: spec.template.spec.containers[0].ports
      - template: templates/controller-metrics-service.yaml
        hasDocuments:
          count: 0
      - template: templates/controller-servicemonitor.yaml
        hasDocuments:
          count: 0

  - it: rejects an invalid controller metrics port
    set:
      collector.metricsPort: 70000
    templates:
      - templates/deployment.yaml
    asserts:
      - failedTemplate:
          errorMessage: collector.metricsPort must be an integer between 0 (disabled) and 65535

  - it: allows Prometheus to reach the controller metrics port through the network policy
    set:
      monitoring.networkPolicy.enabled: true
    templates:
      - templates/networkpolicy.yaml
    asserts:
      - contains:
          path: spec.ingress
          content:
            from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: monitoring
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: prometheus
            ports:
              - protocol: TCP
                port: 9102

  - it: uses a custom controller metrics port everywhere
    set:
      profile: production
      collector.metricsPort: 9200
      monitoring.networkPolicy.enabled: true
    templates:
      - templates/configmap.yaml
      - templates/production-deployments.yaml
      - templates/controller-metrics-service.yaml
      - templates/networkpolicy.yaml
    asserts:
      - template: templates/configmap.yaml
        equal:
          path: data.CONTROLLER_METRICS_PORT
          value: "9200"
      - template: templates/production-deployments.yaml
        documentIndex: 1
        equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 9200
      - template: templates/controller-metrics-service.yaml
        equal:
          path: spec.ports[0].port
          value: 9200
      - template: templates/networkpolicy.yaml
        documentIndex: 1
        equal:
          path: spec.ingress[0].ports[0].port
          value: 9200

  - it: keeps the controller metrics Service when the API is disabled
    set:
      config.api.enabled: false
    templates:
      - templates/controller-metrics-service.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.type
          value: ClusterIP

  - it: scrapes the controller even when the API is disabled
    set:
      monitoring.serviceMonitor.enabled: true
      config.api.enabled: false
    templates:
      - templates/controller-servicemonitor.yaml
    asserts:
      - isKind:
          of: ServiceMonitor

  - it: lets Prometheus reach the standalone controller listener from a custom namespace
    set:
      monitoring.networkPolicy.enabled: true
      monitoring.networkPolicy.prometheusNamespace: observability
    templates:
      - templates/networkpolicy.yaml
    asserts:
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/component"]
          value: app
      - contains:
          path: spec.ingress
          content:
            from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: observability
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: prometheus
            ports:
              - protocol: TCP
                port: 9102

  - it: lets Prometheus reach only the controller metrics port on production controllers
    set:
      profile: production
      monitoring.networkPolicy.enabled: true
    templates:
      - templates/networkpolicy.yaml
    asserts:
      - documentIndex: 1
        equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/component"]
          value: controller
      - documentIndex: 1
        equal:
          path: spec.ingress
          value:
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: monitoring
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/name: prometheus
              ports:
                - protocol: TCP
                  port: 9102

  - it: rejects a controller metrics port that collides with the API in the standalone pod
    set:
      collector.metricsPort: 8000
    templates:
      - templates/deployment.yaml
    asserts:
      - failedTemplate:
          errorMessage: collector.metricsPort must differ from config.api.port

  - it: allows the API port for the controller metrics in the production profile
    set:
      profile: production
      collector.metricsPort: 8000
    templates:
      - templates/production-deployments.yaml
    asserts:
      - documentIndex: 1
        equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8000
