suite: credentials bootstrap hook
templates:
  - templates/credentials-bootstrap.yaml

tests:
  - it: renders hook RBAC before the Job
    asserts:
      - hasDocuments:
          count: 4
      - documentIndex: 0
        isKind:
          of: ServiceAccount
      - documentIndex: 1
        isKind:
          of: Role
      - documentIndex: 2
        isKind:
          of: RoleBinding
      - documentIndex: 3
        isKind:
          of: Job
      - documentIndex: 0
        equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-50"
      - documentIndex: 3
        equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-40"

  - it: runs before every install, upgrade and Argo CD sync and cleans up after success
    documentIndex: 3
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation,hook-succeeded
      - equal:
          path: metadata.name
          value: RELEASE-NAME-greenkube-credentials-bootstrap

  - it: limits Secret access to the generated-credentials Secret
    documentIndex: 1
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: ["secrets"]
              verbs: ["create"]
            - apiGroups: [""]
              resources: ["secrets"]
              resourceNames: ["RELEASE-NAME-greenkube"]
              verbs: ["get", "patch"]
            - apiGroups: [""]
              resources: ["secrets"]
              resourceNames: ["RELEASE-NAME-greenkube-initial-admin"]
              verbs: ["get"]
            - apiGroups: [""]
              resources: ["persistentvolumeclaims"]
              resourceNames: ["data-RELEASE-NAME-greenkube-postgres-0"]
              verbs: ["get"]

  - it: generates the API key and the bundled PostgreSQL password by default
    documentIndex: 3
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GREENKUBE_SECRET_NAME
            value: RELEASE-NAME-greenkube
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GREENKUBE_GENERATE_API_KEY
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GREENKUBE_GENERATE_POSTGRES_PASSWORD
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GREENKUBE_POSTGRES_HOST
            value: RELEASE-NAME-greenkube-postgres
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GREENKUBE_POSTGRES_PVC
            value: data-RELEASE-NAME-greenkube-postgres-0

  - it: runs the bootstrap script with the application image under the hook security context
    documentIndex: 3
    set:
      image.digest: sha256:31f209d1a74950e54e9f7ddfe6c8d8e366efca4184eee40689ffaf18e856eceb
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: greenkube/greenkube@sha256:31f209d1a74950e54e9f7ddfe6c8d8e366efca4184eee40689ffaf18e856eceb
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["python", "-I", "-B", "-c"]
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: def ensure_credentials
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-greenkube-credentials-bootstrap
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true

  - it: skips generation of credentials supplied in values
    documentIndex: 3
    set:
      secrets.apiKey: supplied
      postgres.auth.password: supplied
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GREENKUBE_GENERATE_API_KEY
            value: "false"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GREENKUBE_GENERATE_POSTGRES_PASSWORD
            value: "false"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GREENKUBE_POSTGRES_PVC
            value: data-RELEASE-NAME-greenkube-postgres-0

  - it: does not guard a volume when PostgreSQL persistence is disabled
    set:
      postgres.persistence.enabled: false
    asserts:
      - documentIndex: 3
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GREENKUBE_POSTGRES_PVC
            value: ""
      - documentIndex: 1
        lengthEqual:
          path: rules
          count: 3

  - it: generates only the API key for SQLite and external databases
    documentIndex: 3
    set:
      postgres.enabled: false
      secrets.dbConnectionString: postgresql://u:p@db:5432/greenkube
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GREENKUBE_GENERATE_POSTGRES_PASSWORD
            value: "false"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GREENKUBE_POSTGRES_HOST
            value: RELEASE-NAME-greenkube-postgres

  - it: only creates the initial-admin Secret with secrets.existingSecret
    set:
      secrets.existingSecret: gitops-credentials
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: ["secrets"]
              verbs: ["create"]
            - apiGroups: [""]
              resources: ["secrets"]
              resourceNames: ["RELEASE-NAME-greenkube-initial-admin"]
              verbs: ["get"]
        documentIndex: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GREENKUBE_SECRET_NAME
            value: ""
        documentIndex: 3
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GREENKUBE_INITIAL_ADMIN_SECRET
            value: RELEASE-NAME-greenkube-initial-admin
        documentIndex: 3

  - it: is not rendered with secrets.existingSecret and auth.admin.existingSecret
    set:
      secrets.existingSecret: gitops-credentials
      auth.admin.existingSecret: gitops-admin
    asserts:
      - hasDocuments:
          count: 0

  - it: creates the initial-admin Secret by default
    documentIndex: 3
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GREENKUBE_INITIAL_ADMIN_SECRET
            value: RELEASE-NAME-greenkube-initial-admin
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GREENKUBE_INITIAL_ADMIN_USERNAME
            value: admin

  - it: is not rendered without RBAC when every credential is supplied
    set:
      rbac.create: false
      secrets.apiKey: supplied
      postgres.auth.password: supplied
    asserts:
      - hasDocuments:
          count: 0

  - it: fails with guidance when generation is needed but RBAC is disabled
    set:
      rbac.create: false
    asserts:
      - failedTemplate:
          errorPattern: "rbac.create=false: .*secrets.existingSecret"

  - it: keeps resource names within the Kubernetes label limit
    documentIndex: 3
    set:
      fullnameOverride: a-very-long-release-name-that-is-close-to-the-limit-of-sixty-three
    asserts:
      - equal:
          path: metadata.name
          value: a-very-long-release-name-that-is-close-to-credentials-bootstrap
