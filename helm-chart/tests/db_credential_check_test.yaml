suite: database credential check
templates:
  - templates/db-credential-check.yaml

tests:
  - it: renders a pre-upgrade credential check when the bundled database is enabled
    asserts:
      - isKind:
          of: Job
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-5"

  - it: uses the configured PostgreSQL image
    set:
      postgres.image.repository: registry.example.com/postgres
      postgres.image.tag: "18.1"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "registry.example.com/postgres:18.1"

  - it: reads DB_CONNECTION_STRING from the chart-managed Secret
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: DB_CONNECTION_STRING
      - equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.name
          value: RELEASE-NAME-greenkube
      - equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.key
          value: DB_CONNECTION_STRING

  - it: does not render when the bundled database is disabled
    set:
      postgres.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: does not render when the app uses sqlite
    set:
      config.db.type: sqlite
    asserts:
      - hasDocuments:
          count: 0

  - it: tolerates credentials that do not exist yet (first Argo CD sync)
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.optional
          value: true
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'if \[ -z "\$\{DB_CONNECTION_STRING:-\}" \]; then'

  - it: skips the check while PostgreSQL is unreachable instead of failing the sync
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: pg_isready -d "\$DB_CONNECTION_STRING"
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: '\*"authentication failed"\*\) break'

  # The values Secret is a regular release resource: Helm and Argo CD apply it
  # only after the pre-upgrade/PreSync hooks, so during the check it still holds
  # the previous revision's password. A hook Secret carries the new one.
  - it: validates a values-supplied password through a pre-upgrade hook Secret
    set:
      postgres.auth.password: new-password
    asserts:
      - hasDocuments:
          count: 2
      - documentIndex: 0
        isKind:
          of: Secret
      - documentIndex: 0
        equal:
          path: metadata.name
          value: RELEASE-NAME-greenkube-db-credential-check
      - documentIndex: 0
        equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-upgrade
      - documentIndex: 0
        equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-6"
      - documentIndex: 0
        equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation,hook-succeeded,hook-failed
      - documentIndex: 0
        equal:
          path: data.DB_CONNECTION_STRING
          value: postgresql://greenkube:new-password@RELEASE-NAME-greenkube-postgres:5432/greenkube
          decodeBase64: true
      - documentIndex: 1
        isKind:
          of: Job
      - documentIndex: 1
        equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.name
          value: RELEASE-NAME-greenkube-db-credential-check

  - it: reads DB_CONNECTION_STRING from secrets.existingSecret without a hook Secret
    set:
      secrets.existingSecret: greenkube-credentials
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Job
      - equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.name
          value: greenkube-credentials
