suite: database credential check
templates:
  - templates/db-credential-check.yaml

tests:
  - it: renders a pre-upgrade credential check when the bundled database is enabled
    asserts:
      - isKind:
          of: Job
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-5"

  - it: uses the configured PostgreSQL image
    set:
      postgres.image.repository: registry.example.com/postgres
      postgres.image.tag: "18.1"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "registry.example.com/postgres:18.1"

  - it: reads DB_CONNECTION_STRING from the chart-managed Secret
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: DB_CONNECTION_STRING
      - equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.name
          value: RELEASE-NAME-greenkube
      - equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.key
          value: DB_CONNECTION_STRING

  - it: does not render when the bundled database is disabled
    set:
      postgres.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: does not render when the app uses sqlite
    set:
      config.db.type: sqlite
    asserts:
      - hasDocuments:
          count: 0
