suite: default Git credentials Secret RBAC
templates:
  - templates/git-credentials-role.yaml
release:
  name: gk
  namespace: greenkube

tests:
  - it: grants only get and watch on the one default credentials Secret
    asserts:
      - hasDocuments:
          count: 2
      - documentIndex: 0
        isKind:
          of: Role
      - documentIndex: 0
        equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: ["secrets"]
              resourceNames: ["greenkube-git-credentials"]
              verbs: ["get", "watch"]

  - it: follows automation.credentialsSecret
    set:
      automation.credentialsSecret: team-git
    asserts:
      - documentIndex: 0
        equal:
          path: rules[0].resourceNames
          value: ["team-git"]

  - it: binds the API and controller service accounts (and workers when enabled)
    asserts:
      - documentIndex: 1
        isKind:
          of: RoleBinding
      - documentIndex: 1
        equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: gk-greenkube-api
              namespace: greenkube
            - kind: ServiceAccount
              name: gk-greenkube-controller
              namespace: greenkube

  - it: adds the worker service account when workers run
    set:
      worker.replicas: 2
    asserts:
      - documentIndex: 1
        equal:
          path: subjects[2].name
          value: gk-greenkube-worker

  - it: renders nothing without rbac.create
    set:
      rbac.create: false
    asserts:
      - hasDocuments:
          count: 0
