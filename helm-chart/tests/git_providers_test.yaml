suite: Git provider configuration
templates:
- templates/configmap.yaml
- templates/components.yaml
- templates/automation-worker.yaml
- templates/production-deployments.yaml
tests:
- it: serializes provider metadata and Secret references without credential data
  set:
    automation.providers:
    - id: github-primary
      type: github
      apiBaseUrl: https://github.example.com/api/v3
      secretName: git-auth
      secretKey: pat
      repositoryAllowlist:
      - acme/*
      - special/repo
    secrets.gitToken: never-serialize-this-token
  templates:
  - templates/configmap.yaml
  asserts:
  - equal:
      path: data.GITOPS_PROVIDERS_JSON
      value: '{"providers":[{"apiBaseUrl":"https://github.example.com/api/v3","id":"github-primary","repositories":["acme/*","special/repo"],"tokenSecret":{"key":"pat","name":"git-auth"},"type":"github"}]}'
  - notMatchRegex:
      path: data.GITOPS_PROVIDERS_JSON
      pattern: never-serialize-this-token
  - notMatchRegex:
      path: data.GITOPS_PROVIDERS_JSON
      pattern: tokenFile
  - equal:
      path: data.GITOPS_SECRET_MOUNT
      value: /etc/greenkube/git-providers
- it: rejects the removed nested tokenSecret alias with a migration hint
  set:
    automation.providers:
    - id: github-documented
      type: github
      tokenSecret:
        name: git-auth
        key: pat
      repositoryAllowlist:
      - acme/platform
  templates:
  - templates/configmap.yaml
  asserts:
  - failedTemplate:
      errorMessage: automation.providers[0].tokenSecret was removed; use secretName, secretKey and secretNamespace
- it: rejects the removed repositories alias with a migration hint
  set:
    automation.providers:
    - id: github-documented
      type: github
      secretName: git-auth
      secretKey: pat
      repositories:
      - acme/platform
  templates:
  - templates/configmap.yaml
  asserts:
  - failedTemplate:
      errorMessage: automation.providers[0].repositories was removed; use repositoryAllowlist
- it: serializes a browser-facing Gitea URL separately from its API URL
  set:
    automation.providers:
    - id: gitea-main
      type: gitea
      apiBaseUrl: http://gitea.git.svc.cluster.local:3000/api/v1
      webBaseUrl: https://gitea.example.com
      secretName: gitea-token
      secretKey: token
      repositoryAllowlist:
      - acme/platform
  templates:
  - templates/configmap.yaml
  asserts:
  - equal:
      path: data.GITOPS_PROVIDERS_JSON
      value: '{"providers":[{"apiBaseUrl":"http://gitea.git.svc.cluster.local:3000/api/v1","id":"gitea-main","repositories":["acme/platform"],"tokenSecret":{"key":"token","name":"gitea-token"},"type":"gitea","webBaseUrl":"https://gitea.example.com"}]}'
- it: renders an explicit empty provider registry by default
  templates:
  - templates/configmap.yaml
  asserts:
  - equal:
      path: data.GITOPS_PROVIDERS_JSON
      value: '{"providers":[]}'
  - equal:
      path: data.GITOPS_SECRET_MOUNT
      value: /etc/greenkube/git-providers
  - equal:
      path: data.GITOPS_PR_POLL_INTERVAL
      value: '120'
  - equal:
      path: data.GITOPS_SYNC_POLL_INTERVAL
      value: '30'
  - equal:
      path: data.GITOPS_SYNC_TIMEOUT
      value: '1800'
- it: configures the bounded provider pull-request polling interval
  set:
    automation.prPollIntervalSeconds: 300
  templates:
  - templates/configmap.yaml
  asserts:
  - equal:
      path: data.GITOPS_PR_POLL_INTERVAL
      value: '300'
- it: configures sync observation polling and timeout
  set:
    automation.syncPollIntervalSeconds: 60
    automation.syncTimeoutSeconds: 3600
  templates:
  - templates/configmap.yaml
  asserts:
  - equal:
      path: data.GITOPS_SYNC_POLL_INTERVAL
      value: '60'
  - equal:
      path: data.GITOPS_SYNC_TIMEOUT
      value: '3600'
- it: mounts only selected provider keys and deduplicates shared Secrets
  set:
    automation.providers:
    - id: github-primary
      type: github
      secretName: shared-git-auth
      secretKey: github-token
      repositoryAllowlist:
      - acme/*
    - id: gitea-mirror
      type: gitea
      secretName: shared-git-auth
      secretKey: gitea-token
      repositoryAllowlist:
      - mirror/*
    - id: github-secondary
      type: github
      secretName: shared-git-auth
      secretKey: github-token
      repositoryAllowlist:
      - acme/other
    - id: gitlab-primary
      type: gitlab
      secretName: gitlab-auth
      secretKey: token
      repositoryAllowlist:
      - platform/*
  templates:
  - templates/components.yaml
  asserts:
  - documentIndex: 0
    contains:
      path: spec.template.spec.volumes[1].projected.sources
      content:
        secret:
          name: gitlab-auth
          items:
          - key: token
            path: gitlab-auth/token
  - documentIndex: 0
    contains:
      path: spec.template.spec.volumes[1].projected.sources
      content:
        secret:
          name: shared-git-auth
          items:
          - key: github-token
            path: shared-git-auth/github-token
          - key: gitea-token
            path: shared-git-auth/gitea-token
  - documentIndex: 1
    contains:
      path: spec.template.spec.containers[0].volumeMounts
      content:
        name: git-provider-secrets
        mountPath: /etc/greenkube/git-providers
        readOnly: true
  - documentIndex: 0
    contains:
      path: spec.template.spec.containers[0].volumeMounts
      content:
        name: git-provider-secrets
        mountPath: /etc/greenkube/git-providers
        readOnly: true
- it: rejects duplicate provider IDs
  set:
    automation.providers:
    - id: github-primary
      type: github
      secretName: git-auth
      secretKey: token
      repositoryAllowlist:
      - acme/*
    - id: github-primary
      type: github
      secretName: other-git-auth
      secretKey: token
      repositoryAllowlist:
      - other/*
  templates:
  - templates/configmap.yaml
  asserts:
  - failedTemplate:
      errorMessage: automation.providers IDs must be unique
- it: rejects invalid Secret names
  set:
    automation.providers:
    - id: github-primary
      type: github
      secretName: not/a/secret
      secretKey: token
      repositoryAllowlist:
      - acme/*
  templates:
  - templates/configmap.yaml
  asserts:
  - failedTemplate:
      errorMessage: automation.providers[0].secretName must be a valid Kubernetes Secret name
- it: rejects invalid Secret keys
  set:
    automation.providers:
    - id: github-primary
      type: github
      secretName: git-auth
      secretKey: not a key
      repositoryAllowlist:
      - acme/*
  templates:
  - templates/configmap.yaml
  asserts:
  - failedTemplate:
      errorMessage: automation.providers[0].secretKey must be a valid Kubernetes Secret key
- it: rejects dot-path Secret keys
  set:
    automation.providers:
    - id: github-primary
      type: github
      secretName: git-auth
      secretKey: ..
      repositoryAllowlist:
      - acme/*
  templates:
  - templates/configmap.yaml
  asserts:
  - failedTemplate:
      errorMessage: automation.providers[0].secretKey must be a valid Kubernetes Secret key
- it: rejects cross-namespace Secret mounts
  set:
    automation.providers:
    - id: github-primary
      type: github
      secretNamespace: other-namespace
      secretName: git-auth
      secretKey: token
      repositoryAllowlist:
      - acme/*
  templates:
  - templates/configmap.yaml
  asserts:
  - failedTemplate:
      errorMessage: automation.providers[0].secretNamespace must match the Helm release namespace
- it: includes an explicitly configured namespace in runtime references
  release:
    namespace: greenkube
  set:
    automation.providers:
    - id: github-primary
      type: github
      secretNamespace: greenkube
      secretName: git-auth
      secretKey: token
      repositoryAllowlist:
      - acme/*
  templates:
  - templates/configmap.yaml
  asserts:
  - matchRegex:
      path: data.GITOPS_PROVIDERS_JSON
      pattern: '"namespace":"greenkube"'
- it: includes an explicitly configured namespace in provider mount paths
  release:
    namespace: greenkube
  set:
    automation.providers:
    - id: github-primary
      type: github
      secretNamespace: greenkube
      secretName: git-auth
      secretKey: token
      repositoryAllowlist:
      - acme/*
  templates:
  - templates/components.yaml
  asserts:
  - documentIndex: 0
    contains:
      path: spec.template.spec.volumes[1].projected.sources
      content:
        secret:
          name: git-auth
          items:
          - key: token
            path: greenkube/git-auth/token
- it: mounts provider keys into the api, controller and worker
  set:
    worker.replicas: 1
    automation.providers:
    - id: github-primary
      type: github
      secretName: git-auth
      secretKey: token
      repositoryAllowlist:
      - acme/*
  templates:
  - templates/components.yaml
  asserts:
  - contains:
      path: spec.template.spec.volumes[1].projected.sources
      content:
        secret:
          name: git-auth
          items:
          - key: token
            path: git-auth/token
  - contains:
      path: spec.template.spec.containers[0].volumeMounts
      content:
        name: git-provider-secrets
        mountPath: /etc/greenkube/git-providers
        readOnly: true
- it: lets a provider without its own allowlist use automation.repositoryAllowlist
  set:
    automation.repositoryAllowlist:
    - acme/*
    automation.providers:
    - id: github-primary
      type: github
      secretName: git-auth
      secretKey: token
  templates:
  - templates/configmap.yaml
  asserts:
  - matchRegex:
      path: data.GITOPS_PROVIDERS_JSON
      pattern: '"repositories":\["acme/\*"\]'
