suite: helpers and naming
templates:
  - templates/configmap.yaml
  - templates/serviceaccount.yaml
  - templates/legacy-sqlite-pvc.yaml

tests:
  # --------------------------------------------------------------------------
  # Default name (release name + chart name)
  # --------------------------------------------------------------------------
  - it: should generate fullname as release-chart when release name differs from chart
    templates:
      - templates/configmap.yaml
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-greenkube-config

  - it: should use release name alone when it already contains the chart name
    release:
      name: greenkube
    templates:
      - templates/configmap.yaml
    asserts:
      - equal:
          path: metadata.name
          value: greenkube-config

  # --------------------------------------------------------------------------
  # nameOverride
  # --------------------------------------------------------------------------
  - it: should respect nameOverride
    set:
      nameOverride: myapp
    templates:
      - templates/configmap.yaml
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-myapp-config

  # --------------------------------------------------------------------------
  # fullnameOverride
  # --------------------------------------------------------------------------
  - it: should respect fullnameOverride
    set:
      fullnameOverride: custom-fullname
    templates:
      - templates/configmap.yaml
    asserts:
      - equal:
          path: metadata.name
          value: custom-fullname-config

  - it: should truncate fullnameOverride to 63 chars
    set:
      fullnameOverride: "this-is-a-very-long-name-that-exceeds-sixty-three-characters-limit"
    templates:
      - templates/configmap.yaml
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: "^.{1,63}$"

  # --------------------------------------------------------------------------
  # Common labels
  # --------------------------------------------------------------------------
  - it: should include helm.sh/chart label on all resources
    templates:
      - templates/configmap.yaml
    asserts:
      - matchRegex:
          path: metadata.labels["helm.sh/chart"]
          pattern: "^greenkube-"

  - it: should include app.kubernetes.io/version label from Chart.AppVersion
    templates:
      - templates/configmap.yaml
    asserts:
      - isNotEmpty:
          path: metadata.labels["app.kubernetes.io/version"]

  - it: should include app.kubernetes.io/managed-by label
    templates:
      - templates/configmap.yaml
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm

  # --------------------------------------------------------------------------
  # Former SQLite claim (F17): kept, never deleted, until db copy moved the data
  # --------------------------------------------------------------------------
  - it: renders no claim on a new install
    templates:
      - templates/legacy-sqlite-pvc.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: keeps the former SQLite claim after switching to PostgreSQL
    set:
      config.db.type: postgres
      config.persistence.enabled: true
    templates:
      - templates/legacy-sqlite-pvc.yaml
    asserts:
      - isKind:
          of: PersistentVolumeClaim
      - equal:
          path: metadata.name
          value: RELEASE-NAME-greenkube
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      - equal:
          path: spec.resources.requests.storage
          value: 10Gi

  - it: renders no claim when the former persistence was disabled
    set:
      config.db.type: postgres
      config.persistence.enabled: false
    templates:
      - templates/legacy-sqlite-pvc.yaml
    asserts:
      - hasDocuments:
          count: 0
