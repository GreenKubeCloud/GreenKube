suite: monitoring
templates:
  - templates/servicemonitor.yaml
  - templates/networkpolicy.yaml
  - templates/prometheusrule.yaml

tests:
  # --------------------------------------------------------------------------
  # ServiceMonitor — disabled by default
  # --------------------------------------------------------------------------
  - it: should not render ServiceMonitor when disabled
    templates:
      - templates/servicemonitor.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render automation alert rules by default
    templates:
      - templates/prometheusrule.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should render bounded automation backlog alerts when enabled
    set:
      monitoring.prometheusRule.enabled: true
      monitoring.prometheusRule.namespace: observability
      monitoring.prometheusRule.additionalLabels:
        release: kube-prometheus-stack
    templates:
      - templates/prometheusrule.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PrometheusRule
      - equal:
          path: metadata.namespace
          value: observability
      - equal:
          path: metadata.labels.release
          value: kube-prometheus-stack
      - lengthEqual:
          path: spec.groups[0].rules
          count: 6
      - matchRegex:
          path: spec.groups[0].rules[0].expr
          pattern: 'queue="operations",state="stuck"'

  - it: should render ServiceMonitor when enabled
    set:
      monitoring.serviceMonitor.enabled: true
    templates:
      - templates/servicemonitor.yaml
    asserts:
      - isKind:
          of: ServiceMonitor

  - it: ServiceMonitor should use the configured namespace
    set:
      monitoring.serviceMonitor.enabled: true
      monitoring.serviceMonitor.namespace: observability
    templates:
      - templates/servicemonitor.yaml
    asserts:
      - equal:
          path: metadata.namespace
          value: observability

  - it: ServiceMonitor should scrape /prometheus/metrics
    set:
      monitoring.serviceMonitor.enabled: true
    templates:
      - templates/servicemonitor.yaml
    asserts:
      - equal:
          path: spec.endpoints[0].path
          value: /prometheus/metrics

  - it: ServiceMonitor should use the configured scrape interval
    set:
      monitoring.serviceMonitor.enabled: true
      monitoring.serviceMonitor.interval: 1m
    templates:
      - templates/servicemonitor.yaml
    asserts:
      - equal:
          path: spec.endpoints[0].interval
          value: 1m

  - it: ServiceMonitor should include the label relabeling rules
    set:
      monitoring.serviceMonitor.enabled: true
    templates:
      - templates/servicemonitor.yaml
    asserts:
      - isNotEmpty:
          path: spec.endpoints[0].metricRelabelings

  - it: ServiceMonitor should authenticate with the generated API key by default
    set:
      monitoring.serviceMonitor.enabled: true
    templates:
      - templates/servicemonitor.yaml
    asserts:
      - isNotEmpty:
          path: spec.endpoints[0].authorization.credentials.name
      - equal:
          path: spec.endpoints[0].authorization.credentials.key
          value: GREENKUBE_API_KEY

  - it: ServiceMonitor should not render when API is disabled
    set:
      monitoring.serviceMonitor.enabled: true
      config.api.enabled: false
    templates:
      - templates/servicemonitor.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: ServiceMonitor should use the API key as bearer token when configured
    set:
      monitoring.serviceMonitor.enabled: true
      secrets.apiKey: test-key
    templates:
      - templates/servicemonitor.yaml
    asserts:
      - equal:
          path: spec.endpoints[0].authorization.type
          value: Bearer
      - equal:
          path: spec.endpoints[0].authorization.credentials.key
          value: GREENKUBE_API_KEY

  - it: ServiceMonitor should use existingSecret for bearer credentials
    set:
      monitoring.serviceMonitor.enabled: true
      secrets.existingSecret: shared-greennkube-secrets
    templates:
      - templates/servicemonitor.yaml
    asserts:
      - equal:
          path: spec.endpoints[0].authorization.type
          value: Bearer
      - equal:
          path: spec.endpoints[0].authorization.credentials.name
          value: shared-greennkube-secrets

  - it: ServiceMonitor should carry kube-prometheus labels
    set:
      monitoring.serviceMonitor.enabled: true
    templates:
      - templates/servicemonitor.yaml
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: kube-prometheus

  - it: ServiceMonitor should merge additionalLabels
    set:
      monitoring.serviceMonitor.enabled: true
      monitoring.serviceMonitor.additionalLabels:
        release: prometheus
    templates:
      - templates/servicemonitor.yaml
    asserts:
      - equal:
          path: metadata.labels.release
          value: prometheus

  # --------------------------------------------------------------------------
  # NetworkPolicy — disabled by default
  # --------------------------------------------------------------------------
  - it: should not render NetworkPolicy when disabled
    templates:
      - templates/networkpolicy.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should render NetworkPolicy when enabled
    set:
      monitoring.networkPolicy.enabled: true
    templates:
      - templates/networkpolicy.yaml
    asserts:
      - isKind:
          of: NetworkPolicy

  - it: NetworkPolicy should allow ingress from the configured prometheus namespace
    set:
      monitoring.networkPolicy.enabled: true
      monitoring.networkPolicy.prometheusNamespace: observability
    templates:
      - templates/networkpolicy.yaml
    asserts:
      - equal:
          path: spec.ingress[0].from[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: observability

  - it: NetworkPolicy should open the API port
    set:
      monitoring.networkPolicy.enabled: true
    templates:
      - templates/networkpolicy.yaml
    asserts:
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 8000

  - it: NetworkPolicy should append custom ingress rules
    set:
      monitoring.networkPolicy.enabled: true
      monitoring.networkPolicy.additionalIngress:
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: ingress-nginx
          ports:
            - protocol: TCP
              port: 8000
    templates:
      - templates/networkpolicy.yaml
    asserts:
      - equal:
          path: spec.ingress[2].from[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: ingress-nginx

  - it: NetworkPolicy should allow DNS and bundled PostgreSQL egress without broad internet access
    set:
      monitoring.networkPolicy.enabled: true
    templates:
      - templates/networkpolicy.yaml
    asserts:
      - equal:
          path: spec.policyTypes
          value:
            - Ingress
            - Egress
      - equal:
          path: spec.egress[0].to[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: kube-system
      - equal:
          path: spec.egress[0].ports[0].port
          value: 53
      - equal:
          path: spec.egress[1].to[0].podSelector.matchLabels["app.kubernetes.io/component"]
          value: postgres
      - notContains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 0.0.0.0/0

  - it: NetworkPolicy should append explicitly configured egress rules
    set:
      monitoring.networkPolicy.enabled: true
      monitoring.networkPolicy.additionalEgress:
        - to:
            - ipBlock:
                cidr: 203.0.113.0/24
          ports:
            - protocol: TCP
              port: 443
    templates:
      - templates/networkpolicy.yaml
    asserts:
      - equal:
          path: spec.egress[2].to[0].ipBlock.cidr
          value: 203.0.113.0/24
      - equal:
          path: spec.egress[2].ports[0].port
          value: 443

  - it: NetworkPolicy should cover production API, controller, and worker pods
    set:
      profile: production
      automation.enabled: true
      monitoring.networkPolicy.enabled: true
      automation.mode: worker
    templates:
      - templates/networkpolicy.yaml
    asserts:
      - hasDocuments:
          count: 3
      - documentIndex: 0
        equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/component"]
          value: api
      - documentIndex: 1
        equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/component"]
          value: controller
      - documentIndex: 2
        equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/component"]
          value: automation
      - documentIndex: 2
        equal:
          path: spec.ingress[0].ports[0].port
          value: 8001
      - documentIndex: 2
        equal:
          path: spec.egress[1].to[0].podSelector.matchLabels["app.kubernetes.io/component"]
          value: postgres

  - it: NetworkPolicy should include standalone worker pods without requiring an API
    set:
      monitoring.networkPolicy.enabled: true
      automation.enabled: true
      automation.mode: worker
      config.api.enabled: false
    templates:
      - templates/networkpolicy.yaml
    asserts:
      - hasDocuments:
          count: 2
      - documentIndex: 0
        equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/component"]
          value: app
      - documentIndex: 1
        equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/component"]
          value: automation-worker
      - documentIndex: 1
        equal:
          path: spec.ingress[0].ports[0].port
          value: 8001

  - it: NetworkPolicy should still protect the production controller when API is disabled
    set:
      monitoring.networkPolicy.enabled: true
      profile: production
      config.api.enabled: false
      automation.enabled: false
    templates:
      - templates/networkpolicy.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/component"]
          value: controller

  - it: NetworkPolicy names should remain unique with a long release name
    set:
      profile: production
      fullnameOverride: greenkube-component-networkpolicy-name-long-long-long-long-long
      monitoring.networkPolicy.enabled: true
      automation.enabled: true
      automation.mode: worker
    templates:
      - templates/networkpolicy.yaml
    asserts:
      - documentIndex: 0
        matchRegex:
          path: metadata.name
          pattern: "-api-netpol$"
      - documentIndex: 1
        matchRegex:
          path: metadata.name
          pattern: "-controller-netpol$"
      - documentIndex: 2
        matchRegex:
          path: metadata.name
          pattern: "-automation-netpol$"
