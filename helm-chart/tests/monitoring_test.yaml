suite: monitoring
templates:
  - templates/servicemonitor.yaml
  - templates/networkpolicy.yaml
  - templates/prometheusrule.yaml

tests:
  # --------------------------------------------------------------------------
  # ServiceMonitor — disabled by default
  # --------------------------------------------------------------------------
  - it: should not render ServiceMonitor when disabled
    templates:
      - templates/servicemonitor.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render automation alert rules by default
    templates:
      - templates/prometheusrule.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should render bounded automation backlog alerts when enabled
    set:
      monitoring.prometheusRule.enabled: true
      monitoring.prometheusRule.namespace: observability
      monitoring.prometheusRule.additionalLabels:
        release: kube-prometheus-stack
    templates:
      - templates/prometheusrule.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PrometheusRule
      - equal:
          path: metadata.namespace
          value: observability
      - equal:
          path: metadata.labels.release
          value: kube-prometheus-stack
      - lengthEqual:
          path: spec.groups[0].rules
          count: 6
      - matchRegex:
          path: spec.groups[0].rules[0].expr
          pattern: 'queue="operations",state="stuck"'
      - lengthEqual:
          path: spec.groups
          count: 1

  - it: should render the controller loop alerts when the controller is scraped
    set:
      monitoring.prometheusRule.enabled: true
      monitoring.serviceMonitor.enabled: true
    templates:
      - templates/prometheusrule.yaml
    asserts:
      - equal:
          path: spec.groups[1].name
          value: greenkube.controller
      - equal:
          path: spec.groups[1].rules[0].alert
          value: GreenKubeControllerLoopFailing
      - equal:
          path: spec.groups[1].rules[1].alert
          value: GreenKubeAutomationLoopStale
      - equal:
          path: spec.groups[1].rules[2].alert
          value: GreenKubeNoActiveController
      - matchRegex:
          path: spec.groups[1].rules[0].annotations.description
          pattern: '\{\{ \$labels.loop \}\}'

  - it: should leave the controller loop alerts out when disabled
    set:
      monitoring.prometheusRule.enabled: true
      monitoring.prometheusRule.controllerAlerts: false
      monitoring.serviceMonitor.enabled: true
    templates:
      - templates/prometheusrule.yaml
    asserts:
      - lengthEqual:
          path: spec.groups
          count: 1

  - it: should leave the controller loop alerts out when the controller metrics port is off
    set:
      monitoring.prometheusRule.enabled: true
      monitoring.serviceMonitor.enabled: true
      collector.metricsPort: 0
    templates:
      - templates/prometheusrule.yaml
    asserts:
      - lengthEqual:
          path: spec.groups
          count: 1

  - it: should render ServiceMonitor when enabled
    set:
      monitoring.serviceMonitor.enabled: true
    templates:
      - templates/servicemonitor.yaml
    asserts:
      - isKind:
          of: ServiceMonitor

  - it: ServiceMonitor should use the configured namespace
    set:
      monitoring.serviceMonitor.enabled: true
      monitoring.serviceMonitor.namespace: observability
    templates:
      - templates/servicemonitor.yaml
    asserts:
      - equal:
          path: metadata.namespace
          value: observability

  - it: ServiceMonitor should scrape /prometheus/metrics
    set:
      monitoring.serviceMonitor.enabled: true
    templates:
      - templates/servicemonitor.yaml
    asserts:
      - equal:
          path: spec.endpoints[0].path
          value: /prometheus/metrics

  - it: ServiceMonitor should use the configured scrape interval
    set:
      monitoring.serviceMonitor.enabled: true
      monitoring.serviceMonitor.interval: 1m
    templates:
      - templates/servicemonitor.yaml
    asserts:
      - equal:
          path: spec.endpoints[0].interval
          value: 1m

  - it: ServiceMonitor should include the label relabeling rules
    set:
      monitoring.serviceMonitor.enabled: true
    templates:
      - templates/servicemonitor.yaml
    asserts:
      - isNotEmpty:
          path: spec.endpoints[0].metricRelabelings

  - it: ServiceMonitor should authenticate with the generated API key by default
    set:
      monitoring.serviceMonitor.enabled: true
    templates:
      - templates/servicemonitor.yaml
    asserts:
      - isNotEmpty:
          path: spec.endpoints[0].authorization.credentials.name
      - equal:
          path: spec.endpoints[0].authorization.credentials.key
          value: GREENKUBE_API_KEY

  - it: ServiceMonitor still renders with the deprecated config.api.enabled false (the API is always deployed)
    set:
      monitoring.serviceMonitor.enabled: true
      config.api.enabled: false
    templates:
      - templates/servicemonitor.yaml
    asserts:
      - hasDocuments:
          count: 1

  - it: ServiceMonitor should use the API key as bearer token when configured
    set:
      monitoring.serviceMonitor.enabled: true
      secrets.apiKey: test-key
    templates:
      - templates/servicemonitor.yaml
    asserts:
      - equal:
          path: spec.endpoints[0].authorization.type
          value: Bearer
      - equal:
          path: spec.endpoints[0].authorization.credentials.key
          value: GREENKUBE_API_KEY

  - it: ServiceMonitor should use existingSecret for bearer credentials
    set:
      monitoring.serviceMonitor.enabled: true
      secrets.existingSecret: shared-greennkube-secrets
    templates:
      - templates/servicemonitor.yaml
    asserts:
      - equal:
          path: spec.endpoints[0].authorization.type
          value: Bearer
      - equal:
          path: spec.endpoints[0].authorization.credentials.name
          value: shared-greennkube-secrets

  - it: ServiceMonitor should carry kube-prometheus labels
    set:
      monitoring.serviceMonitor.enabled: true
    templates:
      - templates/servicemonitor.yaml
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: kube-prometheus

  - it: ServiceMonitor should merge additionalLabels
    set:
      monitoring.serviceMonitor.enabled: true
      monitoring.serviceMonitor.additionalLabels:
        release: prometheus
    templates:
      - templates/servicemonitor.yaml
    asserts:
      - equal:
          path: metadata.labels.release
          value: prometheus

  # --------------------------------------------------------------------------
  # NetworkPolicy — disabled by default
  # --------------------------------------------------------------------------
  - it: should not render NetworkPolicy when disabled
    templates:
      - templates/networkpolicy.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should render NetworkPolicy when enabled
    set:
      monitoring.networkPolicy.enabled: true
    templates:
      - templates/networkpolicy.yaml
    asserts:
      - isKind:
          of: NetworkPolicy

  - it: NetworkPolicy should allow ingress from the configured prometheus namespace
    set:
      monitoring.networkPolicy.enabled: true
      monitoring.networkPolicy.prometheusNamespace: observability
    templates:
      - templates/networkpolicy.yaml
    asserts:
      - equal:
          path: spec.ingress[0].from[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: observability

  - it: NetworkPolicy should open the API port
    set:
      monitoring.networkPolicy.enabled: true
    templates:
      - templates/networkpolicy.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 8000

  - it: NetworkPolicy should append custom ingress rules
    set:
      monitoring.networkPolicy.enabled: true
      monitoring.networkPolicy.additionalIngress:
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: ingress-nginx
          ports:
            - protocol: TCP
              port: 8000
    templates:
      - templates/networkpolicy.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.ingress[1].from[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: ingress-nginx

  - it: NetworkPolicy should allow DNS and bundled PostgreSQL egress without broad internet access
    set:
      monitoring.networkPolicy.enabled: true
    templates:
      - templates/networkpolicy.yaml
    asserts:
      - equal:
          path: spec.policyTypes
          value:
            - Ingress
            - Egress
      - equal:
          path: spec.egress[0].to[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: kube-system
      - equal:
          path: spec.egress[0].ports[0].port
          value: 53
      - equal:
          path: spec.egress[1].to[0].podSelector.matchLabels["app.kubernetes.io/component"]
          value: postgres
      - notContains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 0.0.0.0/0

  - it: NetworkPolicy should append explicitly configured egress rules
    set:
      monitoring.networkPolicy.enabled: true
      monitoring.networkPolicy.additionalEgress:
        - to:
            - ipBlock:
                cidr: 203.0.113.0/24
          ports:
            - protocol: TCP
              port: 443
    templates:
      - templates/networkpolicy.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.egress[3].to[0].ipBlock.cidr
          value: 203.0.113.0/24
      - equal:
          path: spec.egress[3].ports[0].port
          value: 443

  - it: NetworkPolicy should cover the API, controller and worker pods
    set:
      worker.replicas: 1
      monitoring.networkPolicy.enabled: true
    templates:
      - templates/networkpolicy.yaml
    asserts:
      - hasDocuments:
          count: 3
      - documentIndex: 0
        equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/component"]
          value: api
      - documentIndex: 1
        equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/component"]
          value: controller
      - documentIndex: 2
        equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/component"]
          value: worker
      - documentIndex: 2
        equal:
          path: spec.ingress[0].ports[0].port
          value: 8001
      - documentIndex: 2
        equal:
          path: spec.egress[1].to[0].podSelector.matchLabels["app.kubernetes.io/component"]
          value: postgres
      - documentIndex: 2
        equal:
          path: spec.egress[2].to[0].podSelector.matchLabels["app.kubernetes.io/component"]
          value: renderer-sandbox

  - it: NetworkPolicy names should remain unique with a long release name
    set:
      fullnameOverride: greenkube-component-networkpolicy-name-long-long-long-long-long
      monitoring.networkPolicy.enabled: true
      worker.replicas: 1
    templates:
      - templates/networkpolicy.yaml
    asserts:
      - documentIndex: 0
        matchRegex:
          path: metadata.name
          pattern: "-api-netpol$"
      - documentIndex: 1
        matchRegex:
          path: metadata.name
          pattern: "-controller-netpol$"
      - documentIndex: 2
        matchRegex:
          path: metadata.name
          pattern: "-worker-netpol$"
