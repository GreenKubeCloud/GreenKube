suite: rbac
templates:
  - templates/serviceaccount.yaml
  - templates/clusterrole.yaml
  - templates/clusterrolebinding.yaml
  - templates/controller-role.yaml
  - templates/rolebinding.yaml
  - templates/leader-lease.yaml
  - templates/components.yaml

tests:
  # --------------------------------------------------------------------------
  # ServiceAccount
  # --------------------------------------------------------------------------
  - it: renders one ServiceAccount per component (api, controller)
    templates:
      - templates/serviceaccount.yaml
    asserts:
      - hasDocuments:
          count: 2
      - documentIndex: 0
        equal:
          path: metadata.name
          value: RELEASE-NAME-greenkube-api
      - documentIndex: 1
        equal:
          path: metadata.name
          value: RELEASE-NAME-greenkube-controller

  - it: should not render a ServiceAccount when serviceAccount.create is false
    set:
      serviceAccount.create: false
    templates:
      - templates/serviceaccount.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: runs every component with an existing ServiceAccount when create is false
    set:
      serviceAccount.create: false
      serviceAccount.name: my-sa
    templates:
      - templates/components.yaml
    asserts:
      - documentIndex: 0
        equal:
          path: spec.template.spec.serviceAccountName
          value: my-sa
      - documentIndex: 1
        equal:
          path: spec.template.spec.serviceAccountName
          value: my-sa

  # --------------------------------------------------------------------------
  # ClusterRole
  # --------------------------------------------------------------------------
  - it: should render a ClusterRole when rbac.create is true
    templates:
      - templates/clusterrole.yaml
    asserts:
      - isKind:
          of: ClusterRole

  - it: should not render a ClusterRole when rbac.create is false
    set:
      rbac.create: false
    templates:
      - templates/clusterrole.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: ClusterRole should grant read access to nodes, pods, services
    templates:
      - templates/clusterrole.yaml
    asserts:
      - contains:
          path: rules[0].resources
          content: nodes
      - contains:
          path: rules[0].resources
          content: pods
      - contains:
          path: rules[0].resources
          content: services
      - contains:
          path: rules[0].verbs
          content: list

  - it: ClusterRole should grant read access to persistent volumes and claims
    templates:
      - templates/clusterrole.yaml
    asserts:
      - contains:
          path: rules[0].resources
          content: persistentvolumes
      - contains:
          path: rules[0].resources
          content: persistentvolumeclaims
      - contains:
          path: rules[0].verbs
          content: list

  - it: ClusterRole should grant read access to endpoints for LoadBalancer detection
    templates:
      - templates/clusterrole.yaml
    asserts:
      - contains:
          path: rules[0].resources
          content: endpoints
      - contains:
          path: rules[0].verbs
          content: list

  - it: ClusterRole should grant read access to HPAs
    templates:
      - templates/clusterrole.yaml
    asserts:
      - contains:
          path: rules[1].resources
          content: horizontalpodautoscalers
      - contains:
          path: rules[1].verbs
          content: list

  - it: ClusterRole should grant read access to PodDisruptionBudgets
    templates:
      - templates/clusterrole.yaml
    asserts:
      - contains:
          path: rules[2].resources
          content: poddisruptionbudgets
      - contains:
          path: rules[2].verbs
          content: list

  - it: ClusterRole should grant read access to VPA, Karpenter and workloads
    templates:
      - templates/clusterrole.yaml
    asserts:
      - contains:
          path: rules[3].resources
          content: verticalpodautoscalers
      - contains:
          path: rules[4].resources
          content: nodepools
      - contains:
          path: rules[5].resources
          content: deployments
      - contains:
          path: rules[5].resources
          content: statefulsets
      - contains:
          path: rules[5].verbs
          content: list

  - it: ClusterRole should grant read-only discovery access to Argo CD
    templates:
      - templates/clusterrole.yaml
    asserts:
      - equal:
          path: rules[6].apiGroups
          value: ["argoproj.io"]
      - contains:
          path: rules[6].resources
          content: applications
      - contains:
          path: rules[6].resources
          content: appprojects
      - contains:
          path: rules[6].resources
          content: rollouts
      - equal:
          path: rules[9].verbs
          value: ["get", "list", "watch"]

  - it: ClusterRole should grant read-only discovery access to Flux
    templates:
      - templates/clusterrole.yaml
    asserts:
      - equal:
          path: rules[7].apiGroups
          value: ["source.toolkit.fluxcd.io"]
      - contains:
          path: rules[7].resources
          content: gitrepositories
      - contains:
          path: rules[7].resources
          content: helmrepositories
      - contains:
          path: rules[7].resources
          content: ocirepositories
      - contains:
          path: rules[7].resources
          content: buckets
      - equal:
          path: rules[9].verbs
          value: ["get", "list", "watch"]
      - equal:
          path: rules[8].apiGroups
          value: ["kustomize.toolkit.fluxcd.io"]
      - contains:
          path: rules[8].resources
          content: kustomizations
      - equal:
          path: rules[9].verbs
          value: ["get", "list", "watch"]
      - equal:
          path: rules[9].apiGroups
          value: ["helm.toolkit.fluxcd.io"]
      - contains:
          path: rules[9].resources
          content: helmreleases
      - equal:
          path: rules[9].verbs
          value: ["get", "list", "watch"]

  - it: ClusterRole should grant read-only access to per-container PodMetrics
    templates:
      - templates/clusterrole.yaml
    asserts:
      - equal:
          path: rules[10].apiGroups
          value: ["metrics.k8s.io"]
      - equal:
          path: rules[10].resources
          value: ["pods"]
      - equal:
          path: rules[10].verbs
          value: ["get", "list"]

  - it: ClusterRole should grant read-only access to deletion evidence
    templates:
      - templates/clusterrole.yaml
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["discovery.k8s.io"]
            resources: ["endpointslices"]
            verbs: ["get", "list", "watch"]
      - contains:
          path: rules
          content:
            apiGroups: ["networking.k8s.io"]
            resources: ["ingresses"]
            verbs: ["get", "list"]
      - contains:
          path: rules
          content:
            apiGroups: ["gateway.networking.k8s.io"]
            resources: ["gateways", "httproutes", "grpcroutes", "tlsroutes", "tcproutes", "udproutes"]
            verbs: ["get", "list"]
      - contains:
          path: rules
          content:
            apiGroups: ["batch"]
            resources: ["cronjobs", "jobs"]
            verbs: ["get", "list"]
      - contains:
          path: rules
          content:
            apiGroups: ["snapshot.storage.k8s.io"]
            resources: ["volumesnapshots", "volumesnapshotcontents"]
            verbs: ["get", "list"]

  - it: ClusterRole should never grant Secret access
    templates:
      - templates/clusterrole.yaml
    asserts:
      - notContains:
          path: rules
          content: secrets

  # --------------------------------------------------------------------------
  # ClusterRoleBinding
  # --------------------------------------------------------------------------
  - it: should render a ClusterRoleBinding when rbac.create is true
    templates:
      - templates/clusterrolebinding.yaml
    asserts:
      - isKind:
          of: ClusterRoleBinding

  - it: should not render a ClusterRoleBinding when rbac.create is false
    set:
      rbac.create: false
    templates:
      - templates/clusterrolebinding.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: ClusterRoleBinding should reference the ClusterRole
    templates:
      - templates/clusterrolebinding.yaml
    asserts:
      - equal:
          path: roleRef.kind
          value: ClusterRole
      - equal:
          path: roleRef.name
          value: RELEASE-NAME-greenkube

  - it: ClusterRoleBinding should bind the ServiceAccount
    templates:
      - templates/clusterrolebinding.yaml
    asserts:
      - equal:
          path: subjects[0].kind
          value: ServiceAccount
      - equal:
          path: subjects[0].name
          value: RELEASE-NAME-greenkube-controller
      - equal:
          path: subjects[1].name
          value: RELEASE-NAME-greenkube-api
      - lengthEqual:
          path: subjects
          count: 2

  - it: ClusterRoleBinding binds the worker ServiceAccount only with a worker
    set:
      worker.replicas: 1
    templates:
      - templates/clusterrolebinding.yaml
    asserts:
      - equal:
          path: subjects[2].name
          value: RELEASE-NAME-greenkube-worker

  # --------------------------------------------------------------------------
  # Controller Lease (always rendered, F11)
  # --------------------------------------------------------------------------
  - it: always renders the controller Lease and its namespaced Role
    templates:
      - templates/leader-lease.yaml
      - templates/controller-role.yaml
    asserts:
      - template: templates/leader-lease.yaml
        equal:
          path: metadata.name
          value: RELEASE-NAME-greenkube-leader
      - template: templates/leader-lease.yaml
        equal:
          path: spec.leaseDurationSeconds
          value: 30
      - template: templates/controller-role.yaml
        documentIndex: 0
        equal:
          path: rules[1].resourceNames
          value: [RELEASE-NAME-greenkube-leader]
      - template: templates/controller-role.yaml
        documentIndex: 1
        equal:
          path: subjects[0].name
          value: RELEASE-NAME-greenkube-controller

  - it: maps the 0.3.x production.leaderElection values
    set:
      profile: production
      production.leaderElection.leaseName: my-lease
      production.leaderElection.leaseDurationSeconds: 45
    templates:
      - templates/leader-lease.yaml
      - templates/components.yaml
    asserts:
      - template: templates/leader-lease.yaml
        equal:
          path: metadata.name
          value: my-lease
      - template: templates/leader-lease.yaml
        equal:
          path: spec.leaseDurationSeconds
          value: 45
      - template: templates/components.yaml
        documentIndex: 1
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEADER_ELECTION_LEASE_NAME
            value: my-lease

  - it: binds the initial-admin Role to the API ServiceAccount
    templates:
      - templates/rolebinding.yaml
    asserts:
      - equal:
          path: subjects[0].name
          value: RELEASE-NAME-greenkube-api
