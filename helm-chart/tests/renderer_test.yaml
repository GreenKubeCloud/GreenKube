suite: isolated renderer
templates:
  - templates/renderer.yaml
  - templates/configmap.yaml
  - templates/networkpolicy.yaml
tests:
  - it: deploys a credential-free renderer with network-deny policy
    set:
      renderer.egressFirewall.enabled: true
    templates:
      - templates/renderer.yaml
    asserts:
      - hasDocuments:
          count: 3
      - documentIndex: 0
        equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - documentIndex: 0
        equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 20002
      - documentIndex: 0
        equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 20002
      - documentIndex: 0
        equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsUser
          value: 0
      - documentIndex: 0
        equal:
          path: spec.template.spec.initContainers[0].securityContext.capabilities.add
          value:
            - NET_ADMIN
      - documentIndex: 0
        matchRegex:
          path: spec.template.spec.initContainers[0].args[0]
          pattern: "iptables-legacy -w 10 -P OUTPUT DROP"
      - documentIndex: 0
        equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - documentIndex: 0
        equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 20002
      - documentIndex: 0
        lengthEqual:
          path: spec.template.spec.volumes
          count: 1
      - documentIndex: 1
        isKind:
          of: Service
      - documentIndex: 2
        equal:
          path: spec.policyTypes
          value:
            - Ingress
            - Egress
      - documentIndex: 2
        equal:
          path: spec.egress
          value: []

  - it: configures policy gates and the renderer service endpoint
    templates:
      - templates/configmap.yaml
    asserts:
      - hasDocuments:
          count: 1
      - matchRegex:
          path: data.GITOPS_RENDERER_URL
          pattern: "^http://.+-renderer:8090$"
      - matchRegex:
          path: data.GITOPS_POLICY_JSON
          pattern: '"minSamples":36'
      - matchRegex:
          path: data.GITOPS_POLICY_JSON
          pattern: '"minCoverage":0.5'
      - matchRegex:
          path: data.GITOPS_POLICY_JSON
          pattern: '"missingEvidence":"fail"'

  - it: fails closed on missing policy evidence by default
    templates:
      - templates/configmap.yaml
    asserts:
      - matchRegex:
          path: data.GITOPS_POLICY_JSON
          pattern: '"missingEvidence":"fail"'

  - it: lets an explicit missingEvidence override the default
    set:
      automation.policy.missingEvidence: warn
    templates:
      - templates/configmap.yaml
    asserts:
      - matchRegex:
          path: data.GITOPS_POLICY_JSON
          pattern: '"missingEvidence":"warn"'

  - it: does not require the optional NET_ADMIN firewall init container by default
    templates:
      - templates/renderer.yaml
    asserts:
      - isNull:
          path: spec.template.spec.initContainers

  - it: allows a privileged firewall init container for Minikube runtimes that deny NET_ADMIN
    set:
      renderer.egressFirewall.enabled: true
      renderer.egressFirewall.privilegedInitContainer: true
      automation.providers:
        - id: github-primary
          type: github
          secretName: git-auth
          secretKey: token
          repositoryAllowlist:
            - acme/*
    templates:
      - templates/renderer.yaml
    asserts:
      - documentIndex: 0
        equal:
          path: spec.template.spec.initContainers[0].securityContext.privileged
          value: true
      - documentIndex: 0
        notExists:
          path: spec.template.spec.initContainers[0].securityContext.allowPrivilegeEscalation
      - documentIndex: 0
        matchRegex:
          path: spec.template.spec.initContainers[0].args[0]
          pattern: "iptables-legacy -w 10 -P OUTPUT DROP"

  - it: always deploys the renderer with small requests (F6)
    templates:
      - templates/renderer.yaml
    asserts:
      - hasDocuments:
          count: 3
      - documentIndex: 0
        equal:
          path: spec.template.spec.containers[0].resources.requests
          value:
            cpu: 25m
            memory: 96Mi

  - it: keeps the renderer when the 0.3.x rendererSandbox.enabled is false, mapping its other keys
    set:
      rendererSandbox.enabled: false
      rendererSandbox.replicas: 2
      rendererSandbox.servicePort: 8091
    templates:
      - templates/renderer.yaml
      - templates/configmap.yaml
    asserts:
      - template: templates/renderer.yaml
        documentIndex: 0
        equal:
          path: spec.replicas
          value: 2
      - template: templates/renderer.yaml
        documentIndex: 1
        equal:
          path: spec.ports[0].port
          value: 8091
      - template: templates/configmap.yaml
        matchRegex:
          path: data.GITOPS_RENDERER_URL
          pattern: "^http://.+-renderer:8091$"

  - it: allows controller pods to reach the isolated renderer without opening renderer egress
    set:
      monitoring.networkPolicy.enabled: true
    templates:
      - templates/networkpolicy.yaml
    asserts:
      - hasDocuments:
          count: 2
      - documentIndex: 1
        equal:
          path: spec.egress[2].ports[0].port
          value: 8090
