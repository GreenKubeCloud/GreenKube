suite: least-privilege application Secret projections
templates:
  - templates/deployment.yaml
  - templates/automation-worker.yaml
  - templates/production-deployments.yaml

tests:
  - it: mounts provider credentials to the standalone controller only for inline automation
    set:
      config.api.enabled: false
      automation.enabled: true
      automation.mode: inline
      automation.providers:
        - id: gitea-test
          type: gitea
          apiBaseUrl: http://gitea.test:3000
          secretName: gitea-auth
          secretKey: token
          repositoryAllowlist:
            - owner/repo
    templates:
      - templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[1].name
          value: git-provider-secrets
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[1].mountPath
          value: /etc/greenkube/git-providers
      - equal:
          path: spec.template.spec.volumes[1].name
          value: git-provider-secrets
      - equal:
          path: spec.template.spec.volumes[1].projected.sources[0].secret.name
          value: gitea-auth

  - it: mounts provider credentials to the production controller only for inline automation
    set:
      profile: production
      automation.enabled: true
      automation.mode: inline
      automation.providers:
        - id: gitea-test
          type: gitea
          apiBaseUrl: http://gitea.test:3000
          secretName: gitea-auth
          secretKey: token
          repositoryAllowlist:
            - owner/repo
    templates:
      - templates/production-deployments.yaml
    asserts:
      - hasDocuments:
          count: 2
      - documentIndex: 1
        equal:
          path: spec.template.spec.containers[0].volumeMounts[1].name
          value: git-provider-secrets
      - documentIndex: 1
        equal:
          path: spec.template.spec.volumes[1].name
          value: git-provider-secrets

  - it: injects only the API key into the standalone API container
    set:
      secrets.existingSecret: api-auth-secret
    templates:
      - templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: GREENKUBE_API_KEY
            valueFrom:
              secretKeyRef:
                name: api-auth-secret
                key: GREENKUBE_API_KEY
                optional: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GREENKUBE_API_KEY
            valueFrom:
              secretKeyRef:
                name: api-auth-secret
                key: GREENKUBE_API_KEY
                optional: true

  - it: injects the API key only into the production API component
    set:
      profile: production
      automation.enabled: true
      automation.mode: worker
      secrets.existingSecret: api-auth-secret
    templates:
      - templates/production-deployments.yaml
    asserts:
      - documentIndex: 0
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GREENKUBE_API_KEY
            valueFrom:
              secretKeyRef:
                name: api-auth-secret
                key: GREENKUBE_API_KEY
                optional: true
      - documentIndex: 1
        notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GREENKUBE_API_KEY
            valueFrom:
              secretKeyRef:
                name: api-auth-secret
                key: GREENKUBE_API_KEY
                optional: true
      - documentIndex: 2
        notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GREENKUBE_API_KEY
            valueFrom:
              secretKeyRef:
                name: api-auth-secret
                key: GREENKUBE_API_KEY
                optional: true

  - it: projects controller and API keys separately in standalone pods
    templates:
      - templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].projected.sources[0].secret.items
          value:
            - key: DB_CONNECTION_STRING
              path: DB_CONNECTION_STRING
            - key: ELECTRICITY_MAPS_TOKEN
              path: ELECTRICITY_MAPS_TOKEN
            - key: BOAVIZTA_TOKEN
              path: BOAVIZTA_TOKEN
            - key: PROMETHEUS_URL
              path: PROMETHEUS_URL
            - key: PROMETHEUS_USERNAME
              path: PROMETHEUS_USERNAME
            - key: PROMETHEUS_PASSWORD
              path: PROMETHEUS_PASSWORD
            - key: PROMETHEUS_BEARER_TOKEN
              path: PROMETHEUS_BEARER_TOKEN
            - key: OPENCOST_API_URL
              path: OPENCOST_API_URL
            - key: OPENCOST_USERNAME
              path: OPENCOST_USERNAME
            - key: OPENCOST_PASSWORD
              path: OPENCOST_PASSWORD
            - key: OPENCOST_BEARER_TOKEN
              path: OPENCOST_BEARER_TOKEN
            - key: BOAVIZTA_API_URL
              path: BOAVIZTA_API_URL
            - key: WATTNET_EMAIL
              path: WATTNET_EMAIL
            - key: WATTNET_PASSWORD
              path: WATTNET_PASSWORD
      - equal:
          path: spec.template.spec.volumes[1].projected.sources[0].secret.items
          value:
            - key: DB_CONNECTION_STRING
              path: DB_CONNECTION_STRING
            - key: ELECTRICITY_MAPS_TOKEN
              path: ELECTRICITY_MAPS_TOKEN
            - key: BOAVIZTA_TOKEN
              path: BOAVIZTA_TOKEN
            - key: PROMETHEUS_URL
              path: PROMETHEUS_URL
            - key: PROMETHEUS_USERNAME
              path: PROMETHEUS_USERNAME
            - key: PROMETHEUS_PASSWORD
              path: PROMETHEUS_PASSWORD
            - key: PROMETHEUS_BEARER_TOKEN
              path: PROMETHEUS_BEARER_TOKEN
            - key: OPENCOST_API_URL
              path: OPENCOST_API_URL
            - key: OPENCOST_USERNAME
              path: OPENCOST_USERNAME
            - key: OPENCOST_PASSWORD
              path: OPENCOST_PASSWORD
            - key: OPENCOST_BEARER_TOKEN
              path: OPENCOST_BEARER_TOKEN
            - key: BOAVIZTA_API_URL
              path: BOAVIZTA_API_URL
            - key: WATTNET_EMAIL
              path: WATTNET_EMAIL
            - key: WATTNET_PASSWORD
              path: WATTNET_PASSWORD
            - key: GREENKUBE_API_KEY
              path: GREENKUBE_API_KEY
      - isNull:
          path: spec.template.spec.containers[0].envFrom[1].secretRef
      - isNull:
          path: spec.template.spec.containers[1].envFrom[1].secretRef
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: git-provider-secrets
            mountPath: /etc/greenkube/git-providers
            readOnly: true

  - it: limits standalone automation workers to database and API-key secrets
    set:
      automation.enabled: true
      automation.mode: worker
    templates:
      - templates/automation-worker.yaml
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].projected.sources[0].secret.items
          value:
            - key: DB_CONNECTION_STRING
              path: DB_CONNECTION_STRING
            - key: GREENKUBE_API_KEY
              path: GREENKUBE_API_KEY
      - isNull:
          path: spec.template.spec.containers[0].envFrom[1].secretRef
      - notContains:
          path: spec.template.spec.volumes[0].projected.sources[0].secret.items
          content:
            key: ELECTRICITY_MAPS_TOKEN
            path: ELECTRICITY_MAPS_TOKEN

  - it: limits production controllers and automation workers to their required keys
    set:
      profile: production
      automation.enabled: true
      automation.mode: worker
    templates:
      - templates/production-deployments.yaml
    asserts:
      - documentIndex: 0
        contains:
          path: spec.template.spec.volumes[0].projected.sources[0].secret.items
          content:
            key: GREENKUBE_API_KEY
            path: GREENKUBE_API_KEY
      - documentIndex: 1
        notContains:
          path: spec.template.spec.volumes[0].projected.sources[0].secret.items
          content:
            key: GREENKUBE_API_KEY
            path: GREENKUBE_API_KEY
      - documentIndex: 2
        equal:
          path: spec.template.spec.volumes[0].projected.sources[0].secret.items
          value:
            - key: DB_CONNECTION_STRING
              path: DB_CONNECTION_STRING
            - key: GREENKUBE_API_KEY
              path: GREENKUBE_API_KEY
      - documentIndex: 0
        isNull:
          path: spec.template.spec.containers[0].envFrom[1].secretRef
      - documentIndex: 1
        isNull:
          path: spec.template.spec.containers[0].envFrom[1].secretRef
      - documentIndex: 2
        isNull:
          path: spec.template.spec.containers[0].envFrom[1].secretRef
