suite: least-privilege application Secret projections
templates:
  - templates/components.yaml

tests:
  - it: mounts the Git provider credentials into the api, controller and worker (F12)
    set:
      worker.replicas: 1
      automation.providers:
        - id: gitea-test
          type: gitea
          apiBaseUrl: http://gitea.test:3000
          secretName: gitea-auth
          secretKey: token
          repositoryAllowlist:
            - owner/repo
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[1]
          value:
            name: git-provider-secrets
            mountPath: /etc/greenkube/git-providers
            readOnly: true
      - equal:
          path: spec.template.spec.volumes[1].name
          value: git-provider-secrets
      - contains:
          path: spec.template.spec.volumes[1].projected.sources
          content:
            secret:
              name: gitea-auth
              items:
                - key: token
                  path: gitea-auth/token

  - it: always projects the optional default credentials Secret, so creating it activates delivery
    asserts:
      - equal:
          path: spec.template.spec.volumes[1].projected.sources
          value:
            - secret:
                name: greenkube-git-credentials
                optional: true
                items:
                  - key: token
                    path: greenkube-git-credentials/token
                  - key: appId
                    path: greenkube-git-credentials/appId
                  - key: privateKey
                    path: greenkube-git-credentials/privateKey

  - it: injects the API key only into the API component
    set:
      worker.replicas: 1
      secrets.existingSecret: api-auth-secret
    asserts:
      - documentIndex: 0
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GREENKUBE_API_KEY
            valueFrom:
              secretKeyRef:
                name: api-auth-secret
                key: GREENKUBE_API_KEY
                optional: true
      - documentIndex: 1
        notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GREENKUBE_API_KEY
            valueFrom:
              secretKeyRef:
                name: api-auth-secret
                key: GREENKUBE_API_KEY
                optional: true
      - documentIndex: 2
        notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GREENKUBE_API_KEY
            valueFrom:
              secretKeyRef:
                name: api-auth-secret
                key: GREENKUBE_API_KEY
                optional: true

  - it: projects controller and API keys separately
    asserts:
      # Generated or runtime keys come from the bootstrap-created Secret ...
      - documentIndex: 1
        equal:
          path: spec.template.spec.volumes[0].projected.sources[0].secret.name
          value: RELEASE-NAME-greenkube
      - documentIndex: 1
        equal:
          path: spec.template.spec.volumes[0].projected.sources[0].secret.items
          value:
            - key: DB_CONNECTION_STRING
              path: DB_CONNECTION_STRING
            - key: ELECTRICITY_MAPS_TOKEN
              path: ELECTRICITY_MAPS_TOKEN
            - key: BOAVIZTA_TOKEN
              path: BOAVIZTA_TOKEN
            - key: PROMETHEUS_URL
              path: PROMETHEUS_URL
            - key: PROMETHEUS_USERNAME
              path: PROMETHEUS_USERNAME
            - key: PROMETHEUS_PASSWORD
              path: PROMETHEUS_PASSWORD
            - key: PROMETHEUS_BEARER_TOKEN
              path: PROMETHEUS_BEARER_TOKEN
            - key: OPENCOST_API_URL
              path: OPENCOST_API_URL
            - key: OPENCOST_USERNAME
              path: OPENCOST_USERNAME
            - key: OPENCOST_PASSWORD
              path: OPENCOST_PASSWORD
            - key: OPENCOST_BEARER_TOKEN
              path: OPENCOST_BEARER_TOKEN
            - key: BOAVIZTA_API_URL
              path: BOAVIZTA_API_URL
            - key: WATTNET_EMAIL
              path: WATTNET_EMAIL
            - key: WATTNET_PASSWORD
              path: WATTNET_PASSWORD
      # ... and nothing comes from the values Secret when nothing is set in values.
      - documentIndex: 1
        lengthEqual:
          path: spec.template.spec.volumes[0].projected.sources
          count: 1
      - documentIndex: 0
        equal:
          path: spec.template.spec.volumes[0].projected.sources[0].secret.items
          value:
            - key: DB_CONNECTION_STRING
              path: DB_CONNECTION_STRING
            - key: ELECTRICITY_MAPS_TOKEN
              path: ELECTRICITY_MAPS_TOKEN
            - key: BOAVIZTA_TOKEN
              path: BOAVIZTA_TOKEN
            - key: PROMETHEUS_URL
              path: PROMETHEUS_URL
            - key: PROMETHEUS_USERNAME
              path: PROMETHEUS_USERNAME
            - key: PROMETHEUS_PASSWORD
              path: PROMETHEUS_PASSWORD
            - key: PROMETHEUS_BEARER_TOKEN
              path: PROMETHEUS_BEARER_TOKEN
            - key: OPENCOST_API_URL
              path: OPENCOST_API_URL
            - key: OPENCOST_USERNAME
              path: OPENCOST_USERNAME
            - key: OPENCOST_PASSWORD
              path: OPENCOST_PASSWORD
            - key: OPENCOST_BEARER_TOKEN
              path: OPENCOST_BEARER_TOKEN
            - key: BOAVIZTA_API_URL
              path: BOAVIZTA_API_URL
            - key: WATTNET_EMAIL
              path: WATTNET_EMAIL
            - key: WATTNET_PASSWORD
              path: WATTNET_PASSWORD
            - key: GREENKUBE_API_KEY
              path: GREENKUBE_API_KEY
      - documentIndex: 0
        lengthEqual:
          path: spec.template.spec.volumes[0].projected.sources
          count: 1
      - isNull:
          path: spec.template.spec.containers[0].envFrom[1].secretRef

  - it: projects each key from exactly one Secret when credentials are supplied in values
    set:
      secrets.apiKey: supplied-key
      secrets.electricityMapsToken: supplied-token
      postgres.auth.password: supplied-password
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].projected.sources[1].secret.items
          value:
            - key: DB_CONNECTION_STRING
              path: DB_CONNECTION_STRING
            - key: ELECTRICITY_MAPS_TOKEN
              path: ELECTRICITY_MAPS_TOKEN
            - key: GREENKUBE_API_KEY
              path: GREENKUBE_API_KEY
      - contains:
          path: spec.template.spec.volumes[0].projected.sources[0].secret.items
          content:
            key: BOAVIZTA_API_URL
            path: BOAVIZTA_API_URL
      - notContains:
          path: spec.template.spec.volumes[0].projected.sources[0].secret.items
          content:
            key: GREENKUBE_API_KEY
            path: GREENKUBE_API_KEY
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GREENKUBE_API_KEY
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-greenkube-values
                key: GREENKUBE_API_KEY
                optional: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_CONNECTION_STRING
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-greenkube-values
                key: DB_CONNECTION_STRING

  - it: projects every key from secrets.existingSecret
    set:
      secrets.existingSecret: gitops-credentials
    asserts:
      - lengthEqual:
          path: spec.template.spec.volumes[0].projected.sources
          count: 1
      - equal:
          path: spec.template.spec.volumes[0].projected.sources[0].secret.name
          value: gitops-credentials

  - it: limits dedicated workers to database and API-key secrets
    set:
      worker.replicas: 1
    documentIndex: 2
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].projected.sources[0].secret.items
          value:
            - key: DB_CONNECTION_STRING
              path: DB_CONNECTION_STRING
            - key: GREENKUBE_API_KEY
              path: GREENKUBE_API_KEY
      - isNull:
          path: spec.template.spec.containers[0].envFrom[1].secretRef
