suite: values Secret
templates:
  - templates/secret.yaml

tests:
  # --------------------------------------------------------------------------
  # Kind / structure — a regular release resource rendered from values only
  # --------------------------------------------------------------------------
  - it: should render a regular Opaque Secret for values-supplied credentials
    set:
      secrets.electricityMapsToken: "my-token"
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-greenkube-values
      - equal:
          path: type
          value: Opaque
      - notExists:
          path: metadata.annotations

  - it: should not render a Secret when no credential is supplied
    asserts:
      - hasDocuments:
          count: 0

  # --------------------------------------------------------------------------
  # Generated credentials are never rendered (BUG-58)
  # --------------------------------------------------------------------------
  - it: should not render a generated GREENKUBE_API_KEY
    set:
      secrets.electricityMapsToken: "my-token"
    asserts:
      - hasDocuments:
          count: 1
      - notExists:
          path: data.GREENKUBE_API_KEY

  - it: should not render a generated PostgreSQL password
    set:
      secrets.electricityMapsToken: "my-token"
    asserts:
      - hasDocuments:
          count: 1
      - notExists:
          path: data.POSTGRES_PASSWORD
      - notExists:
          path: data.DB_CONNECTION_STRING

  # --------------------------------------------------------------------------
  # Optional API tokens — absent when empty
  # --------------------------------------------------------------------------
  - it: should NOT include ELECTRICITY_MAPS_TOKEN by default
    asserts:
      - notExists:
          path: data.ELECTRICITY_MAPS_TOKEN

  - it: should encode ELECTRICITY_MAPS_TOKEN when provided
    set:
      secrets.electricityMapsToken: "my-token"
    asserts:
      - equal:
          path: data.ELECTRICITY_MAPS_TOKEN
          value: "bXktdG9rZW4="   # base64("my-token")

  - it: should NOT include BOAVIZTA_TOKEN by default
    asserts:
      - notExists:
          path: data.BOAVIZTA_TOKEN

  - it: should encode BOAVIZTA_TOKEN when provided
    set:
      secrets.boaviztaToken: "bvz-secret"
    asserts:
      - equal:
          path: data.BOAVIZTA_TOKEN
          value: "YnZ6LXNlY3JldA=="  # base64("bvz-secret")

  - it: should NOT include WATTNET_EMAIL by default
    asserts:
      - notExists:
          path: data.WATTNET_EMAIL

  - it: should encode WATTNET_EMAIL when provided
    set:
      secrets.wattnetEmail: "user@example.com"
    asserts:
      - equal:
          path: data.WATTNET_EMAIL
          value: "dXNlckBleGFtcGxlLmNvbQ=="  # base64("user@example.com")

  - it: should NOT include WATTNET_PASSWORD by default
    asserts:
      - notExists:
          path: data.WATTNET_PASSWORD

  - it: should encode WATTNET_PASSWORD when provided
    set:
      secrets.wattnetPassword: "watt-secret"
    asserts:
      - equal:
          path: data.WATTNET_PASSWORD
          value: "d2F0dC1zZWNyZXQ="  # base64("watt-secret")

  - it: should encode GREENKUBE_API_KEY when provided
    set:
      secrets.apiKey: "s3cr3t"
    asserts:
      - equal:
          path: data.GREENKUBE_API_KEY
          value: "czNjcjN0"  # base64("s3cr3t")

  - it: should not render the obsolete single-provider token
    set:
      secrets.gitToken: "obsolete-token"
    asserts:
      - notExists:
          path: data.GIT_TOKEN

  # --------------------------------------------------------------------------
  # Prometheus auth — absent when empty
  # --------------------------------------------------------------------------
  - it: should NOT include PROMETHEUS_USERNAME by default
    asserts:
      - notExists:
          path: data.PROMETHEUS_USERNAME

  - it: should encode PROMETHEUS_USERNAME when provided
    set:
      secrets.prometheus.username: "admin"
    asserts:
      - equal:
          path: data.PROMETHEUS_USERNAME
          value: "YWRtaW4="  # base64("admin")

  - it: should encode PROMETHEUS_PASSWORD when provided
    set:
      secrets.prometheus.password: "pw"
    asserts:
      - equal:
          path: data.PROMETHEUS_PASSWORD
          value: "cHc="  # base64("pw")

  - it: should NOT include PROMETHEUS_BEARER_TOKEN by default
    asserts:
      - notExists:
          path: data.PROMETHEUS_BEARER_TOKEN

  - it: should encode PROMETHEUS_BEARER_TOKEN when provided
    set:
      secrets.prometheus.bearerToken: "tok123"
    asserts:
      - equal:
          path: data.PROMETHEUS_BEARER_TOKEN
          value: "dG9rMTIz"  # base64("tok123")

  # --------------------------------------------------------------------------
  # Service URLs supplied in values
  # --------------------------------------------------------------------------
  - it: should NOT include PROMETHEUS_URL by default
    asserts:
      - notExists:
          path: data.PROMETHEUS_URL

  - it: should encode PROMETHEUS_URL when provided via values
    set:
      config.prometheus.url: "http://prometheus:9090"
    asserts:
      - equal:
          path: data.PROMETHEUS_URL
          value: "aHR0cDovL3Byb21ldGhldXM6OTA5MA=="  # base64("http://prometheus:9090")

  - it: should NOT include OPENCOST_API_URL by default
    asserts:
      - notExists:
          path: data.OPENCOST_API_URL

  - it: should encode OPENCOST_API_URL when provided via values
    set:
      config.opencost.url: "http://opencost:9003"
    asserts:
      - equal:
          path: data.OPENCOST_API_URL
          value: "aHR0cDovL29wZW5jb3N0OjkwMDM="  # base64("http://opencost:9003")

  # config.boavizta.url is empty by default, so a Settings-page override stored
  # in Secret RELEASE-NAME-greenkube is not shadowed by the values Secret.
  - it: should NOT include BOAVIZTA_API_URL by default
    set:
      secrets.electricityMapsToken: "my-token"
    asserts:
      - hasDocuments:
          count: 1
      - notExists:
          path: data.BOAVIZTA_API_URL

  - it: should encode BOAVIZTA_API_URL when provided via values
    set:
      config.boavizta.url: "https://custom-boavizta.example.com"
    asserts:
      - equal:
          path: data.BOAVIZTA_API_URL
          value: "aHR0cHM6Ly9jdXN0b20tYm9hdml6dGEuZXhhbXBsZS5jb20="  # base64("https://custom-boavizta.example.com")

  # --------------------------------------------------------------------------
  # Database credentials supplied in values
  # --------------------------------------------------------------------------
  - it: should render the bundled PostgreSQL credentials when the password is supplied
    set:
      postgres.auth.password: "pw"
    asserts:
      - equal:
          path: data.POSTGRES_PASSWORD
          value: "cHc="  # base64("pw")
      - equal:
          path: data.DB_CONNECTION_STRING
          # base64("postgresql://greenkube:pw@RELEASE-NAME-greenkube-postgres:5432/greenkube")
          value: "cG9zdGdyZXNxbDovL2dyZWVua3ViZTpwd0BSRUxFQVNFLU5BTUUtZ3JlZW5rdWJlLXBvc3RncmVzOjU0MzIvZ3JlZW5rdWJl"

  - it: should NOT include POSTGRES_PASSWORD when postgres is disabled
    set:
      postgres.enabled: false
      config.db.type: postgres
      postgres.auth.password: "ignored"
      secrets.dbConnectionString: "postgresql://u:p@host:5432/db"
    asserts:
      - notExists:
          path: data.POSTGRES_PASSWORD

  - it: should encode a custom dbConnectionString when postgres is disabled
    set:
      postgres.enabled: false
      config.db.type: postgres
      secrets.dbConnectionString: "postgresql://u:p@host:5432/db"
    asserts:
      - equal:
          path: data.DB_CONNECTION_STRING
          value: "cG9zdGdyZXNxbDovL3U6cEBob3N0OjU0MzIvZGI="  # base64 of the string

  - it: should ignore dbConnectionString for the bundled PostgreSQL
    set:
      secrets.dbConnectionString: "postgresql://u:p@host:5432/db"
    asserts:
      - notExists:
          path: data.DB_CONNECTION_STRING

  # --------------------------------------------------------------------------
  # existingSecret — skip chart Secret rendering (GitOps path)
  # --------------------------------------------------------------------------
  - it: should NOT render a Secret when existingSecret is set
    set:
      secrets.existingSecret: "my-external-secret"
      secrets.apiKey: "ignored"
    asserts:
      - hasDocuments:
          count: 0
