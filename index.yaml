      artifacthub.io/readme: "<img src=\"https://raw.githubusercontent.com/GreenKubeCloud/GreenKube/refs/heads/gh-pages/assets/greenkube-logo.png\"
        alt=\"GreenKube Logo\" height=\"80\">\n\n# GreenKube\n\n**Measure, understand,
        and reduce the carbon footprint of your Kubernetes infrastructure.**\n\nGreenKube
        is an open-source FinGreenOps platform for Kubernetes. It gives DevOps, SRE,
        and FinOps teams real-time carbon visibility and cost control — without complex
        setup or expensive SaaS tooling.\n\n[![License: Apache 2.0](https://img.shields.io/badge/License-Apache_2.0-blue.svg)](https://opensource.org/licenses/Apache-2.0)\n[![Docker
        Pulls](https://img.shields.io/docker/pulls/greenkube/greenkube)](https://hub.docker.com/r/greenkube/greenkube)\n[![Python
        Coverage](https://img.shields.io/badge/coverage%20python-90%25-brightgreen)](tests/)\n[![Frontend
        Coverage](https://img.shields.io/badge/coverage%20frontend-93%25-brightgreen)](frontend/tests/)\n[![Tests](https://img.shields.io/badge/tests-1076%20passed-brightgreen)](tests/)\n[![Build
        in Public](https://img.shields.io/badge/Build%20in-Public-blueviolet)](CHANGELOG.md)\n\n>**Live
        demo:** [demo.greenkube.cloud](https://demo.greenkube.cloud) — explore the
        full dashboard with realistic sample data, no install required.\n\n---\n\n##
        What it does\n\n- **Estimates** the energy consumption and CO₂e emissions
        of each Kubernetes workload, using CPU metrics from Prometheus and cloud instance
        power profiles.\n- **Visualises** those metrics in a real-time web dashboard
        with per-pod data, node inventory, and namespace breakdowns.\n- **Recommends**
        concrete optimizations to simultaneously reduce cloud spend and carbon footprint
        — rightsizing, zombie pod cleanup, autoscaling candidates, and more.\n- **Reports**
        historical emissions and cost data, exportable as CSV or JSON for CSRD/ESRS
        E1 compliance.\n- **Integrates** with Prometheus and Grafana to expose GreenKube
        metrics alongside the rest of your cluster observability stack.\n\n---\n\n##
        Screenshots\n\n| Grafana dashboard |\n|------------------|\n| <img src=\"assets/grafana-dashboard-top-panel.png\"
        width=\"460\"> |\n\n### Frontend screenshots \n\n| Dashboard | Metrics |\n|----------|----------|\n|
        <img src=\"assets/demo-dashboard.png\" width=\"460\"> | <img src=\"assets/demo-metrics.png\"
        width=\"460\"> |\n\n| Nodes | Recommendations |\n|----------|----------|\n|
        <img src=\"assets/demo-nodes.png\" width=\"460\"> | <img src=\"assets/demo-recommendations.png\"
        width=\"460\"> |\n\n| Report | Settings |\n|----------|----------|\n| <img
        src=\"assets/demo-report.png\" width=\"460\"> | <img src=\"assets/demo-settings.png\"
        width=\"460\"> |\n\n---\n\n## Documentation\n\n| Document | Description |\n|----------|-------------|\n|
        [Architecture](docs/architecture.md) | Technical architecture, data flow,
        and component breakdown |\n| [Power estimation methodology](docs/power_estimation_methodology.md)
        | How energy and CO₂e are calculated |\n| [Configuration](docs/configuration.md)
        | All Helm values and environment variables |\n| [API Reference](docs/api.md)
        | REST API endpoints, parameters, and examples |\n| [CLI Reference](docs/cli.md)
        | `greenkube report`, `recommend`, and other CLI commands |\n| [Prometheus
        & Grafana](docs/prometheus-grafana.md) | ServiceMonitor setup and Grafana
        dashboard import |\n| [Sustainability score](docs/sustainability-score.md)
        | How the 0–100 composite score is computed |\n| [Changelog](CHANGELOG.md)
        | Version history |\n\n---\n\n## Installation\n\nThe recommended deployment
        method is the official Helm chart.\n\n```bash\nhelm repo add greenkube https://GreenKubeCloud.github.io/GreenKube\nhelm
        repo update\nhelm install greenkube greenkube/greenkube \\\n  -n greenkube
        \\\n  --create-namespace\n```\n\nOnce deployed, access the dashboard:\n\n```bash\nkubectl
        port-forward svc/greenkube-api 8000:8000 -n greenkube\n# Open http://localhost:8000\n```\n\n###
        Key configuration variables\n\nCreate a `my-values.yaml` to customise your
        deployment:\n\n```yaml\nsecrets:\n  # Electricity Maps API token for real-time
        grid carbon intensity.\n  # Free token: https://www.electricitymaps.com/\n
        \ electricityMapsToken: \"\"\n\nconfig:\n  prometheus:\n    url: \"\"              #
        Leave empty for automatic in-cluster discovery\n    queryRangeStep: 5m   #
        Metric collection window\n```\n\nApply it:\n\n```bash\nhelm upgrade greenkube
        greenkube/greenkube \\\n  -n greenkube \\\n  -f my-values.yaml\n```\n\nFor
        the full list of available variables, see the [Configuration reference](docs/configuration.md).\n\n###
        Dependencies\n\nGreenKube auto-discovers the following services. No manual
        configuration is required in most cases.\n\n| Service | Purpose | Required?
        |\n|---------|---------|-----------|\n| Prometheus | CPU, memory, network,
        disk metrics | Strongly recommended |\n| OpenCost | Cost allocation data |
        Optional |\n\n### On-premises clusters\n\nCloud providers expose zone labels
        on nodes automatically. On bare-metal clusters, label your nodes manually:\n\n```bash\nkubectl
        label nodes --all topology.kubernetes.io/zone=FR\n```\n\nThen set `config.cloudProvider:
        on-prem` and `config.defaultZone: FR` in your values. See the [Configuration
        reference](docs/configuration.md#on-premises-and-bare-metal-clusters) for
        details.\n\n---\n\n## Try the demo locally\n\n```bash\ndocker run --rm -p
        9000:9000 greenkube/greenkube demo --no-browser --port 9000\n# Open http://localhost:9000\n```\n\nThis
        generates 30 days of sample data for 22 pods across 5 namespaces and 3 nodes,
        including carbon emissions, costs, and optimization recommendations.\n\n---\n\n##
        Contributing\n\nContributions are welcome. See [CONTRIBUTING.md](CONTRIBUTING.md)
        to get started.\n\n```bash\ngit clone https://github.com/GreenKubeCloud/GreenKube.git\ncd
        GreenKube\npython -m venv .venv && source .venv/bin/activate\npip install
        -e \".[dev,test]\"\npytest\n```\n\n---\n\n## Licence\n\nLicensed under the
        [Apache 2.0 License](LICENSE).\n"
