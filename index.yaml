          description: "Routes: `POST /api/v1/recommendations/{id}/apply-pr`, `GET …/apply-pr/eligibility`, `GET /api/v1/automation/operations/{operation_id}` (use the plans API and `eligibility`) and `POST…"
        - kind: removed
          description: "Settings and runtime configuration: `LOW_NODE_CPU_THRESHOLD`, `PROMETHEUS_QUERY_RANGE_MAX_SAMPLES` and `SERVICE_URL_ALLOWLIST` (and their Helm values), runtime configuration overrides stored in the…"
        - kind: removed
          description: "Helm: `values-production.yaml`, the standalone two-container pod, the production deployments, the migration Job, the credential-check and ServiceMonitor CRD hooks, and the…"
        - kind: fixed
          description: "CPU and memory measurement: no more doubled CPU and memory from pod-cgroup or duplicate series; consecutive windows no longer share, skip or shift samples; NaN/Inf samples are dropped; CPU of…"
        - kind: fixed
          description: "Stored rows: windows with no data, re-collections and missing pods no longer erase or degrade stored rows; failed Kubernetes or carbon-intensity reads fail the window instead of dropping rows…"
        - kind: fixed
          description: "Workload identity: pod owners follow the controller chain (a ReplicaSet resolves to its Deployment or Argo Rollout, a Job to its CronJob); static control-plane pods no longer receive…"
        - kind: fixed
          description: "OpenCost costs: every request sends `OPENCOST_BEARER_TOKEN` or `OPENCOST_USERNAME`/`OPENCOST_PASSWORD` (an authenticated OpenCost yielded no cost); same-named pods in different namespaces or…"
        - kind: fixed
          description: "Carbon data: Boavizta values are used (every lookup failed and fell back to a flat 100 kg per node); stale or default intensities are no longer used as measured; the default zone gets live…"
        - kind: fixed
          description: "Recommendations: rightsizing prices CPU and memory separately and never claims more than the container costs; young workloads are no longer projected 168 times too low; OOM-killed containers get a…"
        - kind: fixed
          description: "Verification and ledger: ledger compression no longer loses half of the savings; accrual no longer double counts on restart or failover; failed, inconclusive or reverted outcomes no longer accrue…"
        - kind: fixed
          description: "GitOps delivery: GitLab merge requests can be opened again (approved plans went `stale`); sync is confirmed when a later commit contains the merge; GitHub PRs closed unmerged and GitLab fast-forward…"
        - kind: fixed
          description: "Operations and UI: the bundled PostgreSQL runs without a root init container (Pod Security `restricted`); the API key is no longer asked after every reload; page loads no longer trigger full scans…"
        - kind: security
          description: "CORS and rate limiting: wildcard CORS is never combined with credentials and CORS is same-origin by default; rate limiting keys per route and on the rightmost untrusted `X-Forwarded-For` hop…"
        - kind: security
          description: "Git credentials: the default Git token is never sent to a host it was not issued for; remote chart fetches never follow cross-host redirects with tokens or reach loopback, link-local or metadata…"
        - kind: security
          description: "Secrets and keys: the credentials Secret is read through a Role limited to its name and the API can no longer patch it; no full-admin key is generated in browser modes; HSTS on HTTPS; PostgreSQL…"
        - kind: security
          description: "Code scanning: the frontend no longer depends on vulnerable `@sveltejs/kit` 2.x (`npm audit` is clean); log lines quoting request data escape line breaks; oversized durations and steps are rejected…"
