          description: "Advisory analyzers: zombie pods, idle namespaces, off-peak scaling, autoscaling candidates, carbon-aware scheduling and over/under-provisioned nodes."
        - kind: removed
          description: "Karpenter NodePool connector and source priority: `RECOMMENDATION_KARPENTER_ENABLED` (`config.recommendations.karpenterEnabled`) and `RECOMMENDATION_SOURCE_PRIORITY`…"
