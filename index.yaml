          description: "The bootstrap key `GREENKUBE_API_KEY` (still an admin key unless `auth.legacyApiKey` says otherwise); use accounts and scoped keys."
        - kind: deprecated
          description: "The flat `total_*`, `measured_*` and `prorated_*` fields of `GET /recommendations/savings`, `is_estimated`, `RECOMMENDATION_RANKING_WEIGHTS` and the worker's `--queue` option."
