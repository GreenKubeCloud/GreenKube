          description: "Large Grafana dashboard: `dashboards/greenkube-grafana.json` (Grafana.com dashboard 25377); import `dashboards/greenkube-operations.json` instead."
        - kind: removed
          description: "Footprint and recommendation series on `/prometheus/metrics`: every `greenkube_pod_*`, `greenkube_namespace_*` and `greenkube_node_*` family, cluster footprint totals, grid intensity, PUE…"
