    apiVersion: v2
    appVersion: 0.4.0
    created: "2026-11-24T23:37:56.155353511Z"
    description: GreenKube is an open-source Kubernetes optimization loop. It sizes
      container requests from measured usage (corroborated by VPA and KRR when present),
      ranks the changes by impact and risk, delivers them as reviewable GitOps pull
      requests for Argo CD and Flux, verifies the sync, and measures the cost and
      CO₂e savings each change realizes.
    digest: fac0c0bd5e970cc4178e60b6aa0a2d911e1c618b551e9ddeded73563f8b96e9b
