apiVersion: v1
entries:
  greenkube:
  - annotations:
      artifacthub.io/category: integration-delivery
      artifacthub.io/changes: |
        - kind: added
          description: "Gap-aware collection: collection runs on wall-clock steps behind a per-installation watermark and catches up missing windows oldest first."
        - kind: added
          description: "Collection coverage and health: every step is recorded as `collected`, `empty`, `failed` or `gap`; `GET /api/v1/collection/coverage` returns the coverage ratio and holes, and `GET /api/v1/health`…"
        - kind: added
          description: "Provenance and metadata history: pod and container rows record the source of each dimension (`cost_source`, `usage_source`, `power_source`, `intensity_source`, ...), OpenCost cost components…"
        - kind: added
          description: "Impact Model: reservation-aware allocation of energy, operational and embodied CO2e and cost, with an explicit `__idle__` row per node so pod and idle rows add up to node totals; memory power…"
        - kind: added
          description: "Embodied emissions: values come from Boavizta, the node annotation `greenkube.io/embodied-kg` or `config.boavizta.embodiedKgByInstanceType`, with a per-vCPU fallback…"
        - kind: added
          description: "Node idle share in reports: `/metrics/summary`, `/metrics/timeseries` and `/report/summary` return the idle share and `cluster_total_*` (allocated + idle); `/report/export?include_idle=true` adds…"
        - kind: added
          description: "Impact projections and cost fallback: every recommendation carries an `impact` projection (cost and CO2e, capacity released, unit prices and their source)."
        - kind: added
          description: "Released capacity: projected (core-, GiB-, replica- and node-hours per year) on every recommendation and measured with a capacity verdict on each decided change, never converted to money."
        - kind: added
          description: "Change records and measurement: every applied workload revision is stored as an immutable change with a frozen 7-day baseline (`GET /api/v2/changes[/{id}[/measurements]]`)."
        - kind: added
          description: "Drift and reliability fixes: a realized change moves to `regressed` when it loses `CHANGE_DRIFT_THRESHOLD` of its saving for `CHANGE_DRIFT_SUSTAINED_DAYS`."
        - kind: added
          description: "Savings ledger v2: append-only signed entries per method (`projected`, `measured_allocated`, `realized_billed`, `user_declared`) and accounting basis, with reversals and restatements once a…"
        - kind: added
          description: "Ledger operations: `greenkube db ledger-rotate-key` records a chain key rotation; `greenkube db ledger-accept-head` accepts the ledger head after a restore or failover lost entries."
        - kind: added
          description: "Scheduled scans and optimization runs: leader-gated scans every `RECOMMENDATION_SCAN_INTERVAL` (`config.recommendations.scanInterval`); `POST /api/v1/optimization/runs`, `GET…"
        - kind: added
          description: "Expected-value ranking and risk model: each recommendation carries a `value` block (annual value, success probability, incident and effort cost) tuned by `RECOMMENDATION_INCIDENT_COST`…"
        - kind: added
          description: "Two-way rightsizing: reliability increases (`RIGHTSIZING_INCREASE_THRESHOLD`, capped by `RIGHTSIZING_MAX_INCREASE_FACTOR`), limit advice (`RECOMMENDATION_LIMITS_POLICY`), a coverage requirement for…"
        - kind: added
          description: "Eligibility and recommendation v2 API: every recommendation carries server-side `eligibility` (`can_open_pr`, delivery modes, blockers and warnings with their fix…"
        - kind: added
          description: "Recommendation sources: a source SDK and registry (built-in sources, third-party plugins from `greenkube.sources` entry points) with isolation, timeouts and persisted runs; `GET /api/v1/sources`…"
        - kind: added
          description: "Deletion recommendations: orphaned LoadBalancers and PersistentVolumes must look unused for `DELETION_MIN_UNUSED_DAYS` and list their evidence; they become reviewed pull requests (never…"
        - kind: added
          description: "Manual mode: `GET /api/v1/recommendations/{id}/manual` returns `kubectl` steps, a patch and a diff; `POST …/manual/applied` records a hand-applied change so it is measured; an Apply manually panel…"
        - kind: added
          description: "Always-on GitOps automation: Git providers are inferred from Argo CD and Flux sources and delivery activates when the Secret `greenkube-git-credentials` exists (a token, or a GitHub App with signed…"
        - kind: added
          description: "Pull requests and plans: PR template v2 with configurable title, labels, drafts for high-risk plans, CODEOWNERS reviewers, a `greenkube/validation` commit status and one lifecycle comment…"
        - kind: added
          description: "Git provider observability and setup: per-operation call budget, `greenkube_git_provider_*` metrics and the `GreenKubeGitProviderRateLimited` alert; a guided setup checklist (`GET…"
        - kind: added
          description: "Accounts and sessions: `API_AUTH_MODE=session` with server-side sessions, `HttpOnly` cookies, CSRF protection and login rate limiting (`/api/v1/auth/*`, `auth.session.*`); `greenkube auth…"
        - kind: added
          description: "API keys and single sign-on: scoped API keys (`read`, `write`, `approve`, `signals:write`, `signals:report`, `plans:deliver`, `metrics:read`, `admin`) and a generated scrape token…"
        - kind: added
          description: "Helm chart: a credentials bootstrap hook that generates credentials once and keeps them on uninstall; `values.schema.json`; Ingress and Gateway API HTTPRoute templates; per-component scheduling…"
        - kind: added
          description: "Operations monitoring: controller metrics and health on `controller.metricsPort` (9102: `/healthz`, `/readyz`, `/loops`) with a ServiceMonitor; PrometheusRule groups for the controller, loops…"
        - kind: added
          description: "UI and docs: a savings-first Overview, recommendation detail, Changes, Ledger, Sources, Setup and Footprint pages, and account, session, API key and user pages; recommendation cards show expected…"
        - kind: added
          description: "Demo: `greenkube demo` shows GreenKube in daily use: a configured Gitea provider with Argo CD and Flux sources, twelve automation plans at every stage (preview awaiting approval, pull request open…"
        - kind: changed
          description: "Process layout: collection, scans and plan execution run in the controller; the API is stateless and safe to scale (`api.replicas`, `controller.replicas`, optional `worker.replicas`)."
        - kind: changed
          description: "GreenKube's measured value decides the size: VPA, Goldilocks, KRR and pushed signals no longer replace the native rightsizing value; agreeing sources raise its confidence and contested ones lower…"
        - kind: changed
          description: "Recommendations: a new `pr_open` status while a pull request is open; percentiles use per-step values and projections annualize over observed coverage; decreases no longer flap; OOM kills and…"
        - kind: changed
          description: "Verification: the previous (interim) verifier remains only with `CHANGE_MEASUREMENT_ENABLED=false` and its savings are reported apart; otherwise change measurement decides, with windows starting at…"
        - kind: changed
          description: "Savings API and metrics: `GET /api/v1/recommendations/savings` returns separate, never-summed blocks (`projected_annual`, `run_rate_annual`, `realized_to_date`, `projected_to_date`…"
        - kind: changed
          description: "Fail-closed behaviour: collection under a different cluster UID, decreases with unknown OOM/restart history, missing evidence, unmanaged or ambiguous resource bindings and remote GitOps destinations…"
        - kind: changed
          description: "GitOps delivery: previewing a workload again supersedes its unapproved plans; plan branches are created at the validated commit; HPA gates apply only to what an HPA scales; roles are enforced per…"
        - kind: changed
          description: "UI: navigation is Overview, Recommendations, Changes, Ledger, Footprint, Automation, Sources, Setup, Settings (`/report` and `/nodes` redirect under `/footprint`); savings read \"saves $X/yr\" and…"
        - kind: changed
          description: "Build and CI: the frontend moved to SvelteKit 3 and the image builds it with Node 22; CI pins every action by SHA, gates coverage at 80% and runs an end-to-end loop on Minikube…"
