# Central configuration file for the GreenKube project
# Uses PEP 621 standard for project metadata

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "greenkube"
version = "0.3.1"
authors = [
  { name = "Hugo Lelievre", email = "hugo.lelievre@greenkube.cloud" },
]
description = "Open-source Kubernetes optimization loop: aggregate recommendations (GreenKube, VPA, Goldilocks, Karpenter), deliver them as GitOps pull requests, and measure the cost and CO2e savings each change realizes."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
keywords = [
    "kubernetes",
    "k8s",
    "optimization",
    "rightsizing",
    "gitops",
    "argocd",
    "flux",
    "pull-request",
    "vpa",
    "karpenter",
    "finops",
    "cloud-cost",
    "greenops",
    "carbon",
    "co2",
    "carbon-footprint",
    "sustainability",
    "green-software",
    "prometheus",
    "opencost",
    "sre",
    "devops",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
]

# Production dependencies
# These are the libraries required for the tool to run
dependencies = [
    "typer>=0.9.0", # For building a clean command-line interface (CLI)
    "httpx>=0.25.0",  # Async HTTP client
    "pydantic>=2.4.0",   # For data validation and modeling
    "pydantic-settings>=2.3.0", # For settings management via env vars, .env files, and secrets
    "asyncpg>=0.28.0", # Async PostgreSQL database adapter
    "aiosqlite>=0.19.0", # Async SQLite driver
    "kubernetes_asyncio>=28.0.0", # Async Kubernetes client
    "anyio>=4.0.0", # High level async library
    "aiofiles>=23.2.0", # Async file I/O
    "fastapi>=0.109.0", # Web API framework
    "uvicorn[standard]>=0.25.0", # ASGI server for FastAPI
    "prometheus_client>=0.19.0", # Prometheus metrics exposition
    "limits>=3.0", # Sliding-window rate limiting
    "packaging>=23.0", # Required by limits on Python 3.14+
    "structlog>=24.1.0",
    "ruamel.yaml>=0.18.0", # Round-trip YAML editing for the GitOps PR bot
]

[project.urls]
"Homepage" = "https://greenkube.cloud"
"Documentation" = "https://docs.greenkube.cloud/"
"Repository" = "https://github.com/GreenKubeCloud/GreenKube"
"Bug Tracker" = "https://github.com/GreenKubeCloud/GreenKube/issues"
"Changelog" = "https://github.com/GreenKubeCloud/GreenKube/blob/main/CHANGELOG.md"
"Docker Hub" = "https://hub.docker.com/r/greenkube/greenkube"

# CLI entry point
# This creates the `greenkube` command in the user's terminal
[project.scripts]
greenkube = "greenkube.cli.main:app"
greenkube-api = "greenkube.api.app:main"

# Development tool configuration (optional but recommended)
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
asyncio_mode = "auto"
markers = [
    "database: real database integration tests shared by SQLite and PostgreSQL adapters",
]
filterwarnings = [
    # Ignore RuntimeWarning from AsyncMock internals (Python 3.11+ issue with coroutines)
    "ignore:coroutine 'AsyncMockMixin._execute_mock_call' was never awaited:RuntimeWarning",
    # Ignore RuntimeWarning emitted by mock/pydantic internals when run_demo coroutine
    # is left unawaited after a MagicMock replaces the async function in demo tests.
    # This originates from unittest.mock, <frozen os>, and pydantic — not our code.
    "ignore:coroutine 'run_demo' was never awaited:RuntimeWarning",
]

[dependency-groups]
test = [
    "respx",
    "pytest-asyncio",
    "pytest>=7.0",
    "pytest-mock",
    "pytest-cov",
]
dev = [
    "pre-commit",
    "pyrefly>=1.1.1",
    "ruff",
    "toml",
    "ruamel.yaml",
]

[tool.uv]
default-groups = ["dev", "test"]

[tool.hatch.version]
path = "src/greenkube/__init__.py"

[tool.ruff]
# Formatting and linting rules for clean code
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "G"] # Basic rules + flake8-logging-format (lazy %-formatting)

[tool.ruff.lint.per-file-ignores]
# Allow f-string logging in data loaders (one-time startup, not perf-sensitive)
"src/greenkube/data/*.py" = ["G"]

[tool.coverage.run]
# Use the package name so coverage works both locally (editable install)
# and in CI (regular install into site-packages).
source = ["greenkube"]
omit = [
    "*/greenkube/demo/*",
    "*/greenkube/data/*",
]

[tool.coverage.report]
# Fail if total coverage drops below this percentage (enforced by pytest-cov in CI)
fail_under = 80
show_missing = true
skip_covered = false

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
# scripts/leads is a local, gitignored commercial tool — not part of the project.
project-excludes = ["scripts/leads/**"]
search-path = ["src", "examples/greenkube-source-example/src"]
