apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: payments
  namespace: flux-system
spec:
  targetNamespace: prod
  chart:
    spec:
      chart: ./charts/payments
      version: 1.0.0
      sourceRef:
        kind: GitRepository
        name: gitops
        namespace: flux-system
      valuesFiles:
        - charts/payments/values-prod.yaml
