apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: payments
  namespace: prod
spec:
  releaseName: payments
  targetNamespace: prod
  chart:
    spec:
      chart: payments
      version: 1.4.2
      sourceRef:
        kind: HelmRepository
        name: acme
        namespace: flux-system
  values:
    resources:
      requests:
        cpu: 500m
  valuesFrom:
    - kind: ConfigMap
      name: payments-values
      valuesKey: values-prod.yaml
    - kind: Secret
      name: payments-secrets
      valuesKey: secrets.yaml
      optional: true
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: payments-api
              namespace: prod
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: payments-api
                namespace: prod
              spec:
                template:
                  spec:
                    containers:
                      - name: api
                        resources:
                          requests:
                            cpu: 500m
